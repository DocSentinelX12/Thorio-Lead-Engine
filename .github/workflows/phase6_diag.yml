name: Phase 6 diagnostic

on:
  push:
    paths:
      - .github/workflows/phase6_diag.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          python -m pip install pytest pytest-timeout
      - name: Apply Phase 6 patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/phase6_fix.yml')
          text = workflow.read_text()
          marker = '          python - <<\'PY\'\n'
          body = text.split(marker, 1)[1].split('\n          PY', 1)[0]
          exec(textwrap.dedent(body), {'__name__': '__phase6_patch__'})
          PY
      - name: Capture regression test output
        run: |
          set +e
          python -m pytest -vv -ra --tb=long lead_engine/test_phase6_opportunity_dedupe.py > phase6-test.log 2>&1
          status=$?
          cat phase6-test.log
          python -m compileall -q lead_engine >> phase6-test.log 2>&1
          echo "PYTEST_EXIT=$status" >> phase6-test.log
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase6-regression-diagnostic
          path: phase6-test.log
          if-no-files-found: error
