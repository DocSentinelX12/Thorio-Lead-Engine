name: Physical Lightning GPU Acquisition Proof

on:
  workflow_dispatch:
    inputs:
      studio_name:
        description: "Lightning Studio name used for this proof"
        required: true
        default: "thorio-gpu-proof"
        type: string
      machine:
        description: "Free-tier Lightning GPU machine type"
        required: true
        default: "T4"
        type: string

permissions:
  contents: read

concurrency:
  group: physical-lightning-gpu-proof
  cancel-in-progress: true

jobs:
  physical-lightning-proof:
    name: Acquire and verify one real Lightning GPU
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LIGHTNING_USER_ID: ${{ secrets.THORIO_LIGHTNING_USER_ID }}
      LIGHTNING_API_KEY: ${{ secrets.THORIO_LIGHTNING_API_KEY }}
      THORIO_COMPUTE_COORDINATOR_URL: ${{ secrets.THORIO_COMPUTE_COORDINATOR_URL }}
      THORIO_COMPUTE_AUTH_TOKEN: ${{ secrets.THORIO_COMPUTE_AUTH_TOKEN }}
      THORIO_LIGHTNING_FREE_GPU_HOURS_REMAINING: ${{ secrets.THORIO_LIGHTNING_FREE_GPU_HOURS_REMAINING }}
      THORIO_LIGHTNING_STUDIO: ${{ inputs.studio_name || 'thorio-gpu-proof' }}
      THORIO_LIGHTNING_MACHINE: ${{ inputs.machine || 'T4' }}
      THORIO_LIGHTNING_REF: ${{ github.ref_name }}
      THORIO_LIGHTNING_OFFER_TTL_SECONDS: "1200"
      THORIO_LIGHTNING_SSH_TIMEOUT_SECONDS: "900"

    steps:
      - name: Check out exact ref
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Verify physical-proof credentials are present
        shell: bash
        run: |
          set -euo pipefail
          test -n "${LIGHTNING_USER_ID}"
          test -n "${LIGHTNING_API_KEY}"
          test -n "${THORIO_COMPUTE_COORDINATOR_URL}"
          test -n "${THORIO_COMPUTE_AUTH_TOKEN}"
          test -n "${THORIO_LIGHTNING_FREE_GPU_HOURS_REMAINING}"
          echo "Required Lightning and coordinator credentials are present."

      - name: Install Lightning SDK and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade lightning-sdk pytest
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

      - name: Verify Lightning CLI authentication
        shell: bash
        run: |
          set -euo pipefail
          lightning --help >/dev/null
          lightning studio list >/dev/null
          echo "Lightning CLI authentication verified."

      - name: Run Lightning adapter regression tests
        run: |
          python -m pytest -vv -ra --tb=short             tests/test_lightning_free_compute.py             tests/test_lightning_coordinator_wiring.py             tests/test_lightning_worker_enrollment.py

      - name: Acquire real free Lightning GPU and verify physical execution
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          import tempfile

          from lead_engine.free_compute_acquisition import FreeComputeAcquisitionManager, FreeComputeAcquisitionStore
          from lead_engine.lightning_free_compute import LightningFreeComputeProvider

          proof_sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()

          with tempfile.TemporaryDirectory() as directory:
              store = FreeComputeAcquisitionStore(os.path.join(directory, "acquisition.sqlite3"))
              manager = FreeComputeAcquisitionManager(store)
              provider = LightningFreeComputeProvider.from_environment()
              manager.register(provider)

              discovery = manager.discover()
              offers = tuple(discovery["offers"])
              if len(offers) != 1:
                  raise SystemExit(f"Expected exactly one Lightning free offer, found {len(offers)}")
              offer = next(item for item in provider.discover_free() if item.offer_id == offers[0]["offer_id"])
              acquired = manager.acquire(offer)

              bootstrap = acquired.enrollment.get("worker_bootstrap") or {}
              physical = bootstrap.get("physical_gpu_execution") or []
              ssh = bootstrap.get("ssh") or {}
              enrollment = bootstrap.get("coordinator_enrollment") or {}
              worker_id = str(bootstrap.get("worker_id") or "").strip()
              gpu_resources = bootstrap.get("gpu_resources") or []

              if not worker_id or not gpu_resources:
                  raise SystemExit("Lightning proof produced no worker/GPU identity evidence.")
              if not physical:
                  raise SystemExit("Lightning proof produced no physical CUDA execution evidence.")
              if ssh.get("session_executed") is not True or ssh.get("verification") != "authenticated_ssh_session":
                  raise SystemExit("Lightning proof did not verify an authenticated SSH session.")
              if enrollment.get("attempted") is not True or enrollment.get("status") != "registered":
                  raise SystemExit("Lightning proof did not verify authenticated Thorio coordinator enrollment.")

              manager.confirm_worker_enrollment(
                  acquisition_id=acquired.acquisition_id,
                  worker_id=worker_id,
                  verification=bootstrap,
              )
              final = next(item for item in store.records() if item["acquisition_id"] == acquired.acquisition_id)
              if final["status"] != "verified":
                  raise SystemExit(f"Lightning physical acquisition did not reach verified state: {final['status']}")

              proof = {
                  "verified": True,
                  "proof_branch": "${{ github.ref_name }}",
                  "proof_sha": proof_sha,
                  "provider_id": acquired.provider_id,
                  "domain_id": acquired.domain_id,
                  "acquisition_id": acquired.acquisition_id,
                  "worker_id": worker_id,
                  "gpu_uuids": sorted(
                      str(item.get("gpu_uuid") or "")
                      for item in gpu_resources
                      if isinstance(item, dict) and item.get("gpu_uuid")
                  ),
                  "physical_gpu_execution": physical,
                  "ssh_verification": ssh,
                  "coordinator_enrollment": enrollment,
                  "free_only": True,
              }
              print("THORIO_PHYSICAL_LIGHTNING_GPU_PROOF " + json.dumps(proof, sort_keys=True))
              manager.release(acquired)
          PY
