name: Phase 6 fix

on:
  push:
    paths:
      - .github/workflows/phase6_fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply strict final-only deduplication
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Model: explicit canonical need, populated only after research/qualification.
          p = Path('lead_engine/models.py')
          s = p.read_text()
          if '    business_need: str = ""' not in s:
              s = s.replace('    signal_type: str = ""\n    source_url: str = ""', '    signal_type: str = ""\n    business_need: str = ""\n    source_url: str = ""')
          p.write_text(s)

          # Discovery identity: persistence only. Include the observed signal so
          # source/company/person reuse cannot collapse separate discoveries.
          p = Path('lead_engine/lead_identity.py')
          s = p.read_text()
          start = s.index('def lead_identity(')
          end = s.index('\n\ndef add_lead_identity(', start)
          fn = '''def lead_identity(lead: Dict[str, Any]) -> str:\n    """Persist one observed discovery signal without performing deduplication."""\n    fields = (\n        "source", "source_id", "url", "company", "person",\n        "signal", "signal_type", "job_title",\n    )\n    raw_identity = "|".join(\n        f"{field}:{normalize_identity_value(lead.get(field))}"\n        for field in fields\n    )\n    return hashlib.sha256(raw_identity.encode("utf-8")).hexdigest()\n'''
          p.write_text(s[:start] + fn + s[end:])

          # Database enumeration is used only by the final duplicate gate.
          p = Path('lead_engine/database.py')
          s = p.read_text()
          if '    def all_leads(self)' not in s:
              marker = '    def get(self, fingerprint: str) -> Optional[Dict[str, Any]]:\n'
              method = '''    def all_leads(self):\n        rows = self.conn.execute("SELECT payload FROM leads ORDER BY rowid").fetchall()\n        result = []\n        for row in rows:\n            payload = json.loads(row[0])\n            if isinstance(payload, dict):\n                result.append(payload)\n        return result\n\n'''
              s = s.replace(marker, method + marker)
          p.write_text(s)

          # Replace the old fingerprint-only final gate with the strict rule.
          p = Path('lead_engine/dedupe.py')
          p.write_text('''from __future__ import annotations\n\nimport re\nfrom typing import Any, Dict, Optional\n\nQUALIFIED_STATUSES = {"qualified", "approved", "accepted"}\n\ndef _norm(value: Any) -> str:\n    return re.sub(r"\\s+", " ", str(value or "").strip().lower())\n\nclass Dedupe:\n    """Final-only duplicate gate. Never used during discovery."""\n    def __init__(self, db):\n        self.db = db\n\n    @staticmethod\n    def _qualified(payload: Dict[str, Any]) -> bool:\n        if payload.get("qualified") is True:\n            return True\n        return any(_norm(payload.get(k)) in QUALIFIED_STATUSES for k in ("qualification_status", "review_status", "status"))\n\n    @staticmethod\n    def exact_need_key(payload: Dict[str, Any]) -> str:\n        company = _norm(payload.get("company"))\n        person = _norm(payload.get("person") or payload.get("contact_name"))\n        need = _norm(payload.get("business_need"))\n        # No verified need means no duplicate decision. Keeping the lead is mandatory.\n        if not company or not person or not need:\n            return ""\n        return f"company:{company}|person:{person}|need:{need}"\n\n    def find_exact_duplicate(self, lead: Dict[str, Any]) -> Optional[Dict[str, Any]]:\n        key = self.exact_need_key(lead)\n        if not key:\n            return None\n        current = str(lead.get("fingerprint") or "")\n        for existing in self.db.all_leads():\n            if not isinstance(existing, dict) or str(existing.get("fingerprint") or "") == current:\n                continue\n            if self._qualified(existing) and self.exact_need_key(existing) == key:\n                return existing\n        return None\n\n    def accept(self, lead):\n        raise RuntimeError("Dedupe.accept() is intentionally unavailable during discovery; use find_exact_duplicate() only from finalization.")\n''')

          # Pipeline: remove every discovery-time qualified duplicate return.
          p = Path('lead_engine/pipeline.py')
          s = p.read_text()
          pattern = re.compile(r'''        if existing is not None:\n\n            if self\._status_is_qualified\(\n                existing\n            \):.*?            stored = self\.db\.update_payload\(\n                fingerprint,\n                payload,\n            \)''', re.S)
          replacement = '''        if existing is not None:\n            # Persistence collision only. This is NOT deduplication.\n            # The signal must remain eligible for research and qualification.\n            stored = self.db.update_payload(\n                fingerprint,\n                payload,\n            )'''
          s, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit('Phase 6 failed: discovery duplicate block not found')

          # Add optional verified business_need to explicit qualification.
          s = s.replace('        reason: str = "",\n    ) -> Dict[str, Any]:', '        reason: str = "",\n        business_need: str = "",\n    ) -> Dict[str, Any]:', 1)
          s = s.replace('            qualified=qualified,\n            reason=reason,\n        )', '            qualified=qualified,\n            reason=reason,\n            business_need=business_need,\n        )', 1)

          # Put the only duplicate decision immediately after qualification checks.
          old = '''        # The existing record is the canonical record for this\n        # fingerprint. It has already passed qualification, so the\n        # finalization step must not reject the record as a duplicate\n        # of itself.\n        #\n        # Duplicate protection applies when another already-qualified\n        # canonical record exists for the same final identity.\n        #\n        # The database fingerprint remains authoritative.\n'''
          new = '''        # STRICT PHASE 6 FINAL DEDUPLICATION\n        # This is the first and only duplicate gate. It runs after research\n        # and explicit qualification. Identity, company, person, URL, domain,\n        # source, and prior observation never independently cause rejection.\n        # A duplicate requires the same company + same person + exact verified\n        # business need. If the need is missing or uncertain, keep the lead.\n        duplicate = self.dedupe.find_exact_duplicate(lead)\n        if duplicate is not None:\n            return {\n                "status": "duplicate",\n                "approved": False,\n                "duplicate": True,\n                "fingerprint": fingerprint,\n                "lead": lead,\n                "duplicate_of": duplicate.get("fingerprint"),\n                "reason": "exact_company_person_need_match",\n            }\n'''
          if old not in s:
              raise SystemExit('Phase 6 failed: finalization gate marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # Qualification API accepts the researched canonical need.
          p = Path('lead_engine/qualification.py')
          s = p.read_text()
          s = s.replace('def qualify_lead(lead: Dict[str, object], *, qualified: bool, reason: str = "") -> Dict[str, object]:', 'def qualify_lead(lead: Dict[str, object], *, qualified: bool, reason: str = "", business_need: str = "") -> Dict[str, object]:')
          needle = '    updated = dict(lead)\n    if qualified:\n'
          if needle in s and 'updated["business_need"] = str(business_need).strip()' not in s:
              s = s.replace(needle, '    updated = dict(lead)\n    if business_need:\n        updated["business_need"] = str(business_need).strip()\n    if qualified:\n', 1)
          p.write_text(s)

          # Regression tests directly encode the locked rule.
          Path('lead_engine/test_phase6_opportunity_dedupe.py').write_text('''from .dedupe import Dedupe\n\nclass DB:\n    def __init__(self, rows):\n        self.rows = rows\n    def all_leads(self):\n        return self.rows\n\ndef L(company, person, need, fp, qualified=True):\n    return {"company": company, "person": person, "business_need": need, "fingerprint": fp, "qualified": qualified, "qualification_status": "qualified" if qualified else "in_review"}\n\ndef test_different_company_same_need_is_new_lead():\n    assert Dedupe(DB([L("A", "Alex", "AI agents", "1")])).find_exact_duplicate(L("B", "Alex", "AI agents", "2")) is None\n\ndef test_same_company_different_person_same_need_is_new_lead():\n    assert Dedupe(DB([L("A", "Alex", "AI agents", "1")])).find_exact_duplicate(L("A", "Jordan", "AI agents", "2")) is None\n\ndef test_same_company_same_person_different_need_is_new_lead():\n    assert Dedupe(DB([L("A", "Alex", "AI agents", "1")])).find_exact_duplicate(L("A", "Alex", "mobile app", "2")) is None\n\ndef test_same_company_same_person_same_need_is_duplicate_only_after_qualification():\n    existing = L("A", "Alex", "AI agents", "1")\n    candidate = L("A", "Alex", "AI agents", "2", qualified=False)\n    assert Dedupe(DB([existing])).find_exact_duplicate(candidate) is None\n    candidate["qualified"] = True\n    candidate["qualification_status"] = "qualified"\n    assert Dedupe(DB([existing])).find_exact_duplicate(candidate) == existing\n\ndef test_missing_need_never_discards_lead():\n    existing = L("A", "Alex", "", "1")\n    candidate = L("A", "Alex", "", "2")\n    assert Dedupe(DB([existing])).find_exact_duplicate(candidate) is None\n''')

          # Disable the previous temporary workflow so only this implementation remains.
          old_workflow = Path('.github/workflows/phase6_apply.yml')
          if old_workflow.exists():
              old_workflow.unlink()
          Path('.github/workflows/phase6_fix.yml').unlink()
          PY
      - name: Run Phase 6 regression tests
        run: python -m pytest -q lead_engine/test_phase6_opportunity_dedupe.py
      - name: Commit verified Phase 6 structure
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lead_engine .github/workflows/phase6_apply.yml .github/workflows/phase6_fix.yml
          git commit -m 'Enforce strict final opportunity deduplication' || exit 0
          git push
