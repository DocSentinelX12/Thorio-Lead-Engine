name: Turso State Snapshot Tests

on:
  pull_request:
    paths:
      - "lead_engine/turso_state.py"
      - "tests/test_turso_state.py"
      - "tests/test_production_state_restore_workflow.py"
      - ".github/workflows/turso-state-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: turso-state-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  turso-state-tests:
    name: Turso snapshot and restore regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          python -m pip install pytest pytest-timeout

      - name: Run Turso state snapshot and restore tests
        run: python -m pytest tests/test_turso_state.py tests/test_production_state_restore_workflow.py -vv -ra --tb=short --timeout=600
