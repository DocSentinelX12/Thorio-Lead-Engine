name: Phase 6 regression diagnostic 3

on:
  push:
    paths:
      - .github/workflows/phase6_reg_diag3.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          python -m pip install pytest pytest-timeout
      - name: Apply finalize 2 state
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/phase6_finalize2.yml').read_text()
          marker = '          python - <<\'PY\'\n'
          body = source.split(marker, 1)[1].split('\n          PY', 1)[0]
          exec(textwrap.dedent(body), {'__name__': '__phase6_patch__'})
          PY
      - name: Capture regression output
        run: |
          set +e
          python -m pytest -vv -ra --tb=long lead_engine/test_phase6_opportunity_dedupe.py lead_engine/test_dedupe.py lead_engine/test_lead_fingerprint.py lead_engine/test_lead_identity.py lead_engine/test_opportunity_identity_and_agents.py lead_engine/test_pipeline_delivery_boundary.py lead_engine/test_production_integration.py > regression.log 2>&1
          status=$?
          cat regression.log
          echo "EXIT=$status" >> regression.log
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: phase6-regression-final-diagnostic
          path: regression.log
