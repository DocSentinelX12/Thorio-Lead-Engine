# Canonical manual Physical External GPU Proof workflow
name: "Physical External GPU Proof"

on:
  workflow_dispatch:
    inputs:
      run_physical_proof:
        description: "Confirm manual execution of the physical external GPU proof"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  kaggle-physical-gpu-proof:
    name: Execute Thorio CUDA probe on external Kaggle GPU
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_USERNAME: ${{ secrets.THORIO_KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.THORIO_KAGGLE_KEY }}
      THORIO_KAGGLE_KERNEL_SLUG: thorio-physical-gpu-proof-${{ github.run_id }}
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: feature/gpu-fabric-foundation

      - name: Set up Python for Kaggle CLI
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install and verify Kaggle CLI
        id: install_kaggle
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --upgrade kaggle
          command -v kaggle
          kaggle --version

      - name: Verify Kaggle token authentication without exposing credentials
        run: |
          set -euo pipefail
          if [ -z "${KAGGLE_USERNAME}" ]; then
            echo "THORIO_KAGGLE_USERNAME secret is not configured." >&2
            exit 1
          fi
          if [ -z "${KAGGLE_API_TOKEN}" ]; then
            echo "THORIO_KAGGLE_KEY secret is not configured." >&2
            exit 1
          fi
          if ! kaggle kernels list --user "${KAGGLE_USERNAME}" --page-size 1; then
            echo "Kaggle API token authentication failed." >&2
            exit 1
          fi
          echo "Kaggle token authentication verified."

      - name: Verify manual physical proof confirmation
        run: |
          set -euo pipefail
          if [ "${{ inputs.run_physical_proof }}" != "true" ]; then
            echo "Manual physical GPU proof was not confirmed." >&2
            exit 1
          fi
          echo "Manual physical GPU proof confirmation verified."

      - name: Verify free GPU quota
        run: |
          set -euo pipefail
          quota_json="$(kaggle quota --format json)"
          export KAGGLE_QUOTA_JSON="$quota_json"
          python - <<'PY'
          import json
          import os

          payload = json.loads(os.environ["KAGGLE_QUOTA_JSON"])
          if isinstance(payload, dict):
              rows = payload.get("rows")
              if not isinstance(rows, list):
                  rows = payload.get("data")
          else:
              rows = payload
          if not isinstance(rows, list):
              raise SystemExit("Kaggle quota response contains no structured rows.")
          gpu = next(
              (row for row in rows
               if isinstance(row, dict) and str(row.get("resource", "")).strip().upper() == "GPU"),
              None,
          )
          if gpu is None:
              raise SystemExit("Kaggle account reported no GPU quota.")
          remaining = str(gpu.get("remaining", "")).strip().lower()
          if not remaining.endswith("h"):
              raise SystemExit(f"Unrecognized Kaggle GPU quota value: {remaining!r}")
          hours = float(remaining[:-1])
          if hours <= 0:
              raise SystemExit("Kaggle GPU quota is exhausted.")
          print(f"Kaggle GPU quota available: {hours:.2f}h")
          PY

      - name: Allocate unique external proof kernel
        run: |
          set -euo pipefail
          kernel_ref="${KAGGLE_USERNAME}/${THORIO_KAGGLE_KERNEL_SLUG}"
          echo "Using unique physical proof kernel: ${kernel_ref}"
          echo "The run-specific kernel slug prevents overwriting another external execution and removes reliance on Kaggle kernels.get for private kernels."

      - name: Resolve exact proof revision
        id: proof_revision
        run: |
          set -euo pipefail
          proof_sha="$(git ls-remote origin "refs/heads/feature/gpu-fabric-foundation" | awk 'NR==1 {print $1}')"
          if ! printf '%s' "$proof_sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Unable to resolve an exact feature-branch commit SHA." >&2
            exit 1
          fi
          printf 'proof_sha=%s\n' "$proof_sha" >> "$GITHUB_OUTPUT"
          echo "Physical proof will be bound to $proof_sha."

      - name: Build real physical GPU proof kernel
        env:
          THORIO_PROOF_SHA: ${{ steps.proof_revision.outputs.proof_sha }}
        run: |
          set -euo pipefail

          git fetch --depth 1 origin "${THORIO_PROOF_SHA}"
          git checkout --detach "${THORIO_PROOF_SHA}"
          checked_out_sha="$(git rev-parse HEAD)"
          if [ "${checked_out_sha}" != "${THORIO_PROOF_SHA}" ]; then
            echo "Physical proof source checkout is not the resolved proof SHA." >&2
            exit 1
          fi

          probe_source="$(cat lead_engine/gpu_execution_probe.py)"
          probe_sha="$(printf '%s' "${probe_source}" | sha256sum | awk '{print $1}')"
          export PROBE_SOURCE="${probe_source}"
          export PROBE_SHA="${probe_sha}"
          export PROOF_SHA="${THORIO_PROOF_SHA}"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          probe = os.environ["PROBE_SOURCE"]
          Path("kaggle_kernel").mkdir()
          Path("kaggle_kernel/gpu_execution_probe.py").write_text(probe)
          metadata = {
              "id": os.environ["KAGGLE_USERNAME"] + "/" + os.environ["THORIO_KAGGLE_KERNEL_SLUG"],
              "title": "Thorio Physical GPU Proof " + os.environ["GITHUB_RUN_ID"],
              "code_file": "main.py",
              "kernel_type": "script",
              "language": "python",
              "enable_gpu": True,
              "machine_shape": "NvidiaTeslaT4",
              "docker_image": "gcr.io/kaggle-private-byod/python:v170",
              "enable_internet": False,
              "dataset_sources": [],
              "competition_sources": [],
              "kernel_sources": [],
              "model_sources": [],
          }
          main = f'''import json
import os
from pathlib import Path
import sys

sys.path.insert(0, str(Path(__file__).resolve().parent))
from gpu_execution_probe import run_probe

evidence = run_probe(expected_uuid=os.environ.get("EXPECTED_GPU_UUID"))
evidence["proof_sha"] = os.environ["PROOF_SHA"]
evidence["probe_source_sha256"] = os.environ["PROBE_SHA"]
Path("/kaggle/working/thorio_gpu_physical_proof.json").write_text(json.dumps(evidence, sort_keys=True))
print("THORIO_PHYSICAL_GPU_PROOF_OK")
print(json.dumps(evidence, sort_keys=True))
'''
          Path("kaggle_kernel/main.py").write_text(main)
          Path("kaggle_kernel/kernel-metadata.json").write_text(json.dumps(metadata, indent=2) + "\n")
          print("Kernel metadata and embedded probe prepared.")
          print("Probe SHA256:", os.environ["PROBE_SHA"])
          PY

      - name: Submit physical GPU kernel
        run: |
          set -euo pipefail
          kaggle kernels push -p kaggle_kernel

      - name: Collect physical GPU proof output
        run: |
          set -euo pipefail
          kernel_ref="${KAGGLE_USERNAME}/${THORIO_KAGGLE_KERNEL_SLUG}"
          deadline=$((SECONDS + 600))
          found=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            set +e
            output="$(kaggle kernels output "$kernel_ref" --path kaggle_output 2>&1)"
            status=$?
            set -e
            printf '%s\n' "$output"
            if [ "$status" -eq 0 ] && printf '%s\n' "$output" | grep -q "THORIO_PHYSICAL_GPU_PROOF_OK"; then
              found=1
              break
            fi
            rm -rf kaggle_output
            sleep 15
          done
          if [ "$found" -ne 1 ]; then
            echo "Physical external GPU proof marker was not observed within the bounded execution window." >&2
            exit 1
          fi
          test -f kaggle_output/thorio_gpu_physical_proof.json
          python - <<'PY'
          import json
          from pathlib import Path

          evidence = json.loads(Path("kaggle_output/thorio_gpu_physical_proof.json").read_text())
          if evidence.get("verified") is not True:
              raise SystemExit("Physical GPU evidence is not verified.")
          if evidence.get("backend") != "cuda":
              raise SystemExit("Physical GPU evidence does not report CUDA backend.")
          if evidence.get("checksum") != 120.0:
              raise SystemExit("Physical GPU proof checksum is invalid.")
          if not evidence.get("gpu_name"):
              raise SystemExit("Physical GPU proof did not report a GPU name.")
          print(json.dumps(evidence, indent=2, sort_keys=True))
          PY

      - name: Cleanup external proof kernel
        if: always()
        run: |
          set +e
          kernel_ref="${KAGGLE_USERNAME}/${THORIO_KAGGLE_KERNEL_SLUG}"
          kaggle kernels delete "$kernel_ref" --yes
          rm -rf kaggle_kernel kaggle_output
