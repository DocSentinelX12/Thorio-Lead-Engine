name: Physical External GPU Proof

on:
  workflow_dispatch:
    inputs:
      run_physical_proof:
        description: "Confirm manual execution of the physical external GPU proof"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  require_gpu_branch:
    name: Require GPU branch for physical proof
    runs-on: ubuntu-latest
    steps:
      - name: Require feature/gpu-fabric-foundation
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" != "feature/gpu-fabric-foundation" ]; then
            echo "Select feature/gpu-fabric-foundation in the Branch dropdown to execute the physical GPU proof."
            exit 1
          fi
          echo "Physical External GPU Proof dispatch is registered for the GPU branch."
