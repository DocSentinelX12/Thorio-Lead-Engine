name: Phase 6 finish

on:
  push:
    paths:
      - .github/workflows/phase6_finish.yml

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          python -m pip install pytest pytest-timeout
      - name: Apply Phase 6 implementation and surgical repairs
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, textwrap

          # Start from the repository's existing Phase 6 implementation patch.
          source = Path('.github/workflows/phase6_fix.yml').read_text()
          marker = "          python - <<'PY'\n"
          body = source.split(marker, 1)[1].split("\n          PY", 1)[0]
          exec(textwrap.dedent(body), {'__name__': '__phase6_patch__'})

          # Observation identity is persistence identity. Discovery time must
          # distinguish separate observations, while business dedupe remains a
          # separate finalization concern.
          Path('lead_engine/lead_identity.py').write_text('''from __future__ import annotations\nimport hashlib\nimport re\nfrom typing import Any, Dict\n\ndef normalize_identity_value(value: Any) -> str:\n    return re.sub(r"\\s+", " ", str(value or "").strip().lower())\n\ndef lead_identity(lead: Dict[str, Any]) -> str:\n    parts = (\n        ("source", lead.get("source")),\n        ("source_id", lead.get("source_id")),\n        ("url", lead.get("url") or lead.get("source_url")),\n        ("company", lead.get("company")),\n        ("person", lead.get("person") or lead.get("contact_name")),\n        ("job_title", lead.get("job_title")),\n        ("signal_type", lead.get("signal_type")),\n        ("discovered_at", lead.get("discovered_at")),\n    )\n    raw = "|".join(f"{key}:{normalize_identity_value(value)}" for key, value in parts)\n    return hashlib.sha256(raw.encode("utf-8")).hexdigest()\n\ndef add_lead_identity(lead: Dict[str, Any]) -> Dict[str, Any]:\n    result = dict(lead)\n    result["lead_identity"] = lead_identity(result)\n    return result\n''')

          # The Lead model must include observation time in its fingerprint and
          # carry the explicit qualification business need.
          p = Path('lead_engine/models.py')
          s = p.read_text()
          if '    business_need: str = ""' not in s:
              s = s.replace('    signal_type: str = ""\n', '    signal_type: str = ""\n    business_need: str = ""\n', 1)
          if '"discovered_at": self.discovered_at' not in s:
              s = s.replace('            "signal_type": self.signal_type,\n', '            "signal_type": self.signal_type,\n            "discovered_at": self.discovered_at,\n', 1)
          p.write_text(s)

          # Final gate: exact company + person + business_need, and only when
          # both candidate and existing record are qualified.
          Path('lead_engine/dedupe.py').write_text('''from __future__ import annotations\nimport re\nfrom typing import Any, Dict, Optional\n\nfrom .models import Lead\n\nQUALIFIED_STATUSES = {"qualified", "approved", "accepted"}\n\ndef _norm(value: Any) -> str:\n    return re.sub(r"\\s+", " ", str(value or "").strip().lower())\n\nclass Dedupe:\n    def __init__(self, db):\n        self.db = db\n\n    @staticmethod\n    def _qualified(payload: Dict[str, Any]) -> bool:\n        if payload.get("qualified") is True:\n            return True\n        return any(_norm(payload.get(key)) in QUALIFIED_STATUSES for key in ("qualification_status", "review_status", "status"))\n\n    @staticmethod\n    def exact_need_key(payload: Dict[str, Any]) -> str:\n        company = _norm(payload.get("company"))\n        person = _norm(payload.get("person") or payload.get("contact_name"))\n        need = _norm(payload.get("business_need"))\n        if not company or not person or not need:\n            return ""\n        return f"company:{company}|person:{person}|need:{need}"\n\n    def find_exact_duplicate(self, lead: Dict[str, Any]) -> Optional[Dict[str, Any]]:\n        if not self._qualified(lead):\n            return None\n        key = self.exact_need_key(lead)\n        if not key:\n            return None\n        current = str(lead.get("fingerprint") or "")\n        for existing in self.db.all_leads():\n            if not isinstance(existing, dict):\n                continue\n            if str(existing.get("fingerprint") or "") == current:\n                continue\n            if self._qualified(existing) and self.exact_need_key(existing) == key:\n                return existing\n        return None\n\n    def accept(self, lead: Lead) -> bool:\n        return self.db.insert_if_new(lead.to_dict())\n''')

          p = Path('lead_engine/database.py')
          s = p.read_text()
          if '    def all_leads(self):' not in s:
              method = '''    def all_leads(self):\n        rows = self.conn.execute("SELECT payload FROM leads ORDER BY rowid").fetchall()\n        return [json.loads(row[0]) for row in rows if isinstance(json.loads(row[0]), dict)]\n\n'''
              s = s.replace('    def pending(self, limit=50):\n', method + '    def pending(self, limit=50):\n', 1)
          p.write_text(s)

          p = Path('lead_engine/qualification.py')
          s = p.read_text()
          s = s.replace('def qualify_lead(lead: Dict[str, object], *, qualified: bool, reason: str = "") -> Dict[str, object]:', 'def qualify_lead(lead: Dict[str, object], *, qualified: bool, reason: str = "", business_need: str = "") -> Dict[str, object]:', 1)
          if 'if business_need:' not in s:
              s = s.replace('    updated = dict(lead)\n    if qualified:\n', '    updated = dict(lead)\n    if business_need:\n        updated["business_need"] = str(business_need).strip()\n    if qualified:\n', 1)
          p.write_text(s)

          # The Phase 6 patch already moves the pipeline duplicate gate to
          # finalize(). Only add the missing public business_need argument if
          # the patch did not do so.
          p = Path('lead_engine/pipeline.py')
          s = p.read_text()
          if '        business_need: str = "",\n' not in s:
              s = s.replace('        reason: str = "",\n    ) -> Dict[str, Any]:', '        reason: str = "",\n        business_need: str = "",\n    ) -> Dict[str, Any]:', 1)
          if '            business_need=business_need,\n' not in s:
              s = s.replace('            qualified=qualified,\n            reason=reason,\n        )', '            qualified=qualified,\n            reason=reason,\n            business_need=business_need,\n        )', 1)
          p.write_text(s)

          # Migrate the one legacy persistence test. This test verifies storage
          # identity, not final business-opportunity deduplication.
          Path('lead_engine/test_dedupe.py').write_text('''from .database import LeadDB\nfrom .dedupe import Dedupe\nfrom .models import Lead\n\ndef test_observation_persistence_does_not_business_dedupe(tmp_path):\n    db = LeadDB(data_dir=str(tmp_path))\n    dedupe = Dedupe(db)\n    first = Lead(source="test", source_id="same", url="https://example.com/same", company="Acme", signal="remote engineer", evidence="opening", discovered_at="2026-01-01T00:00:00+00:00")\n    second = Lead(source="test", source_id="same", url="https://example.com/same", company="Acme", signal="remote engineer", evidence="opening", discovered_at="2026-01-01T00:00:01+00:00")\n    assert dedupe.accept(first) is True\n    assert dedupe.accept(second) is True\n    assert db.stats()[0] == 2\n''')

          # Add the DB seam required by the final dedupe unit test.
          p = Path('lead_engine/test_pipeline_delivery_boundary.py')
          s = p.read_text()
          if '    def all_leads(self):' not in s:
              s = s.replace('    def mark_synced(self, fingerprint):\n', '    def all_leads(self):\n        return list(self.records.values())\n\n    def mark_synced(self, fingerprint):\n', 1)
          p.write_text(s)

          # Temporary Phase 6 workflows are tooling, not production code.
          for path in Path('.github/workflows').glob('phase6_*.yml'):
              path.unlink()
          PY
      - name: Run focused Phase 6 regression suite
        run: python -m pytest -q lead_engine/test_phase6_opportunity_dedupe.py lead_engine/test_dedupe.py lead_engine/test_lead_fingerprint.py lead_engine/test_lead_identity.py lead_engine/test_opportunity_identity_and_agents.py lead_engine/test_pipeline_delivery_boundary.py lead_engine/test_production_integration.py
      - name: Run full test suite
        run: python -m pytest -q
      - name: Commit verified Phase 6 implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lead_engine .github/workflows
          git commit -m 'Finalize strict post-qualification opportunity deduplication'
          git push
