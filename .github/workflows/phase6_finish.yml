name: Phase 6 finish

on:
  push:
    paths:
      - .github/workflows/phase6_finish.yml

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          python -m pip install pytest pytest-timeout
      - name: Apply complete Phase 6 state
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, textwrap

          # Apply the already-developed strict Phase 6 implementation exactly as
          # recorded in the repository, without depending on any stale test text.
          source = Path('.github/workflows/phase6_fix.yml').read_text()
          marker = "          python - <<'PY'\n"
          body = source.split(marker, 1)[1].split("\n          PY", 1)[0]
          exec(textwrap.dedent(body), {'__name__': '__phase6_patch__'})

          # Complete the observation identity and final-gate refinements.
          p = Path('lead_engine/models.py')
          s = p.read_text()
          if '    business_need: str = ""' not in s:
              s = s.replace('    signal_type: str = ""\n    source_url: str = ""', '    signal_type: str = ""\n    business_need: str = ""\n    source_url: str = ""')
          if '"discovered_at": self.discovered_at' not in s:
              s = s.replace('            "signal_type": self.signal_type,\n', '            "signal_type": self.signal_type,\n            "discovered_at": self.discovered_at,\n')
          p.write_text(s)

          p = Path('lead_engine/lead_identity.py')
          s = p.read_text()
          start = s.index('def lead_identity(')
          end = s.index('\n\ndef add_lead_identity(', start)
          fn = '''def lead_identity(lead: Dict[str, Any]) -> str:\n    """Return persistence identity for one observed discovery event only."""\n    fields = (\n        "source", "source_id", "url", "company", "person",\n        "signal", "signal_type", "job_title", "discovered_at",\n    )\n    raw_identity = "|".join(\n        f"{field}:{normalize_identity_value(lead.get(field))}"\n        for field in fields\n    )\n    return hashlib.sha256(raw_identity.encode("utf-8")).hexdigest()\n'''
          p.write_text(s[:start] + fn + s[end:])

          p = Path('lead_engine/dedupe.py')
          s = p.read_text()
          old = '''    def find_exact_duplicate(self, lead: Dict[str, Any]) -> Optional[Dict[str, Any]]:\n        key = self.exact_need_key(lead)\n'''
          new = '''    def find_exact_duplicate(self, lead: Dict[str, Any]) -> Optional[Dict[str, Any]]:\n        if not self._qualified(lead):\n            return None\n        key = self.exact_need_key(lead)\n'''
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)

          # Migrate the remaining legacy direct-accept test to final-only semantics.
          p = Path('lead_engine/test_dedupe.py')
          s = p.read_text()
          if 'Dedupe.accept() is intentionally unavailable' in s or 'def test_final_duplicate_requires_exact_company_person_need_and_qualification' in s:
              pass
          else:
              start = s.find('def test_duplicate_lead_is_rejected(')
              if start >= 0:
                  next_def = s.find('\ndef ', start + 5)
                  end = len(s) if next_def < 0 else next_def
                  replacement = '''def test_final_duplicate_requires_exact_company_person_need_and_qualification():\n    class DB:\n        def __init__(self, rows): self.rows = rows\n        def all_leads(self): return list(self.rows)\n\n    def lead(company, person, need, fp, qualified=True):\n        return {\n            "company": company, "person": person, "business_need": need,\n            "fingerprint": fp, "qualified": qualified,\n            "qualification_status": "qualified" if qualified else "in_review",\n        }\n\n    existing = lead("Acme", "Alex", "remote software engineer", "1", True)\n    dedupe = Dedupe(DB([existing]))\n    assert dedupe.find_exact_duplicate(lead("Beta", "Alex", "remote software engineer", "2", True)) is None\n    assert dedupe.find_exact_duplicate(lead("Acme", "Jordan", "remote software engineer", "3", True)) is None\n    assert dedupe.find_exact_duplicate(lead("Acme", "Alex", "mobile application", "4", True)) is None\n    assert dedupe.find_exact_duplicate(lead("Acme", "Alex", "remote software engineer", "5", False)) is None\n    assert dedupe.find_exact_duplicate(lead("Acme", "Alex", "remote software engineer", "6", True)) == existing\n'''
                  s = s[:start] + replacement + s[end:]
                  p.write_text(s)

          # Production repeated collection must create a fresh observation object.
          p = Path('lead_engine/test_production_integration.py')
          s = p.read_text()
          s = re.sub(
              r'    second = application\.run_sources\(\[source\]\)\n',
              '    second_source = StaticLeadSource([_lead("integration-qualified-duplicate")])\n    second = application.run_sources([second_source])\n',
              s,
              count=1,
          )
          p.write_text(s)

          # The final production test must prove no discovery duplicate is emitted,
          # then qualify and finalize the second observation into an exact duplicate.
          p = Path('lead_engine/test_production_integration.py')
          s = p.read_text()
          if 'assert second["results"][0]["result"]["duplicate_count"] == 0' not in s:
              s = s.replace('assert second["results"][0]["result"]["duplicate_count"] == 1', 'assert second["results"][0]["result"]["duplicate_count"] == 0')
          p.write_text(s)

          # Remove every temporary Phase 6 workflow. The normal CI workflows remain.
          for path in Path('.github/workflows').glob('phase6_*.yml'):
              path.unlink()
          PY
      - name: Run Phase 6 regression suite
        run: python -m pytest -q lead_engine/test_phase6_opportunity_dedupe.py lead_engine/test_dedupe.py lead_engine/test_lead_fingerprint.py lead_engine/test_lead_identity.py lead_engine/test_opportunity_identity_and_agents.py lead_engine/test_pipeline_delivery_boundary.py lead_engine/test_production_integration.py
      - name: Run full test suite
        run: python -m pytest -q
      - name: Commit verified Phase 6 implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lead_engine .github/workflows
          git commit -m 'Finalize strict post-qualification opportunity deduplication'
          git push
