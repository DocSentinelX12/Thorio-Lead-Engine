name: Daily Leads

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  find-leads:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out lite
        uses: actions/checkout@v4
        with:
          ref: lite
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the one required package
        run: pip install -r requirements.txt
      - name: Run the three small tests
        run: python -m unittest discover -s tests -v
      - name: Find and save leads
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_LEAD_TABLE: ${{ vars.AIRTABLE_LEAD_TABLE }}
        run: python find_leads.py
