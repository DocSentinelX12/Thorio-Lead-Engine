name: Physical External GPU Proof

on:
  workflow_dispatch:
    inputs:
      proof_ref:
        description: "Repository ref to test"
        required: true
        default: "main"
        type: string

permissions:
  contents: read

jobs:
  physical-external-gpu-proof:
    name: Run real CUDA proof on external Kaggle GPU
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_USERNAME: ${{ secrets.THORIO_KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.THORIO_KAGGLE_KEY }}
      THORIO_KAGGLE_KERNEL_SLUG: thorio-physical-gpu-proof-${{ github.run_id }}
      THORIO_PROOF_REF: ${{ inputs.proof_ref }}
    steps:
      - name: Check out requested proof ref
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.proof_ref }}

      - name: Install Kaggle CLI
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --upgrade kaggle
          command -v kaggle
          kaggle --version

      - name: Verify Kaggle authentication
        run: |
          set -euo pipefail
          test -n "${KAGGLE_USERNAME}" || { echo "THORIO_KAGGLE_USERNAME is not configured." >&2; exit 1; }
          test -n "${KAGGLE_API_TOKEN}" || { echo "THORIO_KAGGLE_KEY is not configured." >&2; exit 1; }
          kaggle kernels list --user "${KAGGLE_USERNAME}" --page-size 1 >/dev/null
          echo "Kaggle authentication verified."

      - name: Build physical CUDA proof kernel
        run: |
          set -euo pipefail
          mkdir -p /tmp/thorio-physical-gpu-proof

          cat > /tmp/thorio-physical-gpu-proof/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/${THORIO_KAGGLE_KERNEL_SLUG}",
            "title": "Thorio Physical External GPU Proof ${GITHUB_RUN_ID}",
            "code_file": "kernel.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "machine_shape": "NvidiaTeslaT4",
            "docker_image": "gcr.io/kaggle-private-byod/python:v170",
            "enable_internet": false,
            "dataset_sources": [],
            "competition_sources": [],
            "kernel_sources": [],
            "model_sources": []
          }
          EOF

          cat > /tmp/thorio-physical-gpu-proof/kernel.py <<'PY'
          import json
          import os
          import subprocess
          import sys
          import time

          def fail(message):
              print("THORIO_PHYSICAL_GPU_PROOF_FAILED " + json.dumps({"error": message}), flush=True)
              raise SystemExit(1)

          try:
              import torch
          except Exception as exc:
              fail(f"PyTorch import failed: {exc}")

          if not torch.cuda.is_available():
              fail("CUDA is unavailable on the external worker.")

          if torch.cuda.device_count() < 1:
              fail("No CUDA device is visible.")

          device = torch.device("cuda:0")
          props = torch.cuda.get_device_properties(device)
          gpu_uuid = str(getattr(props, "uuid", "") or "").strip()
          if not gpu_uuid:
              fail("CUDA did not expose a physical GPU UUID.")

          started = time.perf_counter()
          left = torch.arange(16, dtype=torch.float32, device=device).reshape(4, 4)
          right = torch.eye(4, dtype=torch.float32, device=device)
          result = torch.matmul(left, right)
          checksum = float(result.sum().item())
          torch.cuda.synchronize()
          elapsed_ms = (time.perf_counter() - started) * 1000.0

          if checksum != 120.0:
              fail(f"CUDA checksum mismatch: {checksum}")

          nvidia = subprocess.run(
              ["nvidia-smi", "--query-gpu=uuid,name,driver_version", "--format=csv,noheader"],
              capture_output=True,
              text=True,
              check=False,
          )

          evidence = {
              "verified": True,
              "execution_backend": "cuda",
              "operation": "torch_cuda_matmul",
              "gpu_uuid": gpu_uuid,
              "gpu_name": str(props.name),
              "cuda_device_index": 0,
              "cuda_device_count": int(torch.cuda.device_count()),
              "cuda_version": str(torch.version.cuda or ""),
              "checksum": checksum,
              "elapsed_ms": elapsed_ms,
              "proof_ref": os.environ.get("THORIO_PROOF_REF", ""),
              "nvidia_smi": nvidia.stdout.strip(),
          }

          print("THORIO_PHYSICAL_GPU_EXECUTION_PROOF " + json.dumps(evidence, sort_keys=True), flush=True)
          PY

      - name: Submit real external GPU execution
        run: |
          set -euo pipefail
          kaggle kernels push -p /tmp/thorio-physical-gpu-proof --accelerator NvidiaTeslaT4

      - name: Wait for physical GPU proof
        run: |
          set -euo pipefail
          kernel_ref="${KAGGLE_USERNAME}/${THORIO_KAGGLE_KERNEL_SLUG}"
          deadline=$((SECONDS + 600))

          while [ "$SECONDS" -lt "$deadline" ]; do
            status_output="$(kaggle kernels status "$kernel_ref" 2>&1)" || {
              echo "Kaggle kernel status could not be read:"
              echo "$status_output"
              sleep 10
              continue
            }
            echo "Kaggle kernel status: $status_output"

            if echo "$status_output" | grep -Eq 'ERROR|CANCEL_REQUESTED|CANCEL_ACKNOWLEDGED'; then
              log_file=/tmp/thorio-physical-gpu-proof.log
              kaggle kernels logs "$kernel_ref" > "$log_file" 2>&1 || true
              cat "$log_file"
              echo "Kaggle reported a terminal worker failure before physical proof." >&2
              exit 1
            fi

            log_file=/tmp/thorio-physical-gpu-proof.log
            if kaggle kernels logs "$kernel_ref" > "$log_file" 2>&1; then
              cat "$log_file"

              if grep -Fq "THORIO_PHYSICAL_GPU_EXECUTION_PROOF " "$log_file"; then
                grep -F "THORIO_PHYSICAL_GPU_EXECUTION_PROOF " "$log_file"
                echo "PHYSICAL EXTERNAL GPU PROOF VERIFIED"
                exit 0
              fi

              if grep -Fq "THORIO_PHYSICAL_GPU_PROOF_FAILED " "$log_file"; then
                echo "The external GPU kernel reported a physical CUDA proof failure." >&2
                exit 1
              fi

              if grep -Eiq "Traceback|ModuleNotFoundError|CUDA error|RuntimeError" "$log_file"; then
                echo "The external GPU kernel reported a terminal execution error." >&2
                exit 1
              fi
            else
              echo "Kaggle kernel logs are not available yet."
            fi

            sleep 10
          done

          echo "Timed out waiting for the physical external GPU proof." >&2
          exit 1

      - name: Retrieve final physical proof output
        if: success()
        run: |
          set -euo pipefail
          mkdir -p /tmp/thorio-physical-gpu-output
          kaggle kernels output "${KAGGLE_USERNAME}/${THORIO_KAGGLE_KERNEL_SLUG}"             -p /tmp/thorio-physical-gpu-output --force || true
          echo "External GPU proof artifacts:"
          find /tmp/thorio-physical-gpu-output -type f -maxdepth 3 -print || true

      - name: Delete external Kaggle proof kernel
        if: always()
        run: |
          set +e
          if [ -n "${KAGGLE_USERNAME:-}" ]; then
            kaggle kernels delete "${KAGGLE_USERNAME}/${THORIO_KAGGLE_KERNEL_SLUG}" --yes || true
          fi
