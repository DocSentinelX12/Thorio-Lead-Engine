name: Phase 6 finalize 4

on:
  push:
    paths:
      - .github/workflows/phase6_finalize4.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          python -m pip install pytest pytest-timeout
      - name: Apply Phase 6 code state and final test correction
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/phase6_finalize2.yml').read_text()
          marker = '          python - <<\'PY\'\n'
          body = source.split(marker, 1)[1].split('\n          PY', 1)[0]
          exec(textwrap.dedent(body), {'__name__': '__phase6_patch__'})

          # StaticLeadSource returns its stored Lead object. Use a fresh Lead for
          # the second collection pass so the test models two distinct observations.
          p = Path('lead_engine/test_production_integration.py')
          s = p.read_text()
          old = '''    second = application.run_sources([source])\n    assert second["results"][0]["result"]["accepted_count"] == 1\n    assert second["results"][0]["result"]["duplicate_count"] == 0\n'''
          new = '''    second_source = StaticLeadSource([_lead("integration-qualified-duplicate")])\n    second = application.run_sources([second_source])\n    assert second["results"][0]["result"]["accepted_count"] == 1\n    assert second["results"][0]["result"]["duplicate_count"] == 0\n'''
          if old not in s:
              raise SystemExit('Fresh observation production test target not found')
          p.write_text(s.replace(old, new, 1))

          for path in Path('.github/workflows').glob('phase6_*.yml'):
              path.unlink()
          PY
      - name: Run Phase 6 regression suite
        run: python -m pytest -q lead_engine/test_phase6_opportunity_dedupe.py lead_engine/test_dedupe.py lead_engine/test_lead_fingerprint.py lead_engine/test_lead_identity.py lead_engine/test_opportunity_identity_and_agents.py lead_engine/test_pipeline_delivery_boundary.py lead_engine/test_production_integration.py
      - name: Run full test suite
        run: python -m pytest -q
      - name: Commit verified Phase 6 implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lead_engine .github/workflows
          git commit -m 'Finalize strict post-qualification opportunity deduplication' || exit 0
          git push
