name: Workflow Dispatch Controller

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch-feature-workflow:
    name: Run Workflow Dispatch Controller on GPU branch
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch GPU branch workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run "workflow-dispatch-controller.yml" --repo "${GITHUB_REPOSITORY}" --ref feature/gpu-fabric-foundation
          echo "Dispatched Workflow Dispatch Controller from feature/gpu-fabric-foundation."
