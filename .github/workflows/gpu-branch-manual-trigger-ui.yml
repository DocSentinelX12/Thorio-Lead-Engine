name: GPU Branch Manual Trigger UI

on:
  workflow_dispatch:
    inputs:
      workflow_file:
        description: "GPU workflow to run"
        required: true
        type: choice
        options:
          - gpu-fabric-validation.yml
          - physical-external-gpu-proof.yml
          - physical-lightning-gpu-proof.yml
          - physical-multi-node-nccl-proof.yml
          - free-compute-fleet-verification.yml
      gpu_ref:
        description: "GPU branch or exact ref to execute"
        required: true
        default: "feature/gpu-fabric-foundation"
        type: string
      lightning_studio_name:
        description: "Lightning Studio name, only used by the Lightning proof"
        required: false
        default: "thorio-gpu-proof"
        type: string
      lightning_machine:
        description: "Lightning free-tier GPU machine, only used by the Lightning proof"
        required: false
        default: "T4"
        type: string
      nccl_proof_ref:
        description: "Exact proof ref, only used by the NCCL proof"
        required: false
        default: "feature/gpu-fabric-foundation"
        type: string
      nccl_master_addr:
        description: "Rank-0 routable address, required by the NCCL proof"
        required: false
        default: ""
        type: string
      nccl_master_port:
        description: "NCCL rendezvous port, only used by the NCCL proof"
        required: false
        default: "29500"
        type: string
      nccl_socket_ifname:
        description: "Optional NCCL socket interface, only used by the NCCL proof"
        required: false
        default: ""
        type: string
      confirm_physical_proof:
        description: "Confirm physical external GPU proof execution"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    name: Dispatch selected GPU workflow on the GPU branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate GPU branch target
        env:
          TARGET_REF: ${{ inputs.gpu_ref }}
        run: |
          set -euo pipefail
          if [ "${TARGET_REF}" != "feature/gpu-fabric-foundation" ]; then
            echo "Only feature/gpu-fabric-foundation is permitted by this manual GPU trigger." >&2
            exit 1
          fi

      - name: Dispatch GPU Fabric Validation
        if: ${{ inputs.workflow_file == 'gpu-fabric-validation.yml' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run gpu-fabric-validation.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "${{ inputs.gpu_ref }}"

      - name: Dispatch Physical External GPU Proof
        if: ${{ inputs.workflow_file == 'physical-external-gpu-proof.yml' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm_physical_proof }}" != "true" ]; then
            echo "Physical external GPU proof requires explicit confirmation." >&2
            exit 1
          fi
          gh workflow run physical-external-gpu-proof.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "${{ inputs.gpu_ref }}" \
            -f run_physical_proof=true

      - name: Dispatch Physical Lightning GPU Proof
        if: ${{ inputs.workflow_file == 'physical-lightning-gpu-proof.yml' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run physical-lightning-gpu-proof.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "${{ inputs.gpu_ref }}" \
            -f studio_name="${{ inputs.lightning_studio_name }}" \
            -f machine="${{ inputs.lightning_machine }}"

      - name: Dispatch Physical Multi-Node NCCL Proof
        if: ${{ inputs.workflow_file == 'physical-multi-node-nccl-proof.yml' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "${{ inputs.nccl_master_addr }}" ]; then
            echo "nccl_master_addr is required when the NCCL proof is selected." >&2
            exit 1
          fi
          gh workflow run physical-multi-node-nccl-proof.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "${{ inputs.gpu_ref }}" \
            -f proof_ref="${{ inputs.nccl_proof_ref }}" \
            -f master_addr="${{ inputs.nccl_master_addr }}" \
            -f master_port="${{ inputs.nccl_master_port }}" \
            -f nccl_socket_ifname="${{ inputs.nccl_socket_ifname }}"

      - name: Dispatch Free Compute Fleet Verification
        if: ${{ inputs.workflow_file == 'free-compute-fleet-verification.yml' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run free-compute-fleet-verification.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "${{ inputs.gpu_ref }}"

      - name: Report dispatched workflow
        run: |
          echo "Manual GPU workflow dispatch submitted."
          echo "Workflow: ${{ inputs.workflow_file }}"
          echo "Ref: ${{ inputs.gpu_ref }}"
