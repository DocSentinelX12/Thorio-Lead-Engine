name: Physical Multi-Node NCCL Proof

on:
  workflow_dispatch:
    inputs:
      proof_ref:
        description: "Exact branch or ref to prove"
        required: true
        default: "main"
        type: string
      master_port:
        description: "TCP port on the rank-0 fabric node used by NCCL rendezvous"
        required: true
        default: "29500"
        type: string
permissions:
  contents: read
  actions: read

concurrency:
  group: physical-multi-node-nccl-proof
  cancel-in-progress: true

env:
  THORIO_PROOF_REF: ${{ inputs.proof_ref || github.ref }}
  THORIO_PROOF_SHA: ${{ github.sha }}

jobs:
  rank:
    name: Physical NCCL rank ${{ matrix.rank }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rank: 0
          - rank: 1
    runs-on: [self-hosted, linux, x64, gpu, thorio-free-gpu, cuda]
    timeout-minutes: 15
    env:
      RANK: ${{ matrix.rank }}
      WORLD_SIZE: "2"
      LOCAL_RANK: "0"
      LOCAL_WORLD_SIZE: "1"
      THORIO_EXPECTED_WORLD_SIZE: "2"
      THORIO_EXPECTED_NNODES: "2"
      THORIO_EXPECTED_RANK: ${{ matrix.rank }}
      MASTER_PORT: ${{ inputs.master_port }}
      NCCL_DEBUG: INFO
      NCCL_DEBUG_SUBSYS: NET
      THORIO_COMPUTE_COORDINATOR_URL: ${{ secrets.THORIO_COMPUTE_COORDINATOR_URL }}
      THORIO_COMPUTE_AUTH_TOKEN: ${{ secrets.THORIO_COMPUTE_AUTH_TOKEN }}
      THORIO_NCCL_RENDEZVOUS_SESSION: physical-nccl-${{ github.run_id }}
    steps:
      - name: Check out exact proof ref
        uses: actions/checkout@v5
        with:
          ref: ${{ env.THORIO_PROOF_REF }}

      - name: Verify checked-out proof revision
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "Proof ref: ${THORIO_PROOF_REF}"
          echo "Checked-out proof SHA: ${actual}"
          if [ -z "${actual}" ]; then
            exit 1
          fi
          if [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ] && [ "${actual}" != "${THORIO_PROOF_SHA}" ]; then
            echo "Push-triggered proof did not check out the triggering commit." >&2
            exit 1
          fi
          printf 'THORIO_CHECKED_OUT_SHA=%s\n' "${actual}" >> "${GITHUB_ENV}"

      - name: Verify physical NVIDIA and NCCL prerequisites
        shell: bash
        run: |
          set -euo pipefail
          command -v nvidia-smi
          nvidia-smi -L
          python - <<'PY'
          import torch
          if not torch.cuda.is_available():
              raise SystemExit("CUDA is unavailable on this physical runner.")
          if not torch.distributed.is_nccl_available():
              raise SystemExit("PyTorch NCCL backend is unavailable on this physical runner.")
          print("CUDA and NCCL runtime are physically available.")
          print("GPU:", torch.cuda.get_device_name(0))
          properties = torch.cuda.get_device_properties(0)
          uuid = str(getattr(properties, "uuid", "") or "").strip()
          if not uuid:
              raise SystemExit("Physical GPU UUID is unavailable.")
          print("GPU UUID:", uuid)
          PY

      - name: Discover and publish rank-0 rendezvous endpoint
        if: matrix.rank == 0
        shell: bash
        run: |
          set -euo pipefail
          test -n "${THORIO_COMPUTE_COORDINATOR_URL}"
          test -n "${THORIO_COMPUTE_AUTH_TOKEN}"
          port="${MASTER_PORT}"
          if ! [[ "${port}" =~ ^[0-9]+$ ]] || [ "${port}" -lt 1 ] || [ "${port}" -gt 65535 ]; then
            echo "MASTER_PORT must be between 1 and 65535." >&2
            exit 1
          fi
          route="$(ip -4 route get 1.1.1.1 2>/dev/null || true)"
          address="$(printf '%s\n' "${route}" | awk '{for (i=1;i<=NF;i++) if ($i=="src") {print $(i+1); exit}}')"
          interface="$(printf '%s\n' "${route}" | awk '{for (i=1;i<=NF;i++) if ($i=="dev") {print $(i+1); exit}}')"
          if [ -z "${address}" ] || [ -z "${interface}" ]; then
            echo "Could not discover a routable IPv4 address and interface on rank 0." >&2
            ip -4 addr show >&2
            ip -4 route show >&2
            exit 1
          fi
          case "${address}" in
            127.*) echo "Rank-0 discovery selected loopback ${address}." >&2; exit 1 ;;
          esac
          export MASTER_ADDR="${address}"
          export NCCL_SOCKET_IFNAME="=${interface}"
          {
            printf 'MASTER_ADDR=%s\n' "${address}"
            printf 'NCCL_SOCKET_IFNAME==%s\n' "${interface}"
          } >> "${GITHUB_ENV}"
          python - <<'PY'
          import json
          import os
          import urllib.request

          base = os.environ["THORIO_COMPUTE_COORDINATOR_URL"].rstrip("/")
          payload = json.dumps({
              "action": "publish",
              "session_id": os.environ["THORIO_NCCL_RENDEZVOUS_SESSION"],
              "address": os.environ["MASTER_ADDR"],
              "port": int(os.environ["MASTER_PORT"]),
              "interface_name": os.environ["NCCL_SOCKET_IFNAME"],
              "ttl_seconds": 900,
          }).encode()
          request = urllib.request.Request(
              base + "/fabric/rendezvous",
              data=payload,
              method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['THORIO_COMPUTE_AUTH_TOKEN']}",
                  "Content-Type": "application/json",
                  "Accept": "application/json",
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              result = json.loads(response.read().decode())
          if result.get("ok") is not True:
              raise SystemExit(f"Coordinator rejected NCCL rendezvous publication: {result!r}")
          print("NCCL_RANK0_RENDEZVOUS_PUBLISHED", json.dumps(result, sort_keys=True))
          PY

      - name: Discover rank-0 rendezvous endpoint
        if: matrix.rank == 1
        shell: bash
        run: |
          set -euo pipefail
          test -n "${THORIO_COMPUTE_COORDINATOR_URL}"
          test -n "${THORIO_COMPUTE_AUTH_TOKEN}"
          deadline=$((SECONDS + 120))
          while [ "${SECONDS}" -lt "${deadline}" ]; do
            response="$(curl --fail --silent --show-error               -H "Authorization: Bearer ${THORIO_COMPUTE_AUTH_TOKEN}"               -H "Accept: application/json"               --get               --data-urlencode "session_id=${THORIO_NCCL_RENDEZVOUS_SESSION}"               "${THORIO_COMPUTE_COORDINATOR_URL%/}/fabric/rendezvous?session_id=${THORIO_NCCL_RENDEZVOUS_SESSION}" || true)"
            if [ -n "${response}" ] && python - "${response}" <<'PY'
          import json, os, socket, sys, time
          payload=json.loads(sys.argv[1])
          if payload.get("ok") is not True:
              raise SystemExit(1)
          host=str(payload["address"]).strip()
          port=int(payload["port"])
          interface=str(payload["interface_name"]).strip()
          deadline=time.monotonic()+90
          last=None
          while time.monotonic()<deadline:
              try:
                  with socket.create_connection((host,port),timeout=3):
                      print(json.dumps({"host":host,"port":port,"interface":interface},sort_keys=True))
                      with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as env:
                          env.write(f"MASTER_ADDR={host}\n")
                          env.write(f"MASTER_PORT={port}\n")
                          env.write(f"NCCL_SOCKET_IFNAME={interface}\n")
                      raise SystemExit(0)
              except OSError as exc:
                  last=exc
                  time.sleep(2)
          print(f"Rank 1 cannot reach rank 0 at {host}:{port}: {last}",file=sys.stderr)
          raise SystemExit(2)
          PY
            then
              echo "Rank 1 reached the automatically discovered rank-0 rendezvous endpoint."
              exit 0
            fi
            sleep 3
          done
          echo "Timed out waiting for the rank-0 rendezvous endpoint." >&2
          exit 1

      - name: Run exact Thorio NCCL all-reduce probe
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MASTER_ADDR}"
          test -n "${MASTER_PORT}"
          test -n "${NCCL_SOCKET_IFNAME}"
          python -m lead_engine.nccl_all_reduce_probe 2>&1 | tee /tmp/thorio-nccl-rank.log
          grep -F "THORIO_NCCL_PROBE_OK " /tmp/thorio-nccl-rank.log

      - name: Capture physical rank evidence
        if: success()
        shell: bash
        env:
          THORIO_PROOF_REF: ${{ env.THORIO_PROOF_REF }}
          THORIO_CHECKED_OUT_SHA: ${{ env.THORIO_CHECKED_OUT_SHA }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import pathlib
          import socket
          import subprocess

          marker = "THORIO_NCCL_PROBE_OK "
          log = pathlib.Path("/tmp/thorio-nccl-rank.log").read_text(encoding="utf-8", errors="replace")
          matches = [
              json.loads(line[len(marker):])
              for line in log.splitlines()
              if line.startswith(marker)
          ]
          if len(matches) != 1:
              raise SystemExit(f"Expected exactly one Thorio NCCL probe record, found {len(matches)}")
          probe = matches[0]
          if probe.get("backend") != "nccl":
              raise SystemExit("Probe backend is not NCCL.")
          if probe.get("collective") != "all_reduce":
              raise SystemExit("Probe collective is not all_reduce.")
          if probe.get("verified_on_gpu") is not True:
              raise SystemExit("Probe did not verify GPU execution.")
          if int(probe.get("world_size", -1)) != 2 or int(probe.get("nnodes", -1)) != 2:
              raise SystemExit("Probe did not run with world_size=2 and nnodes=2.")
          if int(probe.get("expected_sum", -1)) != 3:
              raise SystemExit("NCCL all-reduce expected sum is not 3.")
          if not probe.get("gpu_uuid"):
              raise SystemExit("Probe did not expose a physical GPU UUID.")
          if float(probe.get("all_reduce_elapsed_ms", -1)) < 0:
              raise SystemExit("NCCL all-reduce timing is invalid.")

          from lead_engine.nvidia_runtime import NvidiaRuntime
          network = NvidiaRuntime.parse_nccl_network_evidence(log)
          if not network.get("network_transport"):
              raise SystemExit("NCCL produced no network transport evidence.")
          if "NCCL INFO" not in log:
              raise SystemExit("NCCL debug output is missing.")
          evidence = {
              "verified": True,
              "proof_ref": os.environ["THORIO_PROOF_REF"],
              "proof_sha": os.environ["THORIO_CHECKED_OUT_SHA"],
              "rank": int(probe["rank"]),
              "world_size": int(probe["world_size"]),
              "nnodes": int(probe["nnodes"]),
              "hostname": socket.gethostname(),
              "gpu_uuid": str(probe["gpu_uuid"]),
              "gpu_name": str(subprocess.check_output(
                  ["nvidia-smi", "--query-gpu=name", "--format=csv,noheader"],
                  text=True,
              ).splitlines()[0].strip()),
              "collective": "all_reduce",
              "expected_sum": int(probe["expected_sum"]),
              "all_reduce_elapsed_ms": float(probe["all_reduce_elapsed_ms"]),
              "network_transport": str(network["network_transport"]),
              "hca_selections": list(network.get("hca_selections") or ()),
              "peer_connections": list(network.get("peer_connections") or ()),
          }
          pathlib.Path("rank-evidence.json").write_text(
              json.dumps(evidence, sort_keys=True, indent=2),
              encoding="utf-8",
          )
          print(json.dumps(evidence, sort_keys=True))
          PY

      - name: Clear NCCL rendezvous registration
        if: always() && matrix.rank == 0
        shell: bash
        run: |
          set +e
          if [ -n "${THORIO_COMPUTE_COORDINATOR_URL}" ] && [ -n "${THORIO_COMPUTE_AUTH_TOKEN}" ]; then
            curl --fail --silent --show-error               -X POST               -H "Authorization: Bearer ${THORIO_COMPUTE_AUTH_TOKEN}"               -H "Content-Type: application/json"               -d "{\"action\":\"clear\",\"session_id\":\"${THORIO_NCCL_RENDEZVOUS_SESSION}\"}"               "${THORIO_COMPUTE_COORDINATOR_URL%/}/fabric/rendezvous" >/dev/null || true
          fi

      - name: Upload physical rank evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physical-nccl-rank-${{ matrix.rank }}
          path: |
            rank-evidence.json
            /tmp/thorio-nccl-rank.log
          if-no-files-found: error

  aggregate:
    name: Aggregate physical multi-node NCCL evidence
    needs: rank
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact proof ref
        uses: actions/checkout@v5
        with:
          ref: ${{ env.THORIO_PROOF_REF }}

      - name: Verify aggregate checked-out proof revision
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "Proof ref: ${THORIO_PROOF_REF}"
          echo "Aggregate checked-out proof SHA: ${actual}"
          if [ -z "${actual}" ]; then
            exit 1
          fi
          printf 'THORIO_AGGREGATE_CHECKED_OUT_SHA=%s\n' "${actual}" >> "${GITHUB_ENV}"

      - name: Download both physical rank evidence bundles
        uses: actions/download-artifact@v5
        with:
          pattern: physical-nccl-rank-*
          merge-multiple: false
          path: /tmp/thorio-nccl-evidence

      - name: Validate complete physical multi-node proof
        shell: bash
        env:
          THORIO_AGGREGATE_CHECKED_OUT_SHA: ${{ env.THORIO_AGGREGATE_CHECKED_OUT_SHA }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import pathlib

          root = pathlib.Path("/tmp/thorio-nccl-evidence")
          records = []
          logs = {}
          for evidence_path in sorted(root.glob("physical-nccl-rank-*/rank-evidence.json")):
              records.append(json.loads(evidence_path.read_text(encoding="utf-8")))
          for log_path in sorted(root.glob("physical-nccl-rank-*/thorio-nccl-rank.log")):
              logs[log_path.parent.name] = log_path.read_text(encoding="utf-8", errors="replace")

          if len(records) != 2:
              raise SystemExit(f"Expected exactly two physical rank records, found {len(records)}")
          proof_shas = {str(item.get("proof_sha") or "").strip() for item in records}
          if len(proof_shas) != 1 or "" in proof_shas:
              raise SystemExit(f"Physical rank evidence was not bound to one proof SHA: {sorted(proof_shas)}")
          aggregate_sha = os.environ["THORIO_AGGREGATE_CHECKED_OUT_SHA"]
          if proof_shas != {aggregate_sha}:
              raise SystemExit(f"Physical evidence SHA does not match aggregate checked-out SHA: expected {aggregate_sha}, got {sorted(proof_shas)}")
          ranks = sorted(int(item.get("rank", -1)) for item in records)
          if ranks != [0, 1]:
              raise SystemExit(f"Physical rank coverage is invalid: {ranks}")
          if any(item.get("verified") is not True for item in records):
              raise SystemExit("At least one physical rank is not verified.")
          if any(item.get("world_size") != 2 or item.get("nnodes") != 2 for item in records):
              raise SystemExit("At least one physical rank does not report a two-node world.")
          if any(item.get("collective") != "all_reduce" for item in records):
              raise SystemExit("At least one physical rank did not execute all_reduce.")
          if any(item.get("expected_sum") != 3 for item in records):
              raise SystemExit("At least one physical rank has an invalid all-reduce result.")
          hostnames = {str(item.get("hostname") or "").strip() for item in records}
          if len(hostnames) != 2:
              raise SystemExit(
                  "The two NCCL ranks did not prove two distinct physical hosts: "
                  + ", ".join(sorted(hostnames))
              )
          gpu_uuids = {str(item.get("gpu_uuid") or "").strip() for item in records}
          if len(gpu_uuids) != 2:
              raise SystemExit("The two NCCL ranks did not expose two distinct physical GPU UUIDs.")
          transports = {str(item.get("network_transport") or "").strip().upper() for item in records}
          if len(transports) != 1 or "" in transports:
              raise SystemExit(f"Physical NCCL ranks selected inconsistent transports: {sorted(transports)}")
          if not all("NCCL INFO" in log for log in logs.values()):
              raise SystemExit("One or more rank logs lacks NCCL debug evidence.")
          if len(logs) != 2:
              raise SystemExit(f"Expected two rank logs, found {len(logs)}")

          by_rank = {int(item["rank"]): item for item in records}
          aggregate_transport = next(iter(transports))
          for rank in (0, 1):
              peers = [
                  edge for edge in (by_rank[rank].get("peer_connections") or ())
                  if isinstance(edge, dict)
              ]
              cross_rank = [
                  edge for edge in peers
                  if int(edge.get("peer_rank", -1)) == (1 - rank)
              ]
              if not cross_rank:
                  raise SystemExit(
                      f"Rank {rank} has no NCCL peer-connection evidence to the other physical rank."
                  )
              if any(
                  str(edge.get("transport") or "").strip().upper() != aggregate_transport
                  for edge in cross_rank
              ):
                  raise SystemExit(
                      f"Rank {rank} has a cross-rank NCCL peer connection using a transport "
                      f"that does not match the verified aggregate transport."
                  )

          print("PHYSICAL MULTI-NODE NCCL VERIFIED")
          print(json.dumps({
              "verified": True,
              "proof_sha": next(iter(proof_shas)),
              "world_size": 2,
              "nnodes": 2,
              "ranks": ranks,
              "distinct_physical_hosts": sorted(hostnames),
              "distinct_physical_gpu_uuids": sorted(gpu_uuids),
              "network_transport": next(iter(transports)),
              "collective": "all_reduce",
              "expected_sum": 3,
              "rank_evidence": records,
          }, sort_keys=True))
          PY
