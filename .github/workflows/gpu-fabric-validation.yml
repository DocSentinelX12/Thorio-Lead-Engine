name: GPU Fabric Validation

on:
  workflow_dispatch:
  push:
    branches:
      - feature/gpu-fabric-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  gpu-discovery:
    name: GPU discovery and worker identity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          python -m pip install pytest pytest-timeout
      - name: Run GPU discovery contract tests
        run: |
          python -m pytest -vv -ra --tb=short --timeout=120 lead_engine/test_nvidia_provider.py
      - name: Run compute remote and execution fabric regressions
        run: |
          python -m pytest -vv -ra --tb=short --timeout=120 lead_engine/test_compute_remote_contract.py lead_engine/test_compute_execution_fabric.py lead_engine/test_compute_worker_fabric_lifecycle.py
