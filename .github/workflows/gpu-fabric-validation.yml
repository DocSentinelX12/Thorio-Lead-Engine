name: GPU Fabric Validation

on:
  workflow_dispatch:
  push:
    branches:
      - feature/gpu-fabric-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  massive-scale-proof:
    name: Massive-scale fabric control-plane proof
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          python -m pip install pytest pytest-timeout
      - name: Run twelve-supercomputer scale proof
        run: |
          python -m pytest -vv -ra --tb=short --timeout=120 tests/test_massive_scale_fabric.py

  gpu-discovery:
    name: GPU discovery and worker identity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          python -m pip install pytest pytest-timeout
      - name: Run GPU discovery contract tests
        run: |
          python -m pytest -vv -ra --tb=short --timeout=120 lead_engine/test_nvidia_provider.py
      - name: Run compute remote and execution fabric regressions
        run: |
          python -m pytest -vv -ra --tb=short --timeout=120 tests/test_compute_fabric_telemetry.py tests/test_fabric_physical_inventory.py tests/test_physical_fabric.py tests/test_adaptive_fabric_routing.py tests/test_exact_path_failover.py tests/test_concrete_path_performance_ranking.py tests/test_fabric_physical_integration.py tests/test_fabric_physical_locality.py tests/test_physical_worker_registration.py tests/test_gpu_execution_runtime.py tests/test_compute_coordinator_free_acquisition.py tests/test_free_compute_acquisition.py tests/test_fabric_intelligence.py tests/test_fabric_placement.py lead_engine/test_agent_queue.py lead_engine/test_compute_remote_contract.py lead_engine/test_compute_execution_fabric.py lead_engine/test_compute_fabric.py lead_engine/test_compute_worker_fabric_lifecycle.py lead_engine/test_compute_scheduler.py lead_engine/test_compute_checkpoints.py lead_engine/test_compute_lead_persistence.py lead_engine/test_compute_bridge.py lead_engine/test_research_section_checkpoints.py lead_engine/test_public_research_checkpoints.py lead_engine/test_handoff_recovery.py lead_engine/test_revenue_execution.py lead_engine/test_revenue_conversation.py
