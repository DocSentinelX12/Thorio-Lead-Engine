name: Surgical Integration Fix

on:
  push:
    branches:
      - integration/gpu-main-additive

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Fix durable queue and compute integration contracts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: integration/gpu-main-additive
          fetch-depth: 1

      - name: Apply surgical integration fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          db = Path('lead_engine/database.py')
          text = db.read_text()

          old_insert = '''        cursor = self.conn.execute("INSERT OR IGNORE INTO leads (fingerprint, payload) VALUES (?, ?)", (str(fingerprint), json.dumps(payload, ensure_ascii=False)))
          if self._batch_write_depth == 0:
              self.conn.commit()
          return cursor.rowcount == 1
          '''
          new_insert = '''        cursor = self.conn.execute("INSERT OR IGNORE INTO leads (fingerprint, payload) VALUES (?, ?)", (str(fingerprint), json.dumps(payload, ensure_ascii=False)))
          if cursor.rowcount == 1:
              self.conn.execute(
                  "INSERT OR IGNORE INTO compute_lead_work (fingerprint,status,attempts,last_error,result,created_at,updated_at) VALUES (?, 'queued', 0, '', NULL, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP)",
                  (str(fingerprint),),
              )
          if self._batch_write_depth == 0:
              self.conn.commit()
          return cursor.rowcount == 1
          '''
          if old_insert not in text:
              raise SystemExit('insert_if_new target not found')
          text = text.replace(old_insert, new_insert, 1)

          old_allowed = '''    def queue_update(self, task_id, *, expected_status=None, expected_worker_id=None, **updates):
          allowed = {"status", "updated_at", "lease_until", "worker_id", "attempts", "last_error", "result"}
          unknown = set(updates) - allowed
          '''
          new_allowed = '''    def queue_update(self, task_id, *, expected_status=None, expected_worker_id=None, **updates):
          allowed = {"status", "updated_at", "lease_until", "worker_id", "attempts", "last_error", "result", "lease_token"}
          unknown = set(updates) - allowed
          '''
          if old_allowed not in text:
              raise SystemExit('queue_update target not found')
          text = text.replace(old_allowed, new_allowed, 1)
          db.write_text(text)

          queue = Path('lead_engine/agent_queue.py')
          text = queue.read_text()
          old_heartbeat = '''        if lease_token is not None and hasattr(db, "queue_update_owned"):
              if not db.queue_update_owned(task_id, worker_id, lease_token, lease_until=_iso(now + timedelta(seconds=lease_seconds)), updated_at=_iso(now)):
                  raise ValueError("Task lease was lost")
          else:
              changed = db.queue_update(task_id, expected_status=RUNNING, expected_worker_id=worker_id, lease_until=_iso(now + timedelta(seconds=lease_seconds)), updated_at=_iso(now));
              if changed != 1: raise ValueError("Task lease ownership changed before heartbeat")
          if changed != 1: raise ValueError("Task lease ownership changed before heartbeat")
          '''
          new_heartbeat = '''        if lease_token is not None and hasattr(db, "queue_update_owned"):
              if not db.queue_update_owned(task_id, worker_id, lease_token, lease_until=_iso(now + timedelta(seconds=lease_seconds)), updated_at=_iso(now)):
                  raise ValueError("Task lease was lost")
              changed = 1
          else:
              changed = db.queue_update(task_id, expected_status=RUNNING, expected_worker_id=worker_id, lease_until=_iso(now + timedelta(seconds=lease_seconds)), updated_at=_iso(now));
              if changed != 1: raise ValueError("Task lease ownership changed before heartbeat")
          '''
          if old_heartbeat not in text:
              raise SystemExit('heartbeat target not found')
          queue.write_text(text.replace(old_heartbeat, new_heartbeat, 1))
          PY

      - name: Verify focused integration tests
        run: |
          python -m pytest -q \
            lead_engine/test_durable_queue_integrity.py \
            lead_engine/test_compute_lead_persistence.py \
            lead_engine/test_compute_bridge.py \
            lead_engine/test_research_section_checkpoints.py \
            lead_engine/test_public_research_checkpoints.py

      - name: Commit surgical fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lead_engine/database.py lead_engine/agent_queue.py
          git diff --cached --check
          git diff --cached --quiet && { echo 'No changes required'; exit 0; }
          git commit -m 'Fix durable queue and compute integration contracts'
          git push origin HEAD:integration/gpu-main-additive

      - name: Remove one-shot workflow
        if: always() && github.event.head_commit.message == 'Fix durable queue and compute integration contracts'
        run: true
