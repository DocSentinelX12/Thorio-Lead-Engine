name: Free Compute Fleet Verification

on:
  push:
    branches:
      - main
    paths:
      - "lead_engine/free_compute_acquisition.py"
      - "lead_engine/free_compute_fleet.py"
      - "lead_engine/test_free_compute_fleet.py"
      - "lead_engine/test_kaggle_free_compute.py"
      - "tests/test_free_compute_acquisition.py"
  workflow_dispatch:

concurrency:
  group: free-compute-fleet-verification-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify scalable free compute acquisition layer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact ref
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          python -m pip install pytest pytest-timeout

      - name: Run focused free compute fleet regression
        run: |
          python -m pytest -vv -ra --tb=short --timeout=120 \
            lead_engine/test_free_compute_fleet.py \
            tests/test_free_compute_acquisition.py \
            lead_engine/test_kaggle_free_compute.py
