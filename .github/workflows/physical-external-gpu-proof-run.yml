name: Physical External GPU Proof

on:
  push:
    branches:
      - main
      - integration/gpu-main-additive
    paths:
      - ".github/workflows/physical-external-gpu-proof-run.yml"
  workflow_dispatch:
    inputs:
      run_physical_proof:
        description: "Confirm manual execution of the physical external GPU proof"
        required: true
        default: "true"
        type: boolean

permissions:
  contents: read

jobs:
  kaggle-physical-gpu-proof:
    name: Execute Thorio CUDA probe on external Kaggle GPU
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_USERNAME: ${{ secrets.THORIO_KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.THORIO_KAGGLE_KEY }}
      THORIO_KAGGLE_KERNEL_SLUG: thorio-physical-gpu-execution-proof-${{ github.run_id }}
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Verify physical proof trigger
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.run_physical_proof }}" != "true" ]; then
              echo "Manual physical GPU proof was not confirmed."
              exit 1
            fi
          fi
          echo "Physical GPU proof trigger accepted: ${GITHUB_EVENT_NAME}"

      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle

      - name: Verify Kaggle authentication without exposing credentials
        run: |
          set -euo pipefail
          test -n "${KAGGLE_USERNAME}"
          test -n "${KAGGLE_API_TOKEN}"
          kaggle kernels list --user "${KAGGLE_USERNAME}" --page-size 1 >/dev/null
          echo "Kaggle authentication verified."

      - name: Resolve exact proof revision
        id: proof_revision
        run: |
          set -euo pipefail
          proof_sha="$(git ls-remote origin "refs/heads/${{ github.ref_name }}" | awk 'NR==1 {print $1}')"
          if ! printf '%s' "$proof_sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Unable to resolve an exact feature-branch commit SHA." >&2
            exit 1
          fi
          probe_source_sha256="$(sha256sum lead_engine/gpu_execution_probe.py | awk '{print $1}')"
          if ! printf '%s' "$probe_source_sha256" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "Unable to resolve the physical probe source digest." >&2
            exit 1
          fi
          printf 'proof_sha=%s\n' "$proof_sha" >> "$GITHUB_OUTPUT"
          printf 'probe_source_sha256=%s\n' "$probe_source_sha256" >> "$GITHUB_OUTPUT"
          echo "Physical proof will be bound to $proof_sha."
          echo "Physical probe source SHA-256: $probe_source_sha256."

      - name: Build real physical GPU proof kernel
        env:
          THORIO_PROOF_SHA: ${{ steps.proof_revision.outputs.proof_sha }}
          THORIO_PROBE_SOURCE_SHA256: ${{ steps.proof_revision.outputs.probe_source_sha256 }}
        run: |
          set -euo pipefail
          rm -rf /tmp/thorio-kaggle-proof
          mkdir -p /tmp/thorio-kaggle-proof
          probe_source_b64="$(base64 -w0 lead_engine/gpu_execution_probe.py)"
          cat > /tmp/thorio-kaggle-proof/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/${THORIO_KAGGLE_KERNEL_SLUG}",
            "title": "Thorio Physical GPU Execution Proof ${{ github.run_id }}",
            "code_file": "kernel.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_internet": true,
            "machine_shape": "NvidiaTeslaT4",
            "dataset_sources": [],
            "competition_sources": [],
            "kernel_sources": [],
            "model_sources": []
          }
          EOF
          cat > /tmp/thorio-kaggle-proof/kernel.py <<PY
          import base64
          import hashlib
          import json
          import os
          import pathlib
          import subprocess
          import sys

          proof_sha = "${THORIO_PROOF_SHA}"
          expected_probe_source_sha256 = "${THORIO_PROBE_SOURCE_SHA256}"
          encoded_probe_source = "${probe_source_b64}"
          source = base64.b64decode(encoded_probe_source.encode("ascii"))
          observed_probe_source_sha256 = hashlib.sha256(source).hexdigest()
          if observed_probe_source_sha256 != expected_probe_source_sha256:
              raise RuntimeError(
                  "Physical probe source SHA-256 mismatch: "
                  f"expected {expected_probe_source_sha256}, "
                  f"observed {observed_probe_source_sha256}"
              )

          repo = pathlib.Path("/kaggle/working/thorio-lead-engine")
          probe_path = repo / "lead_engine" / "gpu_execution_probe.py"
          probe_path.parent.mkdir(parents=True, exist_ok=True)
          probe_path.write_bytes(source)

          result = subprocess.run(
              [
                  sys.executable,
                  "-c",
                  "import runpy; runpy.run_path('/kaggle/working/thorio-lead-engine/lead_engine/gpu_execution_probe.py', run_name='__main__')",
              ],
              cwd=repo,
              capture_output=True,
              text=True,
              check=False,
              env={**os.environ, "THORIO_PROOF_SHA": proof_sha},
          )
          print(result.stdout, end="")
          print(result.stderr, end="", file=sys.stderr)
          if result.returncode != 0:
              raise SystemExit(result.returncode)

          marker = "THORIO_GPU_EXECUTION_PROBE_OK "
          evidence_line = next(
              (line for line in result.stdout.splitlines() if line.startswith(marker)),
              "",
          )
          if not evidence_line:
              raise RuntimeError("Thorio physical GPU probe produced no evidence marker")

          evidence = json.loads(evidence_line[len(marker):])
          if evidence.get("proof_sha") != proof_sha:
              raise RuntimeError(
                  f"Physical GPU probe ran at unexpected SHA: expected {proof_sha}, got {evidence.get('proof_sha')}"
              )
          if evidence.get("verified") is not True:
              raise RuntimeError("Thorio physical GPU probe did not verify execution")
          if evidence.get("execution_backend") != "cuda":
              raise RuntimeError("Thorio physical GPU probe did not execute through CUDA")

          print(
              "THORIO_PHYSICAL_GPU_EXECUTION_PROOF "
              + json.dumps(evidence, sort_keys=True),
              flush=True,
          )
          PY

      - name: Submit external GPU execution
        run: |
          set -euo pipefail
          kaggle kernels push -p /tmp/thorio-kaggle-proof --accelerator NvidiaTeslaT4

      - name: Wait for external GPU execution to finish
        id: kaggle_wait
        run: |
          set -euo pipefail
          status="unknown"
          deadline=$((SECONDS + 600))
          while [ "$SECONDS" -lt "$deadline" ]; do
            output="$(kaggle kernels status "${KAGGLE_USERNAME}/${THORIO_KAGGLE_KERNEL_SLUG}" 2>&1 || true)"
            printf '%s\n' "$output"
            lowered="$(printf '%s' "$output" | tr '[:upper:]' '[:lower:]')"
            if printf '%s' "$lowered" | grep -Eq 'error|failed|cancelled'; then
              status="error"
              break
            fi
            if printf '%s' "$lowered" | grep -Eq 'complete|completed'; then
              status="complete"
              break
            fi
            sleep 10
          done
          if [ "$status" = "unknown" ]; then
            status="timeout"
          fi
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"
          echo "Kaggle external GPU execution status: $status"

      - name: Retrieve and verify physical execution evidence
        if: always()
        run: |
          set -euo pipefail
          rm -rf /tmp/thorio-kaggle-output
          mkdir -p /tmp/thorio-kaggle-output
          kaggle kernels output "${KAGGLE_USERNAME}/${THORIO_KAGGLE_KERNEL_SLUG}" -p /tmp/thorio-kaggle-output --force || true
          kaggle kernels logs "${KAGGLE_USERNAME}/${THORIO_KAGGLE_KERNEL_SLUG}" > /tmp/thorio-kaggle-output/kaggle-kernel.log 2>&1 || true
          KAGGLE_STATUS="${{ steps.kaggle_wait.outputs.status }}" EXPECTED_PROOF_SHA="${{ steps.proof_revision.outputs.proof_sha }}" python - <<'PY'
          import json
          import os
          import pathlib

          status = os.environ.get("KAGGLE_STATUS", "unknown")
          expected_sha = os.environ["EXPECTED_PROOF_SHA"]
          root = pathlib.Path("/tmp/thorio-kaggle-output")
          marker = "THORIO_PHYSICAL_GPU_EXECUTION_PROOF "
          matches = []

          for path in root.rglob("*"):
              if not path.is_file() or path.name == "kaggle-kernel.log":
                  continue
              try:
                  text = path.read_text(encoding="utf-8", errors="replace")
              except OSError:
                  continue
              for line in text.splitlines():
                  if line.startswith(marker):
                      matches.append(json.loads(line[len(marker):]))

          if status != "complete":
              log_path = root / "kaggle-kernel.log"
              log = log_path.read_text(encoding="utf-8", errors="replace") if log_path.exists() else ""
              raise SystemExit(
                  "External Kaggle GPU execution did not complete successfully. "
                  f"status={status}\nKaggle kernel log:\n{log[-12000:]}"
              )

          if len(matches) != 1:
              raise SystemExit(
                  f"Expected exactly one physical execution proof record, found {len(matches)}"
              )

          evidence = matches[0]
          required = (
              "verified",
              "execution_backend",
              "operation",
              "gpu_uuid",
              "checksum",
              "elapsed_ms",
              "proof_sha",
          )
          missing = [key for key in required if key not in evidence]
          if missing:
              raise SystemExit(f"Physical execution evidence is incomplete: missing {missing}")
          if evidence["verified"] is not True:
              raise SystemExit("Physical execution evidence is not verified")
          if evidence["execution_backend"] != "cuda":
              raise SystemExit("Physical execution evidence backend is not CUDA")
          if not evidence["gpu_uuid"]:
              raise SystemExit("Physical execution evidence has no physical GPU UUID")
          if evidence["checksum"] != 120.0:
              raise SystemExit(f"Unexpected CUDA execution checksum: {evidence['checksum']}")
          if evidence["proof_sha"] != expected_sha:
              raise SystemExit(
                  f"Physical execution evidence is bound to {evidence['proof_sha']}, expected {expected_sha}"
              )
          if float(evidence["elapsed_ms"]) < 0:
              raise SystemExit("Physical execution timing is invalid")

          print("PHYSICAL GPU EXECUTION VERIFIED")
          print(json.dumps(evidence, sort_keys=True))
          PY
        env:
          EXPECTED_PROOF_SHA: ${{ steps.proof_revision.outputs.proof_sha }}

      - name: Delete external proof kernel
        if: always()
        run: |
          kaggle kernels delete "${KAGGLE_USERNAME}/${THORIO_KAGGLE_KERNEL_SLUG}" --yes || true
