name: Phase 6 fix 4

on:
  push:
    paths:
      - .github/workflows/phase6_fix4.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          python -m pip install pytest pytest-timeout
      - name: Apply Phase 6 implementation and update legacy dedupe test
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/phase6_fix.yml')
          text = workflow.read_text()
          marker = '          python - <<\'PY\'\n'
          body = text.split(marker, 1)[1].split('\n          PY', 1)[0]
          exec(textwrap.dedent(body), {'__name__': '__phase6_patch__'})

          # The old test asserted fingerprint-level discovery dedupe. That is
          # explicitly forbidden by Phase 6, so replace it with final-gate tests.
          Path('lead_engine/test_dedupe.py').write_text('''from .dedupe import Dedupe\n\nclass DB:\n    def __init__(self, rows):\n        self.rows = rows\n    def all_leads(self):\n        return list(self.rows)\n\ndef lead(company, person, need, fp, qualified=True):\n    return {\n        "company": company,\n        "person": person,\n        "business_need": need,\n        "fingerprint": fp,\n        "qualified": qualified,\n        "qualification_status": "qualified" if qualified else "in_review",\n    }\n\ndef test_final_dedupe_requires_exact_company_person_need_and_qualification():\n    existing = lead("Acme", "Alex", "AI agents", "1", qualified=True)\n    dedupe = Dedupe(DB([existing]))\n\n    assert dedupe.find_exact_duplicate(lead("Beta", "Alex", "AI agents", "2", True)) is None\n    assert dedupe.find_exact_duplicate(lead("Acme", "Jordan", "AI agents", "3", True)) is None\n    assert dedupe.find_exact_duplicate(lead("Acme", "Alex", "mobile app", "4", True)) is None\n    assert dedupe.find_exact_duplicate(lead("Acme", "Alex", "AI agents", "5", False)) is None\n    assert dedupe.find_exact_duplicate(lead("Acme", "Alex", "AI agents", "6", True)) == existing\n\ndef test_missing_need_never_discards_a_lead():\n    existing = lead("Acme", "Alex", "", "1", True)\n    candidate = lead("Acme", "Alex", "", "2", True)\n    assert Dedupe(DB([existing])).find_exact_duplicate(candidate) is None\n''')

          for name in ('phase6_apply.yml', 'phase6_fix.yml', 'phase6_fix2.yml', 'phase6_diag.yml', 'phase6_fix3.yml', 'phase6_fix4.yml'):
              path = Path('.github/workflows') / name
              if path.exists():
                  path.unlink()
          PY
      - name: Run Phase 6 regression tests
        run: python -m pytest -q lead_engine/test_phase6_opportunity_dedupe.py lead_engine/test_dedupe.py
      - name: Run full suite and capture output
        run: |
          set +e
          python -m pytest -q > phase6-full-suite.log 2>&1
          status=$?
          cat phase6-full-suite.log
          echo "PYTEST_EXIT=$status" >> phase6-full-suite.log
          if [ "$status" -ne 0 ]; then exit "$status"; fi
      - name: Upload full suite diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase6-full-suite-diagnostic
          path: phase6-full-suite.log
      - name: Commit verified Phase 6 implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lead_engine .github/workflows
          git commit -m 'Enforce strict final-only opportunity deduplication' || exit 0
          git push
