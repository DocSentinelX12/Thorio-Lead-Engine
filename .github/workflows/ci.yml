name: Thorio Lead Engine CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Main is the canonical production verification branch. Preserve every queued test run.
# GitHub's default concurrency queue keeps only one pending run. queue: max retains
# up to 100 pending runs instead of canceling older verification runs.
concurrency:
  group: thorio-test-queue
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Fast Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          python -m pip install pytest pytest-timeout

      - name: Run full test suite
        run: |
          python -m pytest -vv -ra --tb=short --timeout=600 --durations=25 --junitxml=test-results.xml 2>&1 | tee pytest-output.txt
          test ${PIPESTATUS[0]} -eq 0

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostics-${{ github.run_id }}
          path: |
            pytest-output.txt
            test-results.xml
          if-no-files-found: error
