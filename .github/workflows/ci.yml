name: Thorio Lead Engine CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Preserve every queued test run and execute test workflows one at a time.
# A newer commit or manual full-suite run must never cancel an older test run.
concurrency:
  group: thorio-test-queue
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test:
    name: Fast Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          python -m pip install pytest pytest-timeout

      - name: Run full test suite
        run: |
          python -m pytest -vv -ra --tb=short --timeout=600 --durations=25 --junitxml=test-results.xml 2>&1 | tee pytest-output.txt
          test ${PIPESTATUS[0]} -eq 0

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostics-${{ github.run_id }}
          path: |
            pytest-output.txt
            test-results.xml
          if-no-files-found: error

  # PHASE6-TEMP-START
  phase6:
    name: Phase 6 Implementation and Acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          python -m pip install pytest pytest-timeout

      - name: Apply Phase 6 implementation and migrate tests
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, textwrap

          source = Path('.github/workflows/phase6_finish.yml').read_text()
          marker = "          python - <<'PY'\n"
          body = source.split(marker, 1)[1].split("\n          PY", 1)[0]
          exec(textwrap.dedent(body), {'__name__': '__phase6_patch__'})

          p = Path('lead_engine/models.py')
          s = p.read_text()
          if '    business_need: str = ""' not in s:
              s = s.replace('    signal_type: str = ""\n    source_url: str = ""', '    signal_type: str = ""\n    business_need: str = ""\n    source_url: str = ""')
          if '"discovered_at": self.discovered_at' not in s:
              s = s.replace('            "signal_type": self.signal_type,\n', '            "signal_type": self.signal_type,\n            "discovered_at": self.discovered_at,\n')
          p.write_text(s)

          p = Path('lead_engine/dedupe.py')
          s = p.read_text()
          old = '    def find_exact_duplicate(self, lead: Dict[str, Any]) -> Optional[Dict[str, Any]]:\n        key = self.exact_need_key(lead)\n'
          new = '    def find_exact_duplicate(self, lead: Dict[str, Any]) -> Optional[Dict[str, Any]]:\n        if not self._qualified(lead):\n            return None\n        key = self.exact_need_key(lead)\n'
          if old in s: s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('lead_engine/test_lead_fingerprint.py')
          s = p.read_text()
          s = re.sub(r'def test_same_source_identity_matches\(\):.*?(?=\n\ndef )', '''def test_same_source_identity_does_not_collapse_distinct_company_observations():\n    first = {"source": "linkedin", "source_id": "abc-123", "company": "Acme"}\n    second = {"source": "linkedin", "source_id": "abc-123", "company": "Different Name"}\n    assert not same_lead(first, second)\n''', s, count=1, flags=re.S)
          s = re.sub(r'def test_fingerprint_uses_canonical_lead_identity\(\):.*?(?=\n\ndef )', '''def test_fingerprint_includes_observation_context():\n    first = {"source": "linkedin", "source_id": "ABC-123", "company": "Acme", "route": "Thorio", "discovered_at": "2026-01-01T00:00:00+00:00"}\n    second = {"source": "linkedin", "source_id": "ABC-123", "company": "Acme", "route": "Thorio", "discovered_at": "2026-01-01T00:00:01+00:00"}\n    assert lead_fingerprint(first) != lead_fingerprint(second)\n''', s, count=1, flags=re.S)
          p.write_text(s)

          p = Path('lead_engine/test_lead_identity.py')
          s = p.read_text()
          s = re.sub(r'def test_identity_uses_source_and_source_id\(\):.*?(?=\n\ndef )', '''def test_identity_includes_observation_context():\n    first = {"source": "linkedin", "source_id": "ABC-123", "company": "Acme", "discovered_at": "2026-01-01T00:00:00+00:00"}\n    second = {"source": "linkedin", "source_id": "ABC-123", "company": "Acme", "discovered_at": "2026-01-01T00:00:01+00:00"}\n    assert lead_identity(first) != lead_identity(second)\n''', s, count=1, flags=re.S)
          p.write_text(s)

          p = Path('lead_engine/test_opportunity_identity_and_agents.py')
          s = p.read_text()
          s = re.sub(r'def test_same_source_event_remains_one_opportunity\(\):.*?(?=\n\ndef )', '''def test_same_source_event_is_a_new_observation_until_final_dedupe():\n    first = {"source": "linkedin", "source_id": "post-1", "url": "https://linkedin.example/post-1", "company": "Acme", "person": "Jane CTO", "job_title": "AI Engineer", "signal": "Hiring an AI engineer", "discovered_at": "2026-01-01T00:00:00+00:00"}\n    updated_evidence = {**first, "signal": "Updated hiring details for an AI engineer", "evidence": "new evidence", "discovered_at": "2026-01-01T00:00:01+00:00"}\n    assert lead_identity(first) != lead_identity(updated_evidence)\n''', s, count=1, flags=re.S)
          p.write_text(s)

          p = Path('lead_engine/test_pipeline_delivery_boundary.py')
          s = p.read_text()
          s = re.sub(r'def test_qualified_duplicate_is_blocked_after_qualification\(\):.*?(?=\n\ndef )', '''def test_exact_duplicate_is_blocked_only_at_finalization_after_qualification():\n    db = FakeDB()\n    pipeline = LeadPipeline(db=db, sync_enabled=False)\n    first = pipeline.process(source="test", source_id="qualified-duplicate-1", url="https://example.com/jobs/qualified-duplicate-1", company="Acme", person="Alex", signal="remote software engineer", evidence="Remote software engineer opening.")\n    pipeline.qualify(first["fingerprint"], qualified=True, reason="Human review approved", business_need="hire a remote software engineer")\n    second = pipeline.process(source="test", source_id="qualified-duplicate-2", url="https://example.com/jobs/qualified-duplicate-2", company="Acme", person="Alex", signal="remote software engineer", evidence="Remote software engineer opening.")\n    assert second["status"] == "accepted"\n    pipeline.qualify(second["fingerprint"], qualified=True, reason="Human review approved", business_need="hire a remote software engineer")\n    final = pipeline.finalize(second["fingerprint"])\n    assert final["status"] == "duplicate"\n    assert final["duplicate"] is True\n''', s, count=1, flags=re.S)
          p.write_text(s)

          p = Path('lead_engine/test_production_integration.py')
          s = p.read_text()
          s = re.sub(r'def test_production_path_deduplicates_qualified_lead_across_separate_runs\(tmp_path\):.*?(?=\n\ndef )', '''def test_production_path_deduplicates_qualified_lead_only_at_finalization(tmp_path):\n    config = LeadEngineConfig(database_dir=str(tmp_path / "database"), sync_enabled=False, batch_size=50)\n    application = LeadEngineApplication(config=config)\n    first_source = StaticLeadSource([_lead("integration-qualified-duplicate-1")])\n    first = application.run_sources([first_source])\n    assert first["results"][0]["result"]["accepted_count"] == 1\n    fingerprint = application.db.conn.execute("SELECT fingerprint FROM leads ORDER BY rowid LIMIT 1").fetchone()[0]\n    qualified = application.service.runner.pipeline.qualify(fingerprint, qualified=True, business_need="hire a remote software engineer")\n    assert qualified["qualified"] is True\n    second_source = StaticLeadSource([_lead("integration-qualified-duplicate-2")])\n    second = application.run_sources([second_source])\n    assert second["results"][0]["result"]["accepted_count"] == 1\n    assert second["results"][0]["result"]["duplicate_count"] == 0\n    rows = application.db.conn.execute("SELECT fingerprint FROM leads ORDER BY rowid").fetchall()\n    assert len(rows) == 2\n    second_fingerprint = rows[1][0]\n    second_qualified = application.service.runner.pipeline.qualify(second_fingerprint, qualified=True, business_need="hire a remote software engineer")\n    assert second_qualified["qualified"] is True\n    final = application.service.runner.pipeline.finalize(second_fingerprint)\n    assert final["status"] == "duplicate"\n    assert final["duplicate"] is True\n''', s, count=1, flags=re.S)
          p.write_text(s)

          # Remove temporary Phase 6 workflows and this temporary CI job before commit.
          for path in Path('.github/workflows').glob('phase6_*.yml'):
              path.unlink()
          ci = Path('.github/workflows/ci.yml')
          cs = ci.read_text()
          cs = re.sub(r'\n  # PHASE6-TEMP-START.*?# PHASE6-TEMP-END\n?', '\n', cs, flags=re.S)
          ci.write_text(cs)
          PY
      - name: Run Phase 6 regression suite
        run: python -m pytest -q lead_engine/test_phase6_opportunity_dedupe.py lead_engine/test_dedupe.py lead_engine/test_lead_fingerprint.py lead_engine/test_lead_identity.py lead_engine/test_opportunity_identity_and_agents.py lead_engine/test_pipeline_delivery_boundary.py lead_engine/test_production_integration.py
      - name: Run full test suite on final Phase 6 tree
        run: python -m pytest -q
      - name: Commit verified Phase 6
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize strict post-qualification opportunity deduplication'
          git push
  # PHASE6-TEMP-END
