name: Phase 6 diagnostic 2

on:
  push:
    paths:
      - .github/workflows/phase6_diag2.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          python -m pip install pytest pytest-timeout
      - name: Apply patch and legacy test update
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          text = Path('.github/workflows/phase6_fix.yml').read_text()
          marker = '          python - <<\'PY\'\n'
          body = text.split(marker, 1)[1].split('\n          PY', 1)[0]
          exec(textwrap.dedent(body), {'__name__': '__phase6_patch__'})
          Path('lead_engine/test_dedupe.py').write_text('''from .dedupe import Dedupe\n\nclass DB:\n    def __init__(self, rows): self.rows = rows\n    def all_leads(self): return list(self.rows)\n\ndef lead(company, person, need, fp, qualified=True):\n    return {"company": company, "person": person, "business_need": need, "fingerprint": fp, "qualified": qualified, "qualification_status": "qualified" if qualified else "in_review"}\n\ndef test_final_dedupe_rules():\n    existing = lead("Acme", "Alex", "AI agents", "1", True)\n    d = Dedupe(DB([existing]))\n    assert d.find_exact_duplicate(lead("Beta", "Alex", "AI agents", "2", True)) is None\n    assert d.find_exact_duplicate(lead("Acme", "Jordan", "AI agents", "3", True)) is None\n    assert d.find_exact_duplicate(lead("Acme", "Alex", "mobile app", "4", True)) is None\n    assert d.find_exact_duplicate(lead("Acme", "Alex", "AI agents", "5", False)) is None\n    assert d.find_exact_duplicate(lead("Acme", "Alex", "AI agents", "6", True)) == existing\n''')
          PY
      - name: Run regression and upload exact output
        run: |
          set +e
          python -m pytest -vv -ra --tb=long lead_engine/test_phase6_opportunity_dedupe.py lead_engine/test_dedupe.py > regression.log 2>&1
          status=$?
          cat regression.log
          echo "EXIT=$status" >> regression.log
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: phase6-regression-failure
          path: regression.log
