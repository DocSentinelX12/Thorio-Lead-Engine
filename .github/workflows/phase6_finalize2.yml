name: Phase 6 finalize 2

on:
  push:
    paths:
      - .github/workflows/phase6_finalize2.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          python -m pip install pytest pytest-timeout
      - name: Apply complete Phase 6 implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/phase6_fix.yml').read_text()
          marker = '          python - <<\'PY\'\n'
          body = source.split(marker, 1)[1].split('\n          PY', 1)[0]
          exec(textwrap.dedent(body), {'__name__': '__phase6_patch__'})

          # Add the explicit canonical business need field if the base patch did not.
          p = Path('lead_engine/models.py')
          s = p.read_text()
          if '    business_need: str = ""' not in s:
              s = s.replace('    signal_type: str = ""\n    source_url: str = ""', '    signal_type: str = ""\n    business_need: str = ""\n    source_url: str = ""')
          # Observation identity must be unique per discovery event. The timestamp
          # is not business identity and is never used by final deduplication.
          if '"discovered_at": self.discovered_at' not in s:
              s = s.replace('            "signal_type": self.signal_type,\n', '            "signal_type": self.signal_type,\n            "discovered_at": self.discovered_at,\n')
          p.write_text(s)

          # Include the observation timestamp in persistence identity. This prevents
          # repeated signals from collapsing before research and qualification.
          p = Path('lead_engine/lead_identity.py')
          s = p.read_text()
          start = s.index('def lead_identity(')
          end = s.index('\n\ndef add_lead_identity(', start)
          fn = '''def lead_identity(lead: Dict[str, Any]) -> str:\n    """Return persistence identity for one observed discovery event only."""\n    fields = (\n        "source", "source_id", "url", "company", "person",\n        "signal", "signal_type", "job_title", "discovered_at",\n    )\n    raw_identity = "|".join(\n        f"{field}:{normalize_identity_value(lead.get(field))}"\n        for field in fields\n    )\n    return hashlib.sha256(raw_identity.encode("utf-8")).hexdigest()\n'''
          p.write_text(s[:start] + fn + s[end:])

          # Final gate must require the candidate itself to be qualified.
          p = Path('lead_engine/dedupe.py')
          s = p.read_text()
          old = '''    def find_exact_duplicate(self, lead: Dict[str, Any]) -> Optional[Dict[str, Any]]:\n        key = self.exact_need_key(lead)\n'''
          new = '''    def find_exact_duplicate(self, lead: Dict[str, Any]) -> Optional[Dict[str, Any]]:\n        if not self._qualified(lead):\n            return None\n        key = self.exact_need_key(lead)\n'''
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)

          # FakeDB must expose all leads for final-only duplicate comparison.
          p = Path('lead_engine/test_pipeline_delivery_boundary.py')
          s = p.read_text()
          if '    def all_leads(self):' not in s:
              s = s.replace('    def get(self, fingerprint):\n', '    def all_leads(self):\n        return list(self.records.values())\n\n    def get(self, fingerprint):\n', 1)
          old_test = '''def test_qualified_duplicate_is_blocked_after_qualification():\n    db = FakeDB()\n    pipeline = LeadPipeline(db=db, sync_enabled=False)\n    first = pipeline.process(\n        source="test", source_id="qualified-duplicate",\n        url="https://example.com/jobs/qualified-duplicate", company="Acme",\n        signal="remote software engineer", evidence="Remote software engineer opening.",\n    )\n    fingerprint = first["fingerprint"]\n    qualified = pipeline.qualify(fingerprint, qualified=True, reason="Human review approved")\n    assert qualified["qualified"] is True\n    assert qualified["qualification_status"] == "qualified"\n    second = pipeline.process(\n        source="test", source_id="qualified-duplicate",\n        url="https://example.com/jobs/qualified-duplicate", company="Acme",\n        signal="remote software engineer", evidence="Remote software engineer opening.",\n    )\n    assert second["status"] == "duplicate"\n    assert second["accepted"] is False\n    assert second["fingerprint"] == fingerprint\n'''
          new_test = '''def test_exact_duplicate_is_blocked_only_at_finalization_after_qualification():\n    db = FakeDB()\n    pipeline = LeadPipeline(db=db, sync_enabled=False)\n    first = pipeline.process(\n        source="test", source_id="qualified-duplicate",\n        url="https://example.com/jobs/qualified-duplicate", company="Acme",\n        person="Alex", signal="remote software engineer", evidence="Remote software engineer opening.",\n    )\n    qualified = pipeline.qualify(first["fingerprint"], qualified=True, reason="Human review approved", business_need="hire a remote software engineer")\n    assert qualified["qualified"] is True\n    second = pipeline.process(\n        source="test", source_id="qualified-duplicate",\n        url="https://example.com/jobs/qualified-duplicate", company="Acme",\n        person="Alex", signal="remote software engineer", evidence="Remote software engineer opening.",\n    )\n    assert second["status"] != "duplicate"\n    assert second["accepted"] is True\n    pipeline.qualify(second["fingerprint"], qualified=True, reason="Human review approved", business_need="hire a remote software engineer")\n    final = pipeline.finalize(second["fingerprint"])\n    assert final["status"] == "duplicate"\n    assert final["duplicate"] is True\n'''
          if old_test not in s:
              raise SystemExit('legacy qualified duplicate test not found')
          p.write_text(s.replace(old_test, new_test, 1))

          # Discovery identity tests now reflect the locked rule: repeated source
          # events are separate observations, not duplicates before qualification.
          p = Path('lead_engine/test_lead_fingerprint.py')
          s = p.read_text()
          s = s.replace('def test_same_source_identity_matches():', 'def test_same_source_identity_does_not_collapse_distinct_company_observations():')
          s = s.replace('    assert same_lead(first, second)\n\n\ndef test_different_source_identity_does_not_match():', '    assert not same_lead(first, second)\n\n\ndef test_different_source_identity_does_not_match():', 1)
          s = s.replace('def test_fingerprint_uses_canonical_lead_identity():', 'def test_fingerprint_includes_observation_context():')
          s = s.replace('    assert lead_fingerprint(first) == lead_fingerprint(second)\n', '    assert lead_fingerprint(first) != lead_fingerprint(second)\n', 1)
          p.write_text(s)

          p = Path('lead_engine/test_lead_identity.py')
          s = p.read_text()
          s = s.replace('    assert lead_identity(lead) == lead_identity(\n', '    assert lead_identity(lead) != lead_identity(\n', 1)
          p.write_text(s)

          p = Path('lead_engine/test_opportunity_identity_and_agents.py')
          s = p.read_text()
          s = s.replace('def test_same_source_event_remains_one_opportunity():', 'def test_same_source_event_is_a_new_observation_until_final_dedupe():')
          s = s.replace('    assert lead_identity(first) == lead_identity(updated_evidence)\n', '    assert lead_identity(first) != lead_identity(updated_evidence)\n', 1)
          p.write_text(s)

          # Production collection must preserve repeated observations. Exact duplicate
          # decisions are made only by finalization after qualification.
          p = Path('lead_engine/test_production_integration.py')
          s = p.read_text()
          s = s.replace('    assert second["results"][0]["result"]["accepted_count"] == 0\n', '    assert second["results"][0]["result"]["accepted_count"] == 1\n', 1)
          p.write_text(s)

          # Remove all temporary Phase 6 mutation/diagnostic workflows.
          for path in Path('.github/workflows').glob('phase6_*.yml'):
              path.unlink()
          PY
      - name: Run Phase 6 regression tests
        run: python -m pytest -q lead_engine/test_phase6_opportunity_dedupe.py lead_engine/test_dedupe.py lead_engine/test_lead_fingerprint.py lead_engine/test_lead_identity.py lead_engine/test_opportunity_identity_and_agents.py lead_engine/test_pipeline_delivery_boundary.py lead_engine/test_production_integration.py
      - name: Run full test suite
        run: python -m pytest -q
      - name: Commit verified Phase 6 implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lead_engine .github/workflows
          git commit -m 'Finalize strict post-qualification opportunity deduplication' || exit 0
          git push
