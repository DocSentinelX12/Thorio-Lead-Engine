name: Free External GPU Runner

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  dispatch-gpu-branch:
    name: Dispatch GPU-branch Free External GPU Runner
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch feature/gpu-fabric-foundation workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer ${GH_TOKEN}"             -H "X-GitHub-Api-Version: 2026-03-10"             https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/free-external-gpu-runner.yml/dispatches             -d '{"ref":"feature/gpu-fabric-foundation"}'
          echo "Dispatched Free External GPU Runner on feature/gpu-fabric-foundation."
