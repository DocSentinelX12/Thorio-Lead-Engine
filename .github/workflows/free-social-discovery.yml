name: Free Authenticated Social Discovery

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: free-social-discovery-manual
  cancel-in-progress: true

jobs:
  free-social-discovery:
    if: ${{ runner.environment == 'self-hosted' }}
    runs-on: self-hosted
    timeout-minutes: 360
    env:
      THORIO_FREE_ONLY: "1"
      THORIO_BROWSER_HEADLESS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify free-only policy
        shell: bash
        run: |
          set -euo pipefail
          test "${THORIO_FREE_ONLY}" = "1"
          test "${RUNNER_ENVIRONMENT}" = "self-hosted"
          test -n "${THORIO_BROWSER_PROFILE_DIR:-}"
          test -d "${THORIO_BROWSER_PROFILE_DIR}"
          test -n "${THORIO_BROWSER_DISCOVERY_TARGETS:-}"

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check -r requirements-browser.txt
          python -m playwright install chromium

      - name: Validate browser discovery configuration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from lead_engine.browser_discovery import _targets_from_environment
          targets = _targets_from_environment()
          if not targets:
              raise SystemExit("No browser discovery targets configured")
          print(f"Configured browser discovery targets: {len(targets)}")
          print("Free-only collection policy: enabled")
          PY

      - name: Run free discovery continuously
        shell: bash
        run: |
          set -euo pipefail
          python -m lead_engine.cli run-scheduled --interval 60 --forever
