name: NCCL Workflow Static Validation

on:
  push:
    paths:
      - .github/workflows/physical-multi-node-nccl-proof.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    name: Lint physical multi-node NCCL workflow
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install actionlint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/actionlint
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.12 /tmp/actionlint

      - name: Validate NCCL workflow
        shell: bash
        run: |
          set -euo pipefail
          actionlint .github/workflows/physical-multi-node-nccl-proof.yml
