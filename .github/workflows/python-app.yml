name: Thorio Lead Engine

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: thorio-lead-engine-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  test:
    name: Test Lead Engine
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          python -m pip install pytest

      - name: Run pytest
        run: |
          python -m pytest

  engine:
    name: Run Lead Engine
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest

    env:
      AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
      AIRTABLE_BASE_ID: ${{ vars.AIRTABLE_BASE_ID || secrets.AIRTABLE_BASE_ID }}
      AIRTABLE_LEAD_TABLE: ${{ vars.AIRTABLE_LEAD_TABLE || secrets.AIRTABLE_LEAD_TABLE || 'Lead Radar' }}

      LEAD_ENGINE_FREE_SOURCES_ENABLED: "true"
      LEAD_ENGINE_FREE_SOURCE_TIMEOUT: "20"

      LEAD_ENGINE_SYNC_ENABLED: "true"
      LEAD_ENGINE_BATCH_SIZE: "50"
      LEAD_ENGINE_DATA_DIR: "data"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Find newest usable engine state
        id: previous_state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous_run_id=""

          while IFS= read -r run_id; do
            [ -z "$run_id" ] && continue

            artifact_id="$(
              gh api \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" \
                --paginate \
                --jq '
                  .artifacts[]
                  | select(
                      .name == "thorio-lead-engine-state"
                      and .expired == false
                    )
                  | .id
                ' \
                | head -n 1
            )"

            if [ -n "$artifact_id" ]; then
              previous_run_id="$run_id"
              echo "Found newest usable Lead Engine state: $run_id"
              echo "State artifact ID: $artifact_id"
              break
            fi
          done < <(
            gh run list \
              --workflow python-app.yml \
              --branch main \
              --limit 50 \
              --json databaseId,event,status \
              --jq '
                .[]
                | select(
                    .status == "completed"
                    and (
                      .event == "schedule"
                      or .event == "push"
                      or .event == "workflow_dispatch"
                    )
                  )
                | .databaseId
              '
          )

          echo "run_id=$previous_run_id" >> "$GITHUB_OUTPUT"

          if [ -n "$previous_run_id" ]; then
            echo "Previous Lead Engine state run: $previous_run_id"
          else
            echo "No previous Lead Engine state artifact found."
          fi

      - name: Download previous Lead Engine state
        if: steps.previous_state.outputs.run_id != ''
        uses: actions/download-artifact@v6
        with:
          name: thorio-lead-engine-state
          path: data
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.previous_state.outputs.run_id }}

      - name: Ensure Lead Engine data directory exists
        run: |
          mkdir -p data

      - name: Run Lead Engine continuously for bounded window
        run: |
          set -o pipefail
          python -m lead_engine run-scheduled \
            --interval 60 \
            --cycles 10 \
            2>&1 | tee data/scheduled-run-output.txt

      - name: Verify production Airtable delivery
        run: |
          python - <<'PY'
          import json
          import pathlib
          import re
          import sys

          path = pathlib.Path(
              "data/scheduled-run-output.txt"
          )

          if not path.exists():
              print(
                  "PRODUCTION DELIVERY FAILURE: "
                  "scheduled run output was not created."
              )
              sys.exit(1)

          text = path.read_text(
              encoding="utf-8"
          )

          decoder = json.JSONDecoder()
          result = None

          for match in re.finditer(
              r"(?m)^\{",
              text,
          ):
              try:
                  candidate, end = decoder.raw_decode(
                      text[match.start():]
                  )
              except json.JSONDecodeError:
                  continue

              if isinstance(candidate, dict):
                  result = candidate

          if result is None:
              print(
                  "PRODUCTION DELIVERY FAILURE: "
                  "no valid Lead Engine result was found."
              )
              sys.exit(1)

          sync_values = []

          sync_result = result.get(
              "sync"
          )

          if isinstance(
              sync_result,
              dict,
          ):
              sync_values.append(
                  sync_result
              )

          elif isinstance(
              sync_result,
              list,
          ):
              sync_values.extend(
                  item
                  for item in sync_result
                  if isinstance(item, dict)
              )

          if not sync_values:
              print(
                  "PRODUCTION DELIVERY FAILURE: "
                  "the scheduled run did not return an Airtable "
                  "synchronization result."
              )
              sys.exit(1)

          failed_count = 0

          for item in sync_values:
              try:
                  failed_count += int(
                      item.get(
                          "failed_count",
                          0,
                      )
                      or 0
                  )
              except (
                  TypeError,
                  ValueError,
              ):
                  failed_count += 1

          if failed_count > 0:
              print(
                  "PRODUCTION DELIVERY FAILURE: "
                  f"{failed_count} Airtable synchronization "
                  "operation(s) failed."
              )
              sys.exit(1)

          print(
              "PRODUCTION AIRTABLE DELIVERY VERIFIED: "
              "no synchronization failures reported."
          )

      - name: Report actual Lead Engine result
        if: always()
        run: |
          echo ""
          echo "=============================================="
          echo "THORIO LEAD ENGINE PRODUCTION RUN REPORT"
          echo "=============================================="
          echo ""

          if [ -f data/scheduled-run-output.txt ]; then
            cat data/scheduled-run-output.txt
          else
            echo "No scheduled run output file was created."
          fi

          echo ""
          echo "=============================================="
          echo "END LEAD ENGINE PRODUCTION RUN REPORT"
          echo "=============================================="

      - name: Save Lead Engine state
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: thorio-lead-engine-state
          path: data
          retention-days: 90
          overwrite: true
          if-no-files-found: warn
