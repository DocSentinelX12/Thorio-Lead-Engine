      THORIO_ACCOUNT_FACEBOOK_PASSWORD_SELECTOR: ${{ vars.THORIO_ACCOUNT_FACEBOOK_PASSWORD_SELECTOR || secrets.THORIO_ACCOUNT_FACEBOOK_PASSWORD_SELECTOR }}
      THORIO_ACCOUNT_FACEBOOK_SUBMIT_SELECTOR: ${{ vars.THORIO_ACCOUNT_FACEBOOK_SUBMIT_SELECTOR || secrets.THORIO_ACCOUNT_FACEBOOK_SUBMIT_SELECTOR }}
      THORIO_ACCOUNT_HACKER_NEWS_USERNAME: ${{ secrets.THORIO_ACCOUNT_HACKER_NEWS_USERNAME }}
      THORIO_ACCOUNT_HACKER_NEWS_PASSWORD: ${{ secrets.THORIO_ACCOUNT_HACKER_NEWS_PASSWORD }}
      THORIO_ACCOUNT_HACKER_NEWS_LOGIN_URL: ${{ vars.THORIO_ACCOUNT_HACKER_NEWS_LOGIN_URL || secrets.THORIO_ACCOUNT_HACKER_NEWS_LOGIN_URL }}
      THORIO_ACCOUNT_HACKER_NEWS_USERNAME_SELECTOR: ${{ vars.THORIO_ACCOUNT_HACKER_NEWS_USERNAME_SELECTOR || secrets.THORIO_ACCOUNT_HACKER_NEWS_USERNAME_SELECTOR }}
      THORIO_ACCOUNT_HACKER_NEWS_PASSWORD_SELECTOR: ${{ vars.THORIO_ACCOUNT_HACKER_NEWS_PASSWORD_SELECTOR || secrets.THORIO_ACCOUNT_HACKER_NEWS_PASSWORD_SELECTOR }}
      THORIO_ACCOUNT_HACKER_NEWS_SUBMIT_SELECTOR: ${{ vars.THORIO_ACCOUNT_HACKER_NEWS_SUBMIT_SELECTOR || secrets.THORIO_ACCOUNT_HACKER_NEWS_SUBMIT_SELECTOR }}
