      THORIO_ACCOUNT_INDIE_HACKERS_PASSWORD_SELECTOR: ${{ vars.THORIO_ACCOUNT_INDIE_HACKERS_PASSWORD_SELECTOR || secrets.THORIO_ACCOUNT_INDIE_HACKERS_PASSWORD_SELECTOR }}
      THORIO_ACCOUNT_INDIE_HACKERS_SUBMIT_SELECTOR: ${{ vars.THORIO_ACCOUNT_INDIE_HACKERS_SUBMIT_SELECTOR || secrets.THORIO_ACCOUNT_INDIE_HACKERS_SUBMIT_SELECTOR }}
