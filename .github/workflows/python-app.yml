name: Thorio Lead Engine

on:
  # Production runs are deliberately independent from code-push testing.
  # Pushes and pull requests are handled by .github/workflows/ci.yml.
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: thorio-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  test:
    name: Production Preflight Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          python -m pip install pytest pytest-timeout

      - name: Run pytest
        run: |
          python -m pytest -vv -ra --tb=short --timeout=900 --durations=25

  engine:
    name: Run Lead Engine
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_PAT || secrets.AIRTABLE_API_KEY }}
      AIRTABLE_BASE_ID: appxz89RYpxIOpdMD
      AIRTABLE_LEAD_TABLE: Lead Radar
      LEAD_ENGINE_FREE_SOURCES_ENABLED: "true"
      LEAD_ENGINE_FREE_SOURCE_TIMEOUT: "20"
      LEAD_ENGINE_SYNC_ENABLED: "true"
      LEAD_ENGINE_BATCH_SIZE: "50"
      LEAD_ENGINE_DATA_DIR: "data"
      THORIO_FREE_ONLY: "1"
      THORIO_ACCOUNT_LINKEDIN_USERNAME: ${{ secrets.THORIO_ACCOUNT_LINKEDIN_USERNAME }}
      THORIO_ACCOUNT_LINKEDIN_PASSWORD: ${{ secrets.THORIO_ACCOUNT_LINKEDIN_PASSWORD }}
      THORIO_ACCOUNT_X_USERNAME: ${{ secrets.THORIO_ACCOUNT_X_USERNAME }}
      THORIO_ACCOUNT_X_PASSWORD: ${{ secrets.THORIO_ACCOUNT_X_PASSWORD }}
      THORIO_ACCOUNT_THREADS_USERNAME: ${{ secrets.THORIO_ACCOUNT_THREADS_USERNAME }}
      THORIO_ACCOUNT_THREADS_PASSWORD: ${{ secrets.THORIO_ACCOUNT_THREADS_PASSWORD }}
      THORIO_ACCOUNT_FACEBOOK_USERNAME: ${{ secrets.THORIO_ACCOUNT_FACEBOOK_USERNAME }}
      THORIO_ACCOUNT_FACEBOOK_PASSWORD: ${{ secrets.THORIO_ACCOUNT_FACEBOOK_PASSWORD }}
      THORIO_ACCOUNT_HACKER_NEWS_USERNAME: ${{ secrets.THORIO_ACCOUNT_HACKER_NEWS_USERNAME }}
      THORIO_ACCOUNT_HACKER_NEWS_PASSWORD: ${{ secrets.THORIO_ACCOUNT_HACKER_NEWS_PASSWORD }}
      THORIO_ACCOUNT_INDIE_HACKERS_USERNAME: ${{ secrets.THORIO_ACCOUNT_INDIE_HACKERS_USERNAME }}
      THORIO_ACCOUNT_INDIE_HACKERS_PASSWORD: ${{ secrets.THORIO_ACCOUNT_INDIE_HACKERS_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Verify account authentication configuration
        run: |
          python - <<'PY'
          from lead_engine.account_auth import SUPPORTED_ACCOUNTS, auth_status

          status = auth_status()
          missing = [account for account in SUPPORTED_ACCOUNTS if not status[account]["configured"]]
          if missing:
              print("ACCOUNT AUTH CONFIGURATION FAILURE: missing credentials for " + ", ".join(missing))
              raise SystemExit(1)

          for account in SUPPORTED_ACCOUNTS:
              item = status[account]
              print(
                  f"{account}: configured={item['configured']} "
                  f"username_configured={item['username_configured']} "
                  f"password_configured={item['password_configured']} "
                  f"storage_state_configured={item['storage_state_configured']} "
                  f"secrets_exposed={item['secrets_exposed']}"
              )
          print("ACCOUNT AUTH CONFIGURATION VERIFIED: all agreed accounts are available to the production runtime without exposing secret values.")
          PY

      - name: Verify complete free source catalog wiring
        run: |
          python - <<'PY'
          from lead_engine.source_registry import _load_free_source_catalog, configured_sources

          expected_minimum = 42
          catalog = _load_free_source_catalog()
          configured = configured_sources()
          catalog_names = {definition.name for definition in catalog}
          configured_names = {source.name for source in configured}
          missing = sorted(catalog_names - configured_names)

          print(f"Enabled free source definitions: {len(catalog)}")
          print(f"Configured runtime sources: {len(configured)}")

          if len(catalog) < expected_minimum:
              print(f"FREE SOURCE UNIVERSE FAILURE: expected at least {expected_minimum} enabled public sources, found {len(catalog)}.")
              raise SystemExit(1)

          if missing:
              print("FREE SOURCE WIRING FAILURE: catalog entries missing from configured runtime sources:")
              for name in missing:
                  print(f"- {name}")
              raise SystemExit(1)

          print("FREE SOURCE WIRING VERIFIED: the complete enabled public catalog is handed to the runtime source registry in addition to discovery account layers.")
          PY

      - name: Find newest usable engine state
        id: previous_state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous_run_id=""
          while IFS= read -r run_id; do
            [ -z "$run_id" ] && continue
            artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" --paginate --jq '.artifacts[] | select(.name == "thorio-lead-engine-state" and .expired == false) | .id' | head -n 1)"
            if [ -n "$artifact_id" ]; then
              previous_run_id="$run_id"
              break
            fi
          done < <(gh run list --workflow python-app.yml --branch main --limit 50 --json databaseId,event,status --jq '.[] | select(.status == "completed" and (.event == "schedule" or .event == "workflow_dispatch")) | .databaseId')
          echo "run_id=$previous_run_id" >> "$GITHUB_OUTPUT"

      - name: Download previous Lead Engine state
        if: steps.previous_state.outputs.run_id != ''
        uses: actions/download-artifact@v6
        with:
          name: thorio-lead-engine-state
          path: data
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.previous_state.outputs.run_id }}

      - name: Ensure Lead Engine data directory exists
        run: mkdir -p data

      - name: Run Lead Engine continuously for bounded window
        run: |
          set -o pipefail
          python -m lead_engine run-scheduled --interval 60 --cycles 10 2>&1 | tee data/scheduled-run-output.txt

      - name: Verify active collection and Airtable delivery
        run: |
          python - <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path("data/scheduled-run-output.txt")
          if not path.exists():
              print("PRODUCTION COLLECTION FAILURE: scheduled run output was not created.")
              sys.exit(1)

          text = path.read_text(encoding="utf-8")
          decoder = json.JSONDecoder()
          results = []
          position = 0
          while position < len(text):
              start = text.find("{", position)
              if start == -1:
                  break
              try:
                  candidate, end = decoder.raw_decode(text[start:])
              except json.JSONDecodeError:
                  position = start + 1
                  continue
              if isinstance(candidate, dict):
                  results.append(candidate)
              position = start + end

          if not results:
              print("PRODUCTION COLLECTION FAILURE: no valid Lead Engine result was found.")
              print(text)
              sys.exit(1)

          discovered_total = sum(int(result.get("discovered_count", 0) or 0) for result in results)
          successful_source_counts = [int(result.get("successful_source_count", 0) or 0) for result in results]
          source_counts = [int(result.get("source_count", 0) or 0) for result in results]
          executed_results = sum(
              len(result.get("results", []))
              for result in results
              if isinstance(result.get("results"), list)
          )
          failed_sources = sum(int(result.get("failed_count", 0) or 0) for result in results)

          print(f"Lead Engine result objects detected: {len(results)}")
          print(f"Configured source count observed: {max(source_counts, default=0)}")
          print(f"Successful source executions observed: {max(successful_source_counts, default=0)}")
          print(f"Source executions observed: {executed_results}")
          print(f"Freshly discovered records observed: {discovered_total}")
          print(f"Source execution failures observed: {failed_sources}")

          if max(source_counts, default=0) < 42:
              print("PRODUCTION COLLECTION FAILURE: fewer than the restored 42 public sources reached the live scheduler.")
              sys.exit(1)
          if executed_results <= 0:
              print("PRODUCTION COLLECTION FAILURE: no collection source actually executed.")
              sys.exit(1)
          if max(successful_source_counts, default=0) <= 0:
              print("PRODUCTION COLLECTION FAILURE: configured sources executed but none completed successfully.")
              sys.exit(1)

          if discovered_total <= 0:
              print("PRODUCTION COLLECTION NOTICE: sources executed successfully but no new records were returned in this window.")
              print("This is not treated as a dead collector. Checkpointing and source polling can legitimately yield zero new records after prior data has been consumed.")

          sync_values = []
          for result in results:
              sync_result = result.get("sync")
              if isinstance(sync_result, dict):
                  sync_values.append(sync_result)
              elif isinstance(sync_result, list):
                  sync_values.extend(item for item in sync_result if isinstance(item, dict))

          if not sync_values:
              print("PRODUCTION DELIVERY FAILURE: scheduled run returned no Airtable synchronization result.")
              sys.exit(1)

          failed_count = 0
          for item in sync_values:
              try:
                  failed_count += int(item.get("failed_count", 0) or 0)
              except (TypeError, ValueError):
                  failed_count += 1

          print(f"Airtable synchronization results detected: {len(sync_values)}")
          print(f"Total Airtable synchronization failures: {failed_count}")
          if failed_count > 0:
              print("PRODUCTION DELIVERY FAILURE: synchronization operations failed.")
              for item in sync_values:
                  if item.get("failed_count", 0):
                      print(json.dumps(item, indent=2, sort_keys=True))
              sys.exit(1)

          print("PRODUCTION COLLECTION AND AIRTABLE DELIVERY VERIFIED: live sources executed successfully and no synchronization failures were reported.")
          PY

      - name: Report actual Lead Engine result
        if: always()
        run: |
          echo "THORIO LEAD ENGINE PRODUCTION RUN REPORT"
          if [ -f data/scheduled-run-output.txt ]; then cat data/scheduled-run-output.txt; else echo "No scheduled run output file was created."; fi

      - name: Capture complete workflow dispatch evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/workflow-evidence
          printf '%s\n' "$GITHUB_EVENT_PATH" > data/workflow-evidence/event-path.txt
          cp "$GITHUB_EVENT_PATH" data/workflow-evidence/github-event.json
          gh run view "$GITHUB_RUN_ID" --json databaseId,name,displayTitle,event,status,conclusion,workflowName,headBranch,headSha,createdAt,startedAt,updatedAt,runNumber,runAttempt,url,jobs > data/workflow-evidence/run.json || true
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" > data/workflow-evidence/jobs.json || true
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > data/workflow-evidence/run-api.json || true
          gh run view "$GITHUB_RUN_ID" --log > data/workflow-evidence/full-run-log.txt 2>&1 || true
          if [ -f data/scheduled-run-output.txt ]; then cp data/scheduled-run-output.txt data/workflow-evidence/scheduled-run-output.txt; fi
          if [ -f data/engine-state.json ]; then cp data/engine-state.json data/workflow-evidence/engine-state.json; fi
          printf 'repository=%s\nrun_id=%s\nrun_attempt=%s\nevent=%s\nworkflow=%s\nworkflow_ref=%s\nsha=%s\nref=%s\nactor=%s\nrunner=%s\nos=%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_EVENT_NAME" "$GITHUB_WORKFLOW" "$GITHUB_WORKFLOW_REF" "$GITHUB_SHA" "$GITHUB_REF" "$GITHUB_ACTOR" "$RUNNER_NAME" "$RUNNER_OS" \
            > data/workflow-evidence/runtime-context.txt
          echo "Complete workflow evidence captured. Secret values are not written by this step."

      - name: Upload complete workflow dispatch evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: thorio-workflow-run-evidence-${{ github.run_id }}
          path: data/workflow-evidence
          retention-days: 90
          if-no-files-found: warn

      - name: Save Lead Engine state
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: thorio-lead-engine-state
          path: data
          retention-days: 90
          overwrite: true
          if-no-files-found: warn
