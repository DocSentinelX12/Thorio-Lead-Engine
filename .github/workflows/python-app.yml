    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install playwright cryptography
          python -m playwright install --with-deps chromium
      - name: Report outbound revenue transport readiness
        id: revenue_transport_readiness
        run: |
          python - <<'PY'
          import json
          import os

          mode = os.environ.get("THORIO_REVENUE_TRANSPORT_MODE", "").strip().lower()
          url_configured = bool(os.environ.get("THORIO_REVENUE_TRANSPORT_URL", "").strip())
          token_configured = bool(os.environ.get("THORIO_REVENUE_TRANSPORT_TOKEN", "").strip())
          raw_targets = os.environ.get("THORIO_REVENUE_BROWSER_TARGETS", "").strip()
          targets = []
          target_error = False
          if raw_targets:
              try:
                  value = json.loads(raw_targets)
                  if isinstance(value, list):
                      targets = [item for item in value if isinstance(item, dict)]
                  else:
                      target_error = True
              except json.JSONDecodeError:
                  target_error = True

          http_ready = url_configured and token_configured
          browser_state_key_configured = bool(os.environ.get("THORIO_BROWSER_STATE_ENCRYPTION_KEY", "").strip())
          gmail_username = os.environ.get("THORIO_ACCOUNT_GMAIL_USERNAME", "").strip().lower()
          gmail_password_configured = bool(os.environ.get("THORIO_ACCOUNT_GMAIL_PASSWORD", "").strip())
          gmail_ready = gmail_username == "thorio.partners@gmail.com" and gmail_password_configured
          browser_ready = bool(targets) and not target_error and browser_state_key_configured
          if mode == "http":
              ready = http_ready
          elif mode == "browser":
              ready = browser_ready
          elif mode == "gmail_smtp":
              ready = gmail_ready
          elif mode in {"", "auto"}:
              ready = http_ready or browser_ready or gmail_ready
          else:
              ready = False

          print(
              "OUTBOUND REVENUE TRANSPORT READINESS: "
              f"configured={str(ready).lower()} mode={mode or 'auto'} "
              f"http_url_configured={str(url_configured).lower()} "
              f"http_token_configured={str(token_configured).lower()} "
              f"browser_target_count={len(targets)} "
              f"browser_target_config_invalid={str(target_error).lower()} "
              f"browser_state_key_configured={str(browser_state_key_configured).lower()} "
              f"gmail_sender_configured={str(gmail_username == 'thorio.partners@gmail.com').lower()} "
              f"gmail_password_configured={str(gmail_password_configured).lower()}"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"ready={str(ready).lower()}\n")
          if not ready:
              print(
                  "OUTBOUND REVENUE BLOCKER: no usable explicitly configured transport "
                  "is available to the production runtime; collection can continue, "
                  "but external outreach is not ready."
              )
          PY


      - name: Report public discovery source readiness
        id: public_discovery_readiness
        run: |
          python - <<'PY'
          import os
          from lead_engine.browser_discovery import configured_browser_discovery_sources
          from lead_engine.discovery_collectors import load_authorized_discovery_configs

          api_configs = load_authorized_discovery_configs(required=False)
          browser_sources = configured_browser_discovery_sources()
          browser_state_key_configured = bool(os.environ.get("THORIO_BROWSER_STATE_ENCRYPTION_KEY", "").strip())
          api_lanes = sorted({item.lane for item in api_configs})
          browser_lanes = sorted({item.lane for item in browser_sources})
          ready = bool(api_configs) or (bool(browser_sources) and browser_state_key_configured)
          print(
              "PUBLIC DISCOVERY READINESS: "
              f"api_lane_count={len(api_lanes)} api_lanes={api_lanes} "
              f"browser_target_count={len(browser_sources)} browser_lanes={browser_lanes} "
              f"browser_state_key_configured={str(browser_state_key_configured).lower()}"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"ready={str(ready).lower()}\n")
          if not api_configs and not browser_sources:
              print(
                  "PUBLIC DISCOVERY BLOCKER: no API-backed or authenticated-browser "
                  "discovery sources are configured for this production runtime. "
                  "The 40-source public job catalog can still collect jobs, but it "
                  "does not replace public business-intent discovery for outreach."
              )
          elif browser_sources and not browser_state_key_configured:
              print("PUBLIC DISCOVERY BLOCKER: authenticated-browser discovery is configured, but THORIO_BROWSER_STATE_ENCRYPTION_KEY is missing; the browser worker cannot be started safely.")
          PY


      - name: Report inbound revenue observation readiness
        id: revenue_inbound_readiness
        run: |
          python - <<'PY'
          import imaplib
          import os
          import smtplib
          import ssl
          from lead_engine.browser_revenue_inbound import configured_browser_revenue_inbound_targets
          from lead_engine.gmail_imap_inbound import gmail_imap_configured

          mode = os.environ.get("THORIO_REVENUE_TRANSPORT_MODE", "").strip().lower()
          http_url = bool(os.environ.get("THORIO_REVENUE_TRANSPORT_URL", "").strip())
          http_token = bool(os.environ.get("THORIO_REVENUE_TRANSPORT_TOKEN", "").strip())
          browser_outbound_configured = bool(os.environ.get("THORIO_REVENUE_BROWSER_TARGETS", "").strip())
          browser_state_key = bool(os.environ.get("THORIO_BROWSER_STATE_ENCRYPTION_KEY", "").strip())
          try:
              browser_targets = configured_browser_revenue_inbound_targets()
              browser_config_valid = True
          except Exception as exc:
              browser_targets = {}
              browser_config_valid = False
              print(f"INBOUND BROWSER CONFIGURATION INVALID: {type(exc).__name__}")
          gmail_transport_selected = (
              mode == "gmail_smtp"
              or (
                  mode in {"", "auto"}
                  and not http_url
                  and not http_token
                  and not browser_outbound_configured
              )
          )
          gmail_ready = False
          if gmail_transport_selected and gmail_imap_configured():
              username = os.environ.get("THORIO_ACCOUNT_GMAIL_USERNAME", "").strip()
              password = os.environ.get("THORIO_ACCOUNT_GMAIL_PASSWORD", "").strip()
              imap_client = None
              smtp_ready = False
              smtp_method = ""
              smtp_failures = []
              for method, port in (("starttls", 587), ("ssl", 465)):
                  smtp_client = None
                  stage = f"{method}_connect"
                  try:
                      if method == "starttls":
                          smtp_client = smtplib.SMTP("smtp.gmail.com", port, timeout=15)
                          stage = "smtp_starttls"
                          smtp_client.ehlo()
                          smtp_client.starttls(context=ssl.create_default_context())
                          smtp_client.ehlo()
                      else:
                          smtp_client = smtplib.SMTP_SSL(
                              "smtp.gmail.com", port, timeout=15,
                              context=ssl.create_default_context(),
                          )
                      stage = f"{method}_login"
                      smtp_client.login(username, password)
                      smtp_ready = True
                      smtp_method = f"{method}:{port}"
                      break
                  except smtplib.SMTPAuthenticationError as exc:
                      smtp_failures.append(f"{stage}:{type(exc).__name__}")
                      break
                  except Exception as exc:
                      smtp_failures.append(f"{stage}:{type(exc).__name__}")
                  finally:
                      if smtp_client is not None:
                          try:
                              smtp_client.quit()
                          except Exception:
                              pass
              try:
                  if not smtp_ready:
                      raise RuntimeError("Gmail SMTP auth failed on both supported connection modes")
                  stage = "imap_connect"
                  imap_client = imaplib.IMAP4_SSL(
                      "imap.gmail.com", 993,
                      ssl_context=ssl.create_default_context(), timeout=15,
                  )
                  stage = "imap_login"
                  login_status, _ = imap_client.login(username, password)
                  if login_status != "OK":
                      raise RuntimeError("Gmail IMAP login was not accepted")
                  stage = "imap_select"
                  select_status, _ = imap_client.select("INBOX", readonly=True)
                  if select_status != "OK":
                      raise RuntimeError("Gmail IMAP inbox could not be selected")
                  gmail_ready = True
                  print(f"GMAIL SMTP/IMAP LIVE AUTH VERIFIED via {smtp_method}; no email was sent.")
              except Exception as exc:
                  detail = "; ".join(smtp_failures)
                  suffix = f"; SMTP attempts={detail}" if detail else ""
                  print(f"GMAIL SMTP/IMAP LIVE AUTH FAILED at {stage}: {type(exc).__name__}{suffix}; no email was sent.")
                  gmail_ready = False
              finally:
                  if imap_client is not None:
                      try:
                          imap_client.logout()
                      except Exception:
                          pass
          browser_ready = bool(browser_targets) and browser_config_valid and browser_state_key and (
              mode in {"browser", "http"}
              or (mode in {"", "auto"} and browser_outbound_configured)
          )
          ready = gmail_ready or browser_ready
          print(
              "INBOUND REVENUE OBSERVATION READINESS: "
              f"configured={str(ready).lower()} "
              f"gmail_imap_ready={str(gmail_ready).lower()} "
              f"browser_target_count={len(browser_targets)} "
              f"browser_state_key_configured={str(browser_state_key).lower()}"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"ready={str(ready).lower()}\n")
          if not ready:
              print(
                  "INBOUND REVENUE BLOCKER: no reply observer matches the selected outbound transport. "
                  "Scheduled follow-ups remain fail-closed until real inbox observation is configured."
              )
          PY

      - name: Select and verify Airtable production credential
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          base_id = os.environ["AIRTABLE_BASE_ID"]
          table = urllib.parse.quote(os.environ.get("AIRTABLE_LEAD_TABLE", "Lead Radar"), safe="")
          url = f"https://api.airtable.com/v0/{base_id}/{table}"
          candidates = [
              ("AIRTABLE_PAT", os.environ.get("AIRTABLE_PAT_CANDIDATE", "").strip()),
              ("AIRTABLE_API_KEY", os.environ.get("AIRTABLE_API_KEY_CANDIDATE", "").strip()),
          ]
          probe_id = f"__THORIO_CREDENTIAL_PROBE__{int(time.time())}"
          probe_fields = {"Lead": probe_id, "Applicable Routes": ["Thorio"]}
          selected = None
          capacity_blocked = False
          capacity_credential = None

          for label, token in candidates:
              if not token:
                  print(f"{label}: not configured; skipping")
                  continue
              request = urllib.request.Request(
                  url,
                  data=json.dumps({"records": [{"fields": probe_fields}]}).encode("utf-8"),
                  headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"},
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      status = response.status
                      body = response.read().decode("utf-8", errors="replace")
              except urllib.error.HTTPError as exc:
                  status = exc.code
                  body = exc.read().decode("utf-8", errors="replace")
              except Exception as exc:
                  print(f"{label}: write probe failed before HTTP response: {exc}")
                  continue
              if status not in (200, 201):
                  diagnostic = " ".join(str(body).replace(token, "[REDACTED]").split())[:1200]
                  if status == 422 and "TOO_MANY_RECORDS_IN_BASE" in body:
                      capacity_blocked = True
                      capacity_credential = (label, token)
                      print(
                          f"{label}: Airtable accepted the request but rejected the write because "
                          "the base record limit has been reached (HTTP 422 TOO_MANY_RECORDS_IN_BASE)."
                      )
                      # Capacity is a base-level constraint; another token cannot fix it.
                      break
                  elif status in (401, 403):
                      print(f"{label}: Airtable authentication/authorization failed with HTTP {status}: {diagnostic or 'no response body'}")
                  else:
                      print(f"{label}: Airtable write probe failed with HTTP {status}: {diagnostic or 'no response body'}")
                  continue
              try:
                  payload = json.loads(body)
              except json.JSONDecodeError:
                  payload = {}
              records = payload.get("records", []) if isinstance(payload, dict) else []
              record_id = records[0].get("id") if records else None
              if not record_id:
                  print(f"{label}: write probe returned success without a record ID.")
                  continue
              selected = (label, token, record_id)
              print(f"{label}: Thorio multiple-select write probe succeeded.")
              break

          if selected is None:
              if capacity_blocked:
                  with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
                      env_file.write("LEAD_ENGINE_SYNC_ENABLED=false\n")
                      env_file.write("AIRTABLE_SYNC_BLOCK_REASON=record_capacity\n")
                      env_file.write("AIRTABLE_READ_ONLY_MODE=true\n")
                      if capacity_credential:
                          capacity_label, capacity_token = capacity_credential
                          env_file.write(f"AIRTABLE_API_KEY={capacity_token}\n")
                          env_file.write(f"AIRTABLE_CREDENTIAL_SOURCE={capacity_label}\n")
                  print(
                      "AIRTABLE SYNC PAUSED: the base record limit blocks all writes. The valid "
                      "credential remains available for read-only source/research access; all Airtable "
                      "mutations are blocked in the runtime. Local SQLite state is preserved and no "
                      "records are deleted."
                  )
                  raise SystemExit(0)
              raise SystemExit(
                  "AIRTABLE AUTHORIZATION/WRITE FAILURE: no configured credential could complete "
                  "the real Thorio route write probe. Review the per-credential HTTP diagnostics above."
              )

          label, token, record_id = selected
          delete_url = f"{url}/{urllib.parse.quote(record_id, safe='')}"
          delete_request = urllib.request.Request(delete_url, headers={"Authorization": f"Bearer {token}"}, method="DELETE")
          try:
              with urllib.request.urlopen(delete_request, timeout=30) as response:
                  if response.status not in (200, 202):
                      raise SystemExit(f"AIRTABLE CREDENTIAL FAILURE: selected credential probe cleanup returned HTTP {response.status}.")
          except urllib.error.HTTPError as exc:
              raise SystemExit(f"AIRTABLE CREDENTIAL FAILURE: selected credential probe cleanup returned HTTP {exc.code}.")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"AIRTABLE_API_KEY={token}\n")
              env_file.write(f"AIRTABLE_CREDENTIAL_SOURCE={label}\n")
          print(f"AIRTABLE CREDENTIAL VERIFIED: {label} selected by a real Thorio route write and cleanup probe.")
          PY
      - name: Verify selected Airtable credential is available to production runtime
        run: |
          python - <<'PY'
          import os
          token = os.environ.get("AIRTABLE_API_KEY", "").strip()
          source = os.environ.get("AIRTABLE_CREDENTIAL_SOURCE", "").strip()
          if not token or not source:
              if os.environ.get("AIRTABLE_SYNC_BLOCK_REASON", "").strip() == "record_capacity":
                  print(
                      "AIRTABLE RUNTIME SYNC DISABLED: confirmed base-capacity blocker; "
                      "local collection remains enabled and durable."
                  )
                  raise SystemExit(0)
              raise SystemExit("AIRTABLE RUNTIME CREDENTIAL FAILURE: selected credential was not propagated to the production runtime.")
          if os.environ.get("AIRTABLE_READ_ONLY_MODE", "").strip().lower() == "true":
              print(f"AIRTABLE RUNTIME CREDENTIAL VERIFIED FOR READS ONLY: selected source={source}; writes remain blocked.")
          else:
              print(f"AIRTABLE RUNTIME CREDENTIAL VERIFIED: selected source={source}; secret value is not exposed.")
          PY
      - name: Audit account credential names without reading secret values
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from lead_engine.account_auth import SUPPORTED_ACCOUNTS, auth_status

          def api_names(endpoint, collection_key):
              try:
                  result = subprocess.run(
                      ["gh", "api", endpoint, "--paginate", "--jq", f".{collection_key}[].name"],
                      capture_output=True, text=True, timeout=20,
                  )
              except (OSError, subprocess.TimeoutExpired):
                  return None
              if result.returncode != 0:
                  return None
              return {line.strip() for line in result.stdout.splitlines() if line.strip()}

          repo_prefix = f"repos/{os.environ['GITHUB_REPOSITORY']}"
          secrets = api_names(f"{repo_prefix}/actions/secrets", "secrets")
          variables = api_names(f"{repo_prefix}/actions/variables", "variables")
          environment_names = api_names(f"{repo_prefix}/environments", "environments")
          environment_scopes = {}
          for environment_name in sorted(environment_names or ()):
              safe_name = __import__("urllib.parse", fromlist=["quote"]).quote(environment_name, safe="")
              env_secrets = api_names(f"{repo_prefix}/environments/{safe_name}/secrets", "secrets")
              env_variables = api_names(f"{repo_prefix}/environments/{safe_name}/variables", "variables")
              environment_scopes[environment_name] = (env_secrets, env_variables)

          status = auth_status()
          print("ACCOUNT CREDENTIAL NAME AUDIT (names and presence only; no values are read):")
          for account in SUPPORTED_ACCOUNTS:
              prefix = "THORIO_ACCOUNT_" + account.upper()
              expected = {prefix + "_USERNAME", prefix + "_PASSWORD", prefix + "_STORAGE_STATE_B64"}
              matching = []
              sources = [("repository_secret", secrets), ("repository_variable", variables)]
              sources.extend(
                  (f"environment_secret:{env_name}", pair[0])
                  for env_name, pair in environment_scopes.items()
              )
              sources.extend(
                  (f"environment_variable:{env_name}", pair[1])
                  for env_name, pair in environment_scopes.items()
              )
              for scope, names in sources:
                  if names is None:
                      continue
                  for name in names:
                      normalized = "".join(character.lower() for character in name if character.isalnum())
                      aliases = {
                          "product_hunt": ("producthunt",),
                          "web_job": ("webjob", "webjobs"),
                      }.get(account, (account.replace("_", ""),))
                      if any(alias in normalized for alias in aliases) and ("thorio" in normalized or normalized.startswith(account.replace("_", ""))):
                          matching.append(f"{scope}:{name}")
              item = status[account]
              print(
                  f"{account}: runtime_configured={item['configured']} "
                  f"username_present={item['username_configured']} "
                  f"password_present={item['password_configured']} "
                  f"storage_state_present={item['storage_state_configured']} "
                  f"expected_repository_secret_names_present={sorted(expected.intersection(secrets or set())) if secrets is not None else 'unavailable'} "
                  f"matching_names={sorted(matching) if any(source is not None for _, source in sources) else 'unavailable'}"
              )
          all_names = [("repository", secrets), ("repository", variables)]
          all_names.extend((f"environment:{env_name}", names) for env_name, pair in environment_scopes.items() for names in pair)
          discovery_names = sorted(
              f"{scope}:{name}" for scope, names in all_names if names is not None for name in names
              if any(marker in name.upper() for marker in (
                  "THORIO_DISCOVERY_", "THORIO_BROWSER_DISCOVERY_TARGETS",
                  "THORIO_REVENUE_BROWSER_TARGETS", "THORIO_REVENUE_BROWSER_INBOUND_TARGETS",
                  "THORIO_REVENUE_TRANSPORT_MODE", "THORIO_REVENUE_TRANSPORT_URL",
              ))
          )
          print("DISCOVERY/INBOUND CONFIG NAMES PRESENT: " + json.dumps(discovery_names))
          print(
              "CONFIG NAME INVENTORY: "
              f"repository_secrets_api={'available' if secrets is not None else 'unavailable'} "
              f"repository_variables_api={'available' if variables is not None else 'unavailable'} "
              f"environment_names_api={'available' if environment_names is not None else 'unavailable'} "
              f"environment_count={len(environment_names or ())}"
          )
          PY
      - name: Verify account authentication configuration
        run: |
          python - <<'PY'
          from lead_engine.account_auth import SUPPORTED_ACCOUNTS, auth_status
          status = auth_status()
          for account in SUPPORTED_ACCOUNTS:
              item = status[account]
              print(f"{account}: configured={item['configured']} username_configured={item['username_configured']} password_configured={item['password_configured']} storage_state_configured={item['storage_state_configured']} secrets_exposed={item['secrets_exposed']}")
          missing = [account for account in SUPPORTED_ACCOUNTS if not status[account]["configured"]]
          if missing:
              print("ACCOUNT AUTH CONFIGURATION FAILURE: missing credentials for " + ", ".join(missing))
              raise SystemExit(1)
          print("ACCOUNT AUTH CONFIGURATION VERIFIED: all agreed accounts are available to the production runtime without exposing secret values.")
          PY
      - name: Verify complete free source catalog wiring
        run: |
          python - <<'PY'
          from lead_engine.source_registry import _load_free_source_catalog, configured_sources
          expected_minimum = 40
          catalog = _load_free_source_catalog()
          configured = configured_sources()
          catalog_names = {definition.name for definition in catalog}
          configured_names = {source.name for source in configured}
          missing = sorted(catalog_names - configured_names)
          print(f"Enabled free source definitions: {len(catalog)}")
          print(f"Configured runtime sources: {len(configured)}")
          if len(catalog) < expected_minimum:
              print(f"FREE SOURCE UNIVERSE FAILURE: expected at least {expected_minimum} enabled public sources, found {len(catalog)}.")
              raise SystemExit(1)
          if missing:
              print("FREE SOURCE WIRING FAILURE: catalog entries missing from configured runtime sources:")
              for name in missing:
                  print(f"- {name}")
              raise SystemExit(1)
          print("FREE SOURCE WIRING VERIFIED: the complete enabled public catalog is handed to the runtime source registry in addition to discovery account layers.")
          PY
      - name: Enforce end-to-end production readiness
        env:
          REVENUE_TRANSPORT_READY: ${{ steps.revenue_transport_readiness.outputs.ready }}
          REVENUE_INBOUND_READY: ${{ steps.revenue_inbound_readiness.outputs.ready }}
          PUBLIC_DISCOVERY_READY: ${{ steps.public_discovery_readiness.outputs.ready }}
        run: |
          missing=()
          if [ "${REVENUE_TRANSPORT_READY:-false}" != "true" ]; then
            missing+=("authorized outbound revenue transport")
          fi
          if [ "${REVENUE_INBOUND_READY:-false}" != "true" ]; then
            missing+=("authenticated inbound reply observation")
          fi
          if [ "${PUBLIC_DISCOVERY_READY:-false}" != "true" ]; then
            missing+=("API-backed or authenticated-browser business-intent discovery")
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'PRODUCTION READINESS BLOCKED: missing %s. Configure the real runtime integration and rerun; no outreach will be reported as ready.\n' "${missing[*]}"
            exit 1
          fi
          echo "PRODUCTION READINESS VERIFIED: live business-intent discovery and an authorized outbound transport are configured."
      - name: Restore durable Turso engine state
        id: turso_restore
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p data
          if [ -n "${TURSO_DATABASE_URL:-}" ] || [ -n "${TURSO_AUTH_TOKEN:-}" ]; then
            python -m lead_engine.turso_state restore --data-dir data > data/turso-restore.log 2>&1 || {
              cat data/turso-restore.log
              exit 1
            }
            cat data/turso-restore.log
            restored="$(sed -n 's/^restored=//p' data/turso-restore.log | tail -n 1)"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "restored=${restored:-false}" >> "$GITHUB_OUTPUT"
          else
            echo "TURSO STATE DISABLED: both repository secrets are not configured; existing artifact recovery remains active."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "restored=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Find newest usable engine state
        id: previous_state
        env:
          GH_TOKEN: ${{ github.token }}
          TURSO_STATE_RESTORED: ${{ steps.turso_restore.outputs.restored }}
        run: |
          set -euo pipefail
          previous_run_id=""
          prior_production_run_id=""
          if [ "${TURSO_STATE_RESTORED:-false}" = "true" ]; then
            echo "ENGINE STATE RECOVERY: complete state restored from Turso; artifact recovery is not needed for SQLite databases."
            echo "run_id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          production_runs="$(gh run list --workflow python-app.yml --branch main --limit 1000 --json databaseId,event,status,conclusion --jq '.[] | select(.status == "completed" and (.conclusion == "success" or .conclusion == "failure") and (.event == "schedule" or .event == "workflow_dispatch" or .event == "repository_dispatch" or .event == "issue_comment" or .event == "issues")) | .databaseId')"
          while IFS= read -r run_id; do
            [ -z "$run_id" ] && continue
            if [ -z "$prior_production_run_id" ]; then
              prior_production_run_id="$run_id"
            fi
            artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" --paginate --jq '.artifacts[] | select(.name == "thorio-lead-engine-state" and .expired == false) | .id' | head -n 1)"
            [ -z "$artifact_id" ] && continue

            candidate_dir="$(mktemp -d)"
            if ! gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name thorio-lead-engine-state --dir "$candidate_dir"; then
              rm -rf "$candidate_dir"
              echo "ENGINE STATE RECOVERY BLOCKED: artifact $artifact_id from run $run_id was listed but could not be downloaded; refusing to guess or start empty." >&2
              exit 1
            fi
            if python - "$candidate_dir" <<'PY'
          import pathlib
          import sqlite3
          import sys

          root = pathlib.Path(sys.argv[1])
          primary = root / "leads.sqlite3"
          if not primary.is_file() or primary.stat().st_size == 0:
              raise SystemExit("candidate has no non-empty leads.sqlite3")
          databases = [primary] + [
              path for path in sorted(root.rglob("*"))
              if path.is_file() and path != primary and path.suffix.lower() in {".sqlite", ".sqlite3", ".db"}
          ]
          for database in databases:
              if database.stat().st_size == 0:
                  raise SystemExit(f"candidate database is empty: {database}")
              with sqlite3.connect(f"file:{database.resolve()}?mode=ro", uri=True, timeout=30) as connection:
                  result = connection.execute("PRAGMA integrity_check").fetchone()
                  if not result or result[0] != "ok":
                      raise SystemExit(f"candidate database failed integrity_check: {database}: {result!r}")
                  if database == primary:
                      tables = {row[0] for row in connection.execute("SELECT name FROM sqlite_master WHERE type='table'")}
                      missing = sorted({"leads", "checkpoints"} - tables)
                      if missing:
                          raise SystemExit(f"candidate primary database is missing required tables: {missing}")
          PY
            then
              rm -rf "$candidate_dir"
              previous_run_id="$run_id"
              echo "ENGINE STATE CANDIDATE VERIFIED: run=$run_id artifact_id=$artifact_id."
              break
            else
              echo "ENGINE STATE CANDIDATE REJECTED: run=$run_id artifact_id=$artifact_id is not a complete valid SQLite state; checking the next older candidate." >&2
              rm -rf "$candidate_dir"
            fi
          done <<< "$production_runs"
          if [ -z "$previous_run_id" ] && [ -n "$prior_production_run_id" ]; then
            echo "ENGINE STATE RECOVERY BLOCKED: prior production runs exist, but no unexpired thorio-lead-engine-state artifact was found. Refusing to start from an empty database and risk losing leads, checkpoints, queues, or handoff state. Restore a verified backup before retrying." >&2
            exit 1
          fi
          if [ -z "$previous_run_id" ]; then
            echo "ENGINE STATE BOOTSTRAP: no completed prior production run exists; first-run initialization is permitted."
          fi
          echo "run_id=$previous_run_id" >> "$GITHUB_OUTPUT"
      - name: Download previous Lead Engine state
        if: steps.previous_state.outputs.run_id != ''
        uses: actions/download-artifact@v6
        with:
          name: thorio-lead-engine-state
          path: data
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.previous_state.outputs.run_id }}
      - name: Validate restored Lead Engine state integrity
        if: steps.turso_restore.outputs.restored == 'true' || steps.previous_state.outputs.run_id != ''
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          import sqlite3

          database = pathlib.Path("data/leads.sqlite3")
          if not database.is_file() or database.stat().st_size == 0:
              raise SystemExit(
                  "RESTORED ENGINE STATE INVALID: selected artifact does not contain a non-empty data/leads.sqlite3; "
                  "refusing to start from an empty database and discard prior state."
              )
          uri = f"file:{database.resolve()}?mode=ro"
          with sqlite3.connect(uri, uri=True, timeout=30) as connection:
              integrity = connection.execute("PRAGMA integrity_check").fetchone()
              if not integrity or integrity[0] != "ok":
                  raise SystemExit(f"RESTORED ENGINE STATE INVALID: SQLite integrity_check returned {integrity!r}")
              tables = {
                  row[0]
                  for row in connection.execute("SELECT name FROM sqlite_master WHERE type='table'")
              }
              required = {"leads", "checkpoints"}
              missing = sorted(required - tables)
              if missing:
                  raise SystemExit(f"RESTORED ENGINE STATE INVALID: missing required tables {missing}")
              lead_count = connection.execute("SELECT COUNT(*) FROM leads").fetchone()[0]
              checkpoint_count = connection.execute("SELECT COUNT(*) FROM checkpoints").fetchone()[0]
          validated_databases = [database]
          for candidate in sorted(pathlib.Path("data").rglob("*")):
              if not candidate.is_file() or candidate == database:
                  continue
              if candidate.suffix.lower() not in {".sqlite", ".sqlite3", ".db"}:
                  continue
              if candidate.stat().st_size == 0:
                  raise SystemExit(f"RESTORED ENGINE STATE INVALID: SQLite database is empty: {candidate}")
              candidate_uri = f"file:{candidate.resolve()}?mode=ro"
              try:
                  with sqlite3.connect(candidate_uri, uri=True, timeout=30) as connection:
                      integrity = connection.execute("PRAGMA integrity_check").fetchone()
              except sqlite3.DatabaseError as exc:
                  raise SystemExit(f"RESTORED ENGINE STATE INVALID: cannot open SQLite database {candidate}: {exc}") from exc
              if not integrity or integrity[0] != "ok":
                  raise SystemExit(f"RESTORED ENGINE STATE INVALID: SQLite integrity_check failed for {candidate}: {integrity!r}")
              validated_databases.append(candidate)
          print(
              "RESTORED ENGINE STATE VERIFIED: "
              f"SQLite integrity ok for {len(validated_databases)} database(s), "
              f"leads={lead_count}, checkpoints={checkpoint_count}."
          )
          PY
      - name: Ensure Lead Engine data directory exists
        run: mkdir -p data
      - name: Restore encrypted external browser authentication state
        env:
          GH_TOKEN: ${{ github.token }}
          THORIO_PREVIOUS_STATE_RUN_ID: ${{ steps.previous_state.outputs.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${THORIO_BROWSER_STATE_ENCRYPTION_KEY:-}" ]; then
            echo "EXTERNAL BROWSER STATE: encryption secret is not configured; external browser integration is disabled for this run."
            exit 0
          fi
          rm -f data/browser-state.json data/browser-state.enc
          previous_run_id="${THORIO_PREVIOUS_STATE_RUN_ID:-}"
          artifact_id=""
          if [ -n "$previous_run_id" ]; then
            artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${previous_run_id}/artifacts" --paginate --jq '.artifacts[] | select(.name == "thorio-browser-auth-state" and .expired == false) | .id' | head -n 1)"
            if [ -z "$artifact_id" ]; then
              echo "EXTERNAL BROWSER STATE: selected engine-state run has no usable browser-state artifact; checking a bounded recent history."
              previous_run_id=""
            fi
          fi
          if [ -z "$previous_run_id" ]; then
            checked_runs=0
            while IFS= read -r run_id; do
              [ -z "$run_id" ] && continue
              checked_runs=$((checked_runs + 1))
              artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" --paginate --jq '.artifacts[] | select(.name == "thorio-browser-auth-state" and .expired == false) | .id' | head -n 1)"
              if [ -n "$artifact_id" ]; then previous_run_id="$run_id"; break; fi
            done < <(gh run list --workflow python-app.yml --branch main --limit 50 --json databaseId,status,conclusion --jq '.[] | select(.status == "completed" and .conclusion == "success") | .databaseId')
            echo "EXTERNAL BROWSER STATE: bounded fallback checked ${checked_runs} successful runs."
          fi
          if [ -n "$previous_run_id" ]; then
            mkdir -p data/browser-state-restore
            gh run download "$previous_run_id" --repo "$GITHUB_REPOSITORY" --name thorio-browser-auth-state --dir data/browser-state-restore
            if [ -f data/browser-state-restore/browser-state.enc ]; then
              cp data/browser-state-restore/browser-state.enc data/browser-state.enc
              python infra/external-browser/browser-state.py decrypt data/browser-state.enc data/browser-state.json
              rm -rf data/browser-state-restore
              chmod 600 data/browser-state.json
              echo "EXTERNAL BROWSER STATE RESTORED: authenticated state recovered from the newest usable production run."
            else
              echo "EXTERNAL BROWSER STATE: previous artifact was found but did not contain browser-state.enc; starting without persisted state."
            fi
          else
            echo "EXTERNAL BROWSER STATE: no usable encrypted state artifact found in the bounded recent history; starting without persisted state."
          fi

      - name: Start external headless browser
        run: |
          set -euo pipefail
          if [ -z "${THORIO_BROWSER_STATE_ENCRYPTION_KEY:-}" ]; then
            echo "EXTERNAL BROWSER: encryption secret is not configured; leaving existing production runtime unchanged."
            exit 0
          fi
          python infra/external-browser/browser-worker.py > data/browser-worker.log 2>&1 &
          echo $! > data/browser-worker.pid
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9222/json/version >/dev/null 2>&1; then
              echo "EXTERNAL BROWSER READY: local CDP endpoint is accepting connections."
              exit 0
            fi
            if ! kill -0 "$(cat data/browser-worker.pid)" 2>/dev/null; then
              echo "EXTERNAL BROWSER FAILURE: browser worker exited before CDP became ready."
              cat data/browser-worker.log
              exit 1
            fi
            sleep 1
          done
          echo "EXTERNAL BROWSER FAILURE: CDP endpoint did not become ready within 60 seconds."
          cat data/browser-worker.log
          exit 1

      - name: Run Lead Engine for one bounded production cycle
        id: engine_run
        run: |
          set -o pipefail
          set +e
          timeout --signal=TERM --kill-after=30s 3600s python -u -m lead_engine run-scheduled --interval 60 --cycles 1 2>&1 | tee data/scheduled-run-output.txt
          engine_status=${PIPESTATUS[0]}
          set -e
          if [ -f data/browser-worker.pid ]; then
            browser_pid="$(cat data/browser-worker.pid)"
            if kill -0 "$browser_pid" 2>/dev/null; then
              kill -TERM "$browser_pid"
              wait "$browser_pid" || true
            fi
          fi
          if [ -n "${THORIO_BROWSER_STATE_ENCRYPTION_KEY:-}" ] && [ -f data/browser-state.json ]; then
            python infra/external-browser/browser-state.py encrypt data/browser-state.json data/browser-state.enc
            chmod 600 data/browser-state.enc
            echo "EXTERNAL BROWSER STATE SAVED: encrypted authentication state is ready for artifact persistence."
          fi
          rm -f data/browser-worker.pid
          exit "$engine_status"
      - name: Persist durable Turso engine state
        if: always() && steps.turso_restore.outputs.enabled == 'true' && steps.turso_restore.outcome == 'success' && steps.previous_state.outcome == 'success' && steps.engine_run.outcome != 'skipped'
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          python -m lead_engine.turso_state snapshot --data-dir data

      - name: Verify active collection and Airtable delivery
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import sys
          airtable_capacity_blocked = os.environ.get("AIRTABLE_SYNC_BLOCK_REASON", "").strip() == "record_capacity"
          path = pathlib.Path("data/scheduled-run-output.txt")
          if not path.exists():
              print("PRODUCTION COLLECTION FAILURE: scheduled run output was not created.")
              sys.exit(1)
          text = path.read_text(encoding="utf-8")
          decoder = json.JSONDecoder()
          results = []
          position = 0
          while position < len(text):
              start = text.find("{", position)
              if start == -1:
                  break
              try:
                  candidate, end = decoder.raw_decode(text[start:])
              except json.JSONDecodeError:
                  position = start + 1
                  continue
              if isinstance(candidate, dict):
                  results.append(candidate)
              position = start + end
          if not results:
              print("PRODUCTION COLLECTION FAILURE: no valid Lead Engine result was found.")
              print(text)
              sys.exit(1)
          discovered_total = sum(int(result.get("discovered_count", 0) or 0) for result in results)
          accepted_total = sum(int(result.get("accepted_count", 0) or 0) for result in results)
          source_counts = [int(result.get("source_count", 0) or 0) for result in results]
          successful_source_counts = [int(result.get("successful_source_count", 0) or 0) for result in results]
          source_failure_counts = [int(result.get("failed_count", 0) or 0) for result in results]
          source_skip_counts = [int(result.get("skipped_count", 0) or 0) for result in results]
          if discovered_total <= 0:
              print("PRODUCTION COLLECTION FAILURE: no leads were discovered during the production cycle.")
              sys.exit(1)
          if not source_counts or not successful_source_counts:
              print("PRODUCTION COLLECTION FAILURE: source collection metadata was missing from the production result.")
              sys.exit(1)
          if any(successful < source_count for successful, source_count in zip(successful_source_counts, source_counts)):
              print(f"PRODUCTION COLLECTION FAILURE: not every configured source completed successfully. source_counts={source_counts}, successful_source_counts={successful_source_counts}")
              sys.exit(1)
          if any(count > 0 for count in source_failure_counts):
              print(f"PRODUCTION COLLECTION FAILURE: one or more configured sources failed. failed_source_counts={source_failure_counts}")
              sys.exit(1)
          if any(count > 0 for count in source_skip_counts):
              print(f"PRODUCTION COLLECTION FAILURE: one or more configured sources were skipped. skipped_source_counts={source_skip_counts}")
              sys.exit(1)
          agents_evidence_found = False
          agent_drain_complete = []
          agent_remaining_queue = []
          for result in results:
              agents = result.get("agents")
              if not isinstance(agents, dict):
                  continue
              agents_evidence_found = True
              agent_drain_complete.append(bool(agents.get("drain_complete") is True))
              agent_remaining_queue.append(int(agents.get("remaining_queue_count", 0) or 0))
          if not agents_evidence_found:
              print("SPECIALIST DRAIN FAILURE: Lead Engine result did not contain specialist orchestration evidence.")
              sys.exit(1)
          queue_health = []
          specialist_failed_total = 0
          for result in results:
              agents = result.get("agents")
              if isinstance(agents, dict):
                  health = agents.get("queue_health")
                  if isinstance(health, dict):
                      queue_health.append(health)
                      specialist_failed_total += int(health.get("failed_count", 0) or 0)
          if specialist_failed_total > 0:
              print(f"SPECIALIST EXECUTION FAILURE: {specialist_failed_total} terminal specialist task(s) are failed and require retry or repair.")
              print(f"SPECIALIST QUEUE HEALTH: {queue_health}")
              sys.exit(1)
          if any(not complete for complete in agent_drain_complete):
              print(f"SPECIALIST DRAIN DEFERRED: bounded production execution left durable specialist work for the next cycle. drain_complete={agent_drain_complete}, remaining_queue_count={agent_remaining_queue}, queue_health={queue_health}")
          else:
              print(f"SPECIALIST DRAIN VERIFIED: drain_complete={agent_drain_complete}, remaining_queue_count={agent_remaining_queue}, queue_health={queue_health}")

          sync_failed = 0
          sync_completed = 0
          sync_already_exists = 0
          sync_deferred_research = 0
          failures = []
          sync_evidence_found = False
          for result in results:
              sync = result.get("sync")
              if not isinstance(sync, dict):
                  continue
              sync_evidence_found = True
              sync_failed += int(sync.get("failed_count", 0) or 0)
              sync_completed += int(sync.get("synced_count", 0) or 0)
              sync_already_exists += int(sync.get("already_exists_count", 0) or 0)
              sync_deferred_research += int(sync.get("deferred_research_count", 0) or 0)
              failed_items = sync.get("failed", [])
              if isinstance(failed_items, list):
                  failures.extend(item for item in failed_items if isinstance(item, dict))
          if not sync_evidence_found and not airtable_capacity_blocked:
              print("AIRTABLE DELIVERY FAILURE: Lead Engine result did not contain synchronization evidence.")
              sys.exit(1)
          inbound_failures = []
          inbound_health_evidence = False
          for result in results:
              health = result.get("revenue_inbound_health")
              if not isinstance(health, dict):
                  continue
              inbound_health_evidence = True
              if str(health.get("status") or "").strip().lower() == "failed" or int(health.get("failed_count", 0) or 0) > 0:
                  inbound_failures.extend(item for item in (health.get("failures") or []) if isinstance(item, dict))
          if inbound_health_evidence and inbound_failures:
              print(f"REVENUE INBOUND OBSERVATION FAILURE: {len(inbound_failures)} configured revenue conversation observation operation(s) failed; follow-ups were blocked.")
              for index, item in enumerate(inbound_failures[:20], 1):
                  print(f"INBOUND FAILURE {index}: opportunity_id={item.get('opportunity_id', '')} channel={item.get('channel', '')} error={item.get('error', '')}")
              sys.exit(1)

          if airtable_capacity_blocked:
              print(
                  f"PRODUCTION COLLECTION VERIFIED: discovered_total={discovered_total}, "
                  f"accepted_total={accepted_total}, successful_source_count={max(successful_source_counts)}"
              )
              print(
                  "AIRTABLE DELIVERY BLOCKED: the base record limit prevented synchronization. "
                  "Local SQLite state and the pending backlog will be persisted for recovery; "
                  "no records were deleted and this run will remain failed until sync capacity is restored."
              )
              sys.exit(1)

          if sync_failed > 0:
              print(f"AIRTABLE DELIVERY FAILURE: {sync_failed} lead synchronization operation(s) failed and remain undelivered.")
              for index, item in enumerate(failures[:20], 1):
                  lead = item.get("lead") if isinstance(item.get("lead"), dict) else {}
                  print(f"SYNC FAILURE {index}: fingerprint={lead.get('fingerprint', '')} company={lead.get('company', '')} route={lead.get('route', '')} error={item.get('error', '')}")
              sys.exit(1)
          if (sync_completed + sync_already_exists + sync_deferred_research) <= 0:
              print("AIRTABLE DELIVERY FAILURE: the production result contained no completed, already-existing, or explicitly deferred research delivery evidence.")
              sys.exit(1)
          print(f"PRODUCTION COLLECTION VERIFIED: discovered_total={discovered_total}, accepted_total={accepted_total}, successful_source_count={max(successful_source_counts)}")
          print(f"AIRTABLE DELIVERY VERIFIED: synced_count={sync_completed}, already_exists_count={sync_already_exists}, deferred_research_count={sync_deferred_research}, failed_count={sync_failed}")
          PY
      - name: Verify production revenue lifecycle and outreach
        run: python -m lead_engine.production_lifecycle_audit --database data/leads.sqlite3
      - name: Persist encrypted external browser authentication state
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: thorio-browser-auth-state
          path: data/browser-state.enc
          if-no-files-found: ignore
          retention-days: 90
          compression-level: 6
          overwrite: true
      - name: Validate Lead Engine state before artifact persistence
        id: persist_state_validation
        if: always() && steps.turso_restore.outcome == 'success' && steps.previous_state.outcome == 'success' && steps.engine_run.outcome != 'skipped'
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          import sqlite3

          root = pathlib.Path("data")
          primary = root / "leads.sqlite3"
          if not primary.is_file() or primary.stat().st_size == 0:
              raise SystemExit("STATE ARTIFACT BLOCKED: data/leads.sqlite3 is missing or empty; refusing to publish an unusable recovery artifact.")
          databases = [primary] + [
              path for path in sorted(root.rglob("*"))
              if path.is_file() and path != primary and path.suffix.lower() in {".sqlite", ".sqlite3", ".db"}
          ]
          for database in databases:
              if database.stat().st_size == 0:
                  raise SystemExit(f"STATE ARTIFACT BLOCKED: empty SQLite database: {database}")
              with sqlite3.connect(f"file:{database.resolve()}?mode=ro", uri=True, timeout=30) as connection:
                  integrity = connection.execute("PRAGMA integrity_check").fetchone()
                  if not integrity or integrity[0] != "ok":
                      raise SystemExit(f"STATE ARTIFACT BLOCKED: SQLite integrity check failed for {database}: {integrity!r}")
                  if database == primary:
                      tables = {row[0] for row in connection.execute("SELECT name FROM sqlite_master WHERE type='table'")}
                      missing = sorted({"leads", "checkpoints"} - tables)
                      if missing:
                          raise SystemExit(f"STATE ARTIFACT BLOCKED: primary database missing required tables: {missing}")
          print(f"STATE ARTIFACT SAFE TO PERSIST: validated {len(databases)} SQLite database(s).")
          PY
      - name: Persist Lead Engine state
        if: always() && steps.persist_state_validation.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: thorio-lead-engine-state
          path: data
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
          overwrite: false
