      THORIO_ACCOUNT_THREADS_USERNAME: ${{ secrets.THORIO_ACCOUNT_THREADS_USERNAME }}
      THORIO_ACCOUNT_THREADS_PASSWORD: ${{ secrets.THORIO_ACCOUNT_THREADS_PASSWORD }}
      THORIO_ACCOUNT_THREADS_LOGIN_URL: ${{ vars.THORIO_ACCOUNT_THREADS_LOGIN_URL || secrets.THORIO_ACCOUNT_THREADS_LOGIN_URL }}
      THORIO_ACCOUNT_THREADS_USERNAME_SELECTOR: ${{ vars.THORIO_ACCOUNT_THREADS_USERNAME_SELECTOR || secrets.THORIO_ACCOUNT_THREADS_USERNAME_SELECTOR }}
      THORIO_ACCOUNT_THREADS_PASSWORD_SELECTOR: ${{ vars.THORIO_ACCOUNT_THREADS_PASSWORD_SELECTOR || secrets.THORIO_ACCOUNT_THREADS_PASSWORD_SELECTOR }}
      THORIO_ACCOUNT_THREADS_SUBMIT_SELECTOR: ${{ vars.THORIO_ACCOUNT_THREADS_SUBMIT_SELECTOR || secrets.THORIO_ACCOUNT_THREADS_SUBMIT_SELECTOR }}
      THORIO_ACCOUNT_FACEBOOK_USERNAME: ${{ secrets.THORIO_ACCOUNT_FACEBOOK_USERNAME }}
      THORIO_ACCOUNT_FACEBOOK_PASSWORD: ${{ secrets.THORIO_ACCOUNT_FACEBOOK_PASSWORD }}
      THORIO_ACCOUNT_FACEBOOK_LOGIN_URL: ${{ vars.THORIO_ACCOUNT_FACEBOOK_LOGIN_URL || secrets.THORIO_ACCOUNT_FACEBOOK_LOGIN_URL }}
      THORIO_ACCOUNT_FACEBOOK_USERNAME_SELECTOR: ${{ vars.THORIO_ACCOUNT_FACEBOOK_USERNAME_SELECTOR || secrets.THORIO_ACCOUNT_FACEBOOK_USERNAME_SELECTOR }}
      THORIO_ACCOUNT_FACEBOOK_PASSWORD_SELECTOR: ${{ vars.THORIO_ACCOUNT_FACEBOOK_PASSWORD_SELECTOR || secrets.THORIO_ACCOUNT_FACEBOOK_PASSWORD_SELECTOR }}
      THORIO_ACCOUNT_FACEBOOK_SUBMIT_SELECTOR: ${{ vars.THORIO_ACCOUNT_FACEBOOK_SUBMIT_SELECTOR || secrets.THORIO_ACCOUNT_FACEBOOK_SUBMIT_SELECTOR }}
      THORIO_ACCOUNT_HACKER_NEWS_USERNAME: ${{ secrets.THORIO_ACCOUNT_HACKER_NEWS_USERNAME }}
      THORIO_ACCOUNT_HACKER_NEWS_PASSWORD: ${{ secrets.THORIO_ACCOUNT_HACKER_NEWS_PASSWORD }}
      THORIO_ACCOUNT_HACKER_NEWS_LOGIN_URL: ${{ vars.THORIO_ACCOUNT_HACKER_NEWS_LOGIN_URL || secrets.THORIO_ACCOUNT_HACKER_NEWS_LOGIN_URL }}
      THORIO_ACCOUNT_HACKER_NEWS_USERNAME_SELECTOR: ${{ vars.THORIO_ACCOUNT_HACKER_NEWS_USERNAME_SELECTOR || secrets.THORIO_ACCOUNT_HACKER_NEWS_USERNAME_SELECTOR }}
      THORIO_ACCOUNT_HACKER_NEWS_PASSWORD_SELECTOR: ${{ vars.THORIO_ACCOUNT_HACKER_NEWS_PASSWORD_SELECTOR || secrets.THORIO_ACCOUNT_HACKER_NEWS_PASSWORD_SELECTOR }}
      THORIO_ACCOUNT_HACKER_NEWS_SUBMIT_SELECTOR: ${{ vars.THORIO_ACCOUNT_HACKER_NEWS_SUBMIT_SELECTOR || secrets.THORIO_ACCOUNT_HACKER_NEWS_SUBMIT_SELECTOR }}
      THORIO_ACCOUNT_INDIE_HACKERS_USERNAME: ${{ secrets.THORIO_ACCOUNT_INDIE_HACKERS_USERNAME }}
      THORIO_ACCOUNT_INDIE_HACKERS_PASSWORD: ${{ secrets.THORIO_ACCOUNT_INDIE_HACKERS_PASSWORD }}
      THORIO_ACCOUNT_INDIE_HACKERS_LOGIN_URL: ${{ vars.THORIO_ACCOUNT_INDIE_HACKERS_LOGIN_URL || secrets.THORIO_ACCOUNT_INDIE_HACKERS_LOGIN_URL }}
      THORIO_ACCOUNT_INDIE_HACKERS_USERNAME_SELECTOR: ${{ vars.THORIO_ACCOUNT_INDIE_HACKERS_USERNAME_SELECTOR || secrets.THORIO_ACCOUNT_INDIE_HACKERS_USERNAME_SELECTOR }}
      THORIO_ACCOUNT_INDIE_HACKERS_PASSWORD_SELECTOR: ${{ vars.THORIO_ACCOUNT_INDIE_HACKERS_PASSWORD_SELECTOR || secrets.THORIO_ACCOUNT_INDIE_HACKERS_PASSWORD_SELECTOR }}
      THORIO_ACCOUNT_INDIE_HACKERS_SUBMIT_SELECTOR: ${{ vars.THORIO_ACCOUNT_INDIE_HACKERS_SUBMIT_SELECTOR || secrets.THORIO_ACCOUNT_INDIE_HACKERS_SUBMIT_SELECTOR }}
      THORIO_ACCOUNT_GMAIL_USERNAME: ${{ secrets.THORIO_ACCOUNT_GMAIL_USERNAME }}
      THORIO_ACCOUNT_GMAIL_PASSWORD: ${{ secrets.THORIO_ACCOUNT_GMAIL_PASSWORD }}
      THORIO_GMAIL_OAUTH_CLIENT_ID: ${{ secrets.THORIO_GMAIL_OAUTH_CLIENT_ID }}
      THORIO_BREVO_SMTP_LOGIN: ${{ secrets.BREVO_SMTP_LOGIN || secrets.THORIO_BREVO_SMTP_LOGIN }}
      THORIO_BREVO_SMTP_KEY: ${{ secrets.BREVO_SMTP_KEY || secrets.THORIO_BREVO_SMTP_KEY }}
      THORIO_BREVO_API_KEY: ${{ secrets.BREVO_API_KEY || secrets.THORIO_BREVO_API_KEY }}
      THORIO_BREVO_SENDER_EMAIL: ${{ vars.THORIO_BREVO_SENDER_EMAIL || secrets.THORIO_BREVO_SENDER_EMAIL }}
      THORIO_BREVO_SENDER_NAME: ${{ vars.THORIO_BREVO_SENDER_NAME || secrets.THORIO_BREVO_SENDER_NAME }}
      THORIO_BREVO_REPLY_TO_EMAIL: ${{ vars.THORIO_BREVO_REPLY_TO_EMAIL || secrets.THORIO_BREVO_REPLY_TO_EMAIL }}
      THORIO_BREVO_SENDER_VERIFIED: ${{ vars.THORIO_BREVO_SENDER_VERIFIED || secrets.THORIO_BREVO_SENDER_VERIFIED }}
      THORIO_BREVO_DOMAIN_AUTHENTICATED: ${{ vars.THORIO_BREVO_DOMAIN_AUTHENTICATED || secrets.THORIO_BREVO_DOMAIN_AUTHENTICATED }}
      THORIO_GMAIL_OAUTH_CLIENT_SECRET: ${{ secrets.THORIO_GMAIL_OAUTH_CLIENT_SECRET }}
      THORIO_GMAIL_OAUTH_REFRESH_TOKEN: ${{ secrets.THORIO_GMAIL_OAUTH_REFRESH_TOKEN }}
      THORIO_REVENUE_TRANSPORT_MODE: ${{ vars.THORIO_REVENUE_TRANSPORT_MODE || secrets.THORIO_REVENUE_TRANSPORT_MODE }}
      THORIO_REVENUE_TRANSPORT_URL: ${{ vars.THORIO_REVENUE_TRANSPORT_URL || secrets.THORIO_REVENUE_TRANSPORT_URL }}
      THORIO_REVENUE_TRANSPORT_TOKEN: ${{ secrets.THORIO_REVENUE_TRANSPORT_TOKEN }}
      THORIO_REVENUE_BROWSER_TARGETS: ${{ vars.THORIO_REVENUE_BROWSER_TARGETS || secrets.THORIO_REVENUE_BROWSER_TARGETS }}
      THORIO_REVENUE_BROWSER_INBOUND_TARGETS: ${{ vars.THORIO_REVENUE_BROWSER_INBOUND_TARGETS || secrets.THORIO_REVENUE_BROWSER_INBOUND_TARGETS }}
      THORIO_BROWSER_PROFILE_DIR: ${{ vars.THORIO_BROWSER_PROFILE_DIR || secrets.THORIO_BROWSER_PROFILE_DIR }}
      THORIO_BROWSER_HEADLESS: ${{ vars.THORIO_BROWSER_HEADLESS || secrets.THORIO_BROWSER_HEADLESS }}
      THORIO_BROWSER_NAVIGATION_TIMEOUT: ${{ vars.THORIO_BROWSER_NAVIGATION_TIMEOUT || secrets.THORIO_BROWSER_NAVIGATION_TIMEOUT }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Restore encrypted GitHub Actions state cache
        id: github_state_cache
        uses: actions/cache/restore@v4
        with:
          path: .thorio-state-cache/state.enc
          key: thorio-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            thorio-state-v1-
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Validate free encrypted state storage configuration
        env:
          THORIO_STATE_ENCRYPTION_KEY: ${{ secrets.THORIO_STATE_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${THORIO_STATE_ENCRYPTION_KEY:-}" ]; then
            echo "STATE CONFIGURATION BLOCKED: add the GitHub Actions secret THORIO_STATE_ENCRYPTION_KEY. This encrypts the saved database; no paid storage provider is used." >&2
            exit 1
          fi
          echo "STATE CONFIGURATION VERIFIED: encrypted GitHub Actions cache selected; no external storage service or billing account is required."
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install playwright cryptography
          python -m playwright install --with-deps chromium
      - name: Report outbound revenue transport readiness
        id: revenue_transport_readiness
        run: |
          python - <<'PY'
          import json
          import os
          import smtplib
          import ssl
          import requests
          from lead_engine.gmail_oauth import gmail_oauth_configured, refresh_gmail_access_token, xoauth2_payload

          mode = os.environ.get("THORIO_REVENUE_TRANSPORT_MODE", "").strip().lower()
          url_configured = bool(os.environ.get("THORIO_REVENUE_TRANSPORT_URL", "").strip())
          token_configured = bool(os.environ.get("THORIO_REVENUE_TRANSPORT_TOKEN", "").strip())
          raw_targets = os.environ.get("THORIO_REVENUE_BROWSER_TARGETS", "").strip()
          targets = []
          target_error = False
          if raw_targets:
              try:
                  value = json.loads(raw_targets)
                  if isinstance(value, list):
                      targets = [item for item in value if isinstance(item, dict)]
                  else:
                      target_error = True
              except json.JSONDecodeError:
                  target_error = True

          http_ready = url_configured and token_configured
          browser_state_key_configured = bool(os.environ.get("THORIO_BROWSER_STATE_ENCRYPTION_KEY", "").strip())
          gmail_username = os.environ.get("THORIO_ACCOUNT_GMAIL_USERNAME", "").strip().lower()
          # Google displays app passwords in groups; normalize pasted whitespace.
          gmail_password = "".join(os.environ.get("THORIO_ACCOUNT_GMAIL_PASSWORD", "").split())
          oauth_values = (
              os.environ.get("THORIO_GMAIL_OAUTH_CLIENT_ID", "").strip(),
              os.environ.get("THORIO_GMAIL_OAUTH_CLIENT_SECRET", "").strip(),
              os.environ.get("THORIO_GMAIL_OAUTH_REFRESH_TOKEN", "").strip(),
          )
          oauth_partial = any(oauth_values) and not all(oauth_values)
          oauth_configured = gmail_oauth_configured()
          gmail_credentials_ready = (
              gmail_username == "thorio.partners@gmail.com"
              and not oauth_partial
              and (oauth_configured or bool(gmail_password))
          )
          browser_ready = bool(targets) and not target_error and browser_state_key_configured
          gmail_ready = False
          brevo_login = os.environ.get("THORIO_BREVO_SMTP_LOGIN", "").strip()
          brevo_key = os.environ.get("THORIO_BREVO_SMTP_KEY", "").strip()
          brevo_api_key = os.environ.get("THORIO_BREVO_API_KEY", "").strip()
          brevo_sender = os.environ.get("THORIO_BREVO_SENDER_EMAIL", "").strip()
          brevo_reply_to = os.environ.get("THORIO_BREVO_REPLY_TO_EMAIL", "").strip() or brevo_sender
          brevo_sender_verified = os.environ.get("THORIO_BREVO_SENDER_VERIFIED", "").strip().lower() in {"1", "true", "yes", "on"}
          brevo_domain_authenticated = os.environ.get("THORIO_BREVO_DOMAIN_AUTHENTICATED", "").strip().lower() in {"1", "true", "yes", "on"}
          brevo_credentials_configured = bool(brevo_login and brevo_key)
          brevo_api_selected = mode == "brevo_api" or (
              mode in {"", "auto"} and bool(brevo_api_key)
          )
          brevo_selected = mode == "brevo_smtp" or (
              mode in {"", "auto"} and brevo_credentials_configured and not brevo_api_key
          )
          gmail_selected = mode == "gmail_smtp" or (
              mode in {"", "auto"}
              and not http_ready
              and not browser_ready
              and not brevo_credentials_configured
              and not brevo_api_key
          )
          brevo_ready = False
          brevo_auth_verified = False
          brevo_api_auth_verified = False
          brevo_api_failures = []
          brevo_method = ""
          brevo_failures = []
          def safe_provider_detail(exc):
              detail = " ".join(str(exc).split())
              for secret in (
                  gmail_username, gmail_password,
                  os.environ.get("THORIO_GMAIL_OAUTH_CLIENT_SECRET", ""),
                  os.environ.get("THORIO_GMAIL_OAUTH_REFRESH_TOKEN", ""),
              ):
                  if secret:
                      detail = detail.replace(secret, "[REDACTED]")
              return detail[:240] if detail else "provider returned no detail"

          smtp_failures = []
          smtp_method = ""
          if gmail_selected and gmail_credentials_ready:
              access_token = ""
              if oauth_configured:
                  try:
                      stage = "oauth_refresh"
                      access_token = refresh_gmail_access_token(timeout_seconds=15)
                  except Exception as exc:
                      smtp_failures.append(f"oauth_refresh:{type(exc).__name__}:{safe_provider_detail(exc)}")
              for method, port in ((("starttls", 587), ("ssl", 465)) if not oauth_configured or access_token else ()):
                  client = None
                  stage = f"{method}_connect"
                  try:
                      if method == "starttls":
                          client = smtplib.SMTP("smtp.gmail.com", port, timeout=15)
                          client.ehlo()
                          client.starttls(context=ssl.create_default_context())
                          client.ehlo()
                      else:
                          client = smtplib.SMTP_SSL(
                              "smtp.gmail.com", port, timeout=15,
                              context=ssl.create_default_context(),
                          )
                      stage = f"{method}_oauth_auth" if oauth_configured else f"{method}_login"
                      if oauth_configured:
                          client.auth(
                              "XOAUTH2",
                              lambda challenge: xoauth2_payload(gmail_username, access_token),
                          )
                      else:
                          client.login(gmail_username, gmail_password)
                      gmail_ready = True
                      smtp_method = f"{method}:{port}"
                      break
                  except smtplib.SMTPAuthenticationError as exc:
                      smtp_failures.append(f"{stage}:{type(exc).__name__}:{safe_provider_detail(exc)}")
                      break
                  except Exception as exc:
                      smtp_failures.append(f"{stage}:{type(exc).__name__}:{safe_provider_detail(exc)}")
                  finally:
                      if client is not None:
                          try:
                              client.quit()
                          except Exception:
                              pass
          if gmail_selected:
              print(
                  f"GMAIL SMTP LIVE AUTH {'VERIFIED' if gmail_ready else 'FAILED'} "
                  f"method={smtp_method or 'none'} "
                  f"failure_stages={'; '.join(smtp_failures) or 'none'}; no email was sent."
              )

          if brevo_selected and brevo_login and brevo_key:
              for method, port in (("starttls", 587), ("ssl", 465)):
                  client = None
                  stage = f"{method}_connect"
                  try:
                      if method == "starttls":
                          client = smtplib.SMTP("smtp-relay.brevo.com", port, timeout=15)
                          client.ehlo()
                          client.starttls(context=ssl.create_default_context())
                          client.ehlo()
                      else:
                          client = smtplib.SMTP_SSL(
                              "smtp-relay.brevo.com", port, timeout=15,
                              context=ssl.create_default_context(),
                          )
                      stage = f"{method}_login"
                      client.login(brevo_login, brevo_key)
                      brevo_auth_verified = True
                      brevo_method = f"{method}:{port}"
                      break
                  except smtplib.SMTPAuthenticationError as exc:
                      detail = " ".join(str(exc).split())
                      for secret in (brevo_login, brevo_key):
                          if secret:
                              detail = detail.replace(secret, "[REDACTED]")
                      brevo_failures.append(f"{stage}:{type(exc).__name__}:{detail[:180]}")
                      break
                  except Exception as exc:
                      detail = " ".join(str(exc).split())
                      for secret in (brevo_login, brevo_key):
                          if secret:
                              detail = detail.replace(secret, "[REDACTED]")
                      brevo_failures.append(f"{stage}:{type(exc).__name__}:{detail[:180]}")
                  finally:
                      if client is not None:
                          try:
                              client.quit()
                          except Exception:
                              pass
          if brevo_api_selected and brevo_api_key:
              try:
                  response = requests.get(
                      "https://api.brevo.com/v3/account",
                      headers={"api-key": brevo_api_key, "accept": "application/json"},
                      timeout=15,
                  )
                  if response.status_code in {401, 403}:
                      brevo_api_failures.append(f"api_account:HTTP_{response.status_code}:authorization_rejected")
                  else:
                      response.raise_for_status()
                      account = response.json()
                      if not isinstance(account, dict) or not account.get("email"):
                          brevo_api_failures.append("api_account:unexpected_response")
                      else:
                          brevo_api_auth_verified = True
              except Exception as exc:
                  detail = " ".join(str(exc).split())
                  detail = detail.replace(brevo_api_key, "[REDACTED]")
                  brevo_api_failures.append(f"api_account:{type(exc).__name__}:{detail[:180]}")
          if brevo_api_selected:
              print(
                  f"BREVO API LIVE AUTH {'VERIFIED' if brevo_api_auth_verified else 'FAILED'} "
                  f"api_key_configured={str(bool(brevo_api_key)).lower()} "
                  f"sender_configured={str(bool(brevo_sender)).lower()} "
                  f"sender_verification_confirmed={str(brevo_sender_verified).lower()} "
                  f"domain_authentication_confirmed={str(brevo_domain_authenticated).lower()} "
                  f"failure_stages={'; '.join(brevo_api_failures) or 'none'}; no email was sent."
              )

          brevo_ready = (
              (brevo_auth_verified or brevo_api_auth_verified)
              and bool(brevo_sender)
              and brevo_sender_verified
              and brevo_domain_authenticated
          )
          if brevo_selected or mode == "brevo_smtp":
              print(
                  f"BREVO SMTP AUTH {'VERIFIED' if brevo_auth_verified else 'FAILED'} "
                  f"method={brevo_method or 'none'} "
                  f"login_configured={str(bool(brevo_login)).lower()} "
                  f"smtp_key_configured={str(bool(brevo_key)).lower()} "
                  f"sender_configured={str(bool(brevo_sender)).lower()} "
                  f"sender_verification_confirmed={str(brevo_sender_verified).lower()} "
                  f"domain_authentication_confirmed={str(brevo_domain_authenticated).lower()} "
                  f"production_transport_ready={str(brevo_ready).lower()} "
                  f"failure_stages={'; '.join(brevo_failures) or 'none'}; no email was sent."
              )

          if mode == "http":
              ready = http_ready
          elif mode == "browser":
              ready = browser_ready
          elif mode == "gmail_smtp":
              ready = gmail_ready
          elif mode in {"brevo_smtp", "brevo_api"}:
              ready = brevo_ready
          elif mode in {"", "auto"}:
              ready = http_ready or browser_ready or brevo_ready or gmail_ready
          else:
              ready = False

          print(
              "OUTBOUND REVENUE TRANSPORT READINESS: "
              f"configured={str(ready).lower()} mode={mode or 'auto'} "
              f"http_url_configured={str(url_configured).lower()} "
              f"http_token_configured={str(token_configured).lower()} "
              f"browser_target_count={len(targets)} "
              f"browser_target_config_invalid={str(target_error).lower()} "
              f"browser_state_key_configured={str(browser_state_key_configured).lower()} "
              f"gmail_sender_configured={str(gmail_username == 'thorio.partners@gmail.com').lower()} "
              f"gmail_password_configured={str(bool(gmail_password)).lower()} "
              f"brevo_selected={str(brevo_selected).lower()} "
              f"brevo_login_configured={str(bool(brevo_login)).lower()} "
              f"brevo_smtp_key_configured={str(bool(brevo_key)).lower()} "
              f"brevo_api_selected={str(brevo_api_selected).lower()} "
              f"brevo_api_key_configured={str(bool(brevo_api_key)).lower()} "
              f"brevo_api_auth_verified={str(brevo_api_auth_verified).lower()} "
              f"brevo_sender_configured={str(bool(brevo_sender)).lower()} "
              f"brevo_sender_verified={str(brevo_sender_verified).lower()} "
              f"brevo_domain_authenticated={str(brevo_domain_authenticated).lower()}"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"ready={str(ready).lower()}\n")
          if not ready:
              print(
                  "OUTBOUND REVENUE BLOCKER: no live-authorized explicitly configured transport "
                  "is available to the production runtime; collection can continue, "
                  "but external outreach is not ready."
              )
          PY

      - name: Report public discovery source readiness
        id: public_discovery_readiness
        run: |
          python - <<'PY'
          import os
          from lead_engine.browser_discovery import configured_browser_discovery_sources
          from lead_engine.discovery_collectors import load_authorized_discovery_configs
          from lead_engine.free_sources import HIGH_VALUE_COMMERCIAL_SIGNAL_TERMS
          from lead_engine.source_registry import _free_sources_enabled, _load_free_source_catalog, configured_sources

          api_configs = load_authorized_discovery_configs(required=False)
          browser_sources = configured_browser_discovery_sources()
          browser_state_key_configured = bool(os.environ.get("THORIO_BROWSER_STATE_ENCRYPTION_KEY", "").strip())
          api_lanes = sorted({item.lane for item in api_configs})
          browser_lanes = sorted({item.lane for item in browser_sources})

          # The production engine already derives commercial-intent signals from
          # observed records in its configured free-source catalog. Count that
          # real, existing path rather than incorrectly requiring a separate API
          # endpoint or authenticated browser for every production deployment.
          free_catalog = _load_free_source_catalog()
          runtime_sources = configured_sources() if _free_sources_enabled() else []
          allowed_catalog_names = {
              item.name for item in free_catalog if item.allowed_for_thorio
          }
          runtime_source_names = {item.name for item in runtime_sources}
          wired_signal_source_count = len(allowed_catalog_names & runtime_source_names)
          free_signal_ready = (
              _free_sources_enabled()
              and len(allowed_catalog_names) >= 40
              and wired_signal_source_count >= 40
              and bool(HIGH_VALUE_COMMERCIAL_SIGNAL_TERMS)
          )
          ready = (
              bool(api_configs)
              or (bool(browser_sources) and browser_state_key_configured)
              or free_signal_ready
          )
          print(
              "PUBLIC DISCOVERY READINESS: "
              f"api_lane_count={len(api_lanes)} api_lanes={api_lanes} "
              f"browser_target_count={len(browser_sources)} browser_lanes={browser_lanes} "
              f"browser_state_key_configured={str(browser_state_key_configured).lower()} "
              f"free_signal_source_count={wired_signal_source_count} "
              f"free_signal_ready={str(free_signal_ready).lower()} "
              f"commercial_signal_term_count={len(HIGH_VALUE_COMMERCIAL_SIGNAL_TERMS)}"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"ready={str(ready).lower()}\n")
          if not api_configs and not browser_sources and not free_signal_ready:
              print(
                  "PUBLIC DISCOVERY BLOCKER: no configured API, authenticated-browser, "
                  "or complete free-source commercial-signal path is available."
              )
          elif browser_sources and not browser_state_key_configured and not api_configs and not free_signal_ready:
              print("PUBLIC DISCOVERY BLOCKER: authenticated-browser discovery is configured, but THORIO_BROWSER_STATE_ENCRYPTION_KEY is missing; the browser worker cannot be started safely.")
          elif free_signal_ready and not api_configs and not browser_sources:
              print(
                  "PUBLIC DISCOVERY SIGNAL PATH VERIFIED: the existing free-source catalog "
                  f"has {wired_signal_source_count} wired sources and the commercial-intent "
                  "extractor is available. The four downstream revenue routes remain separate."
              )
          PY


      - name: Report inbound revenue observation readiness
        id: revenue_inbound_readiness
        run: |
          python - <<'PY'
          import imaplib
          import os
          import ssl
          from lead_engine.browser_revenue_inbound import configured_browser_revenue_inbound_targets
          from lead_engine.gmail_imap_inbound import gmail_imap_configured
          from lead_engine.gmail_oauth import gmail_oauth_configured, refresh_gmail_access_token, xoauth2_payload

          mode = os.environ.get("THORIO_REVENUE_TRANSPORT_MODE", "").strip().lower()
          http_url = bool(os.environ.get("THORIO_REVENUE_TRANSPORT_URL", "").strip())
          http_token = bool(os.environ.get("THORIO_REVENUE_TRANSPORT_TOKEN", "").strip())
          browser_outbound_configured = bool(os.environ.get("THORIO_REVENUE_BROWSER_TARGETS", "").strip())
          browser_state_key = bool(os.environ.get("THORIO_BROWSER_STATE_ENCRYPTION_KEY", "").strip())
          try:
              browser_targets = configured_browser_revenue_inbound_targets()
              browser_config_valid = True
          except Exception as exc:
              browser_targets = {}
              browser_config_valid = False
              print(f"INBOUND BROWSER CONFIGURATION INVALID: {type(exc).__name__}")
          gmail_transport_selected = (
              mode == "gmail_smtp"
              or (
                  mode in {"", "auto"}
                  and not http_url
                  and not http_token
                  and not browser_outbound_configured
              )
          )
          gmail_ready = False
          if gmail_transport_selected and gmail_imap_configured():
              username = os.environ.get("THORIO_ACCOUNT_GMAIL_USERNAME", "").strip()
              # Prefer OAuth XOAUTH2 when a complete OAuth credential set is configured.
              password = "".join(os.environ.get("THORIO_ACCOUNT_GMAIL_PASSWORD", "").split())
              oauth_configured = gmail_oauth_configured()
              imap_client = None
              stage = "imap_connect"
              try:
                  imap_client = imaplib.IMAP4_SSL(
                      "imap.gmail.com", 993,
                      ssl_context=ssl.create_default_context(), timeout=20,
                  )
                  if oauth_configured:
                      stage = "imap_oauth_refresh"
                      access_token = refresh_gmail_access_token(timeout_seconds=20)
                      stage = "imap_oauth_auth"
                      login_status, _ = imap_client.authenticate(
                          "XOAUTH2",
                          lambda challenge: xoauth2_payload(username, access_token),
                      )
                  else:
                      stage = "imap_login"
                      login_status, _ = imap_client.login(username, password)
                  if login_status != "OK":
                      raise RuntimeError("Gmail IMAP login was not accepted")
                  stage = "imap_select"
                  select_status, _ = imap_client.select("INBOX", readonly=True)
                  if select_status != "OK":
                      raise RuntimeError("Gmail IMAP inbox could not be selected")
                  gmail_ready = True
                  print("GMAIL IMAP LIVE AUTH VERIFIED; no email was sent.")
              except Exception as exc:
                  detail = " ".join(str(exc).split())
                  for secret in (
                      username, password,
                      os.environ.get("THORIO_GMAIL_OAUTH_CLIENT_SECRET", ""),
                      os.environ.get("THORIO_GMAIL_OAUTH_REFRESH_TOKEN", ""),
                  ):
                      if secret:
                          detail = detail.replace(secret, "[REDACTED]")
                  detail = detail[:240] if detail else "provider returned no detail"
                  print(f"GMAIL IMAP LIVE AUTH FAILED at {stage}: {type(exc).__name__}: {detail}; no email was sent.")
                  gmail_ready = False
              finally:
                  if imap_client is not None:
                      try:
                          imap_client.logout()
                      except Exception:
                          pass
          browser_ready = bool(browser_targets) and browser_config_valid and browser_state_key and (
              mode in {"browser", "http"}
              or (mode in {"", "auto"} and browser_outbound_configured)
          )
          ready = gmail_ready or browser_ready
          print(
              "INBOUND REVENUE OBSERVATION READINESS: "
              f"configured={str(ready).lower()} "
              f"gmail_imap_ready={str(gmail_ready).lower()} "
              f"browser_target_count={len(browser_targets)} "
              f"browser_state_key_configured={str(browser_state_key).lower()}"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"ready={str(ready).lower()}\n")
          if not ready:
              print(
                  "INBOUND REVENUE BLOCKER: no live-authenticated inbox observer matches "
                  "the selected outbound transport. Scheduled follow-ups remain fail-closed "
                  "until real inbox observation is configured."
              )
          PY

      - name: Select and verify Airtable production credential
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          base_id = os.environ["AIRTABLE_BASE_ID"]
          table = urllib.parse.quote(os.environ.get("AIRTABLE_LEAD_TABLE", "Lead Radar"), safe="")
          url = f"https://api.airtable.com/v0/{base_id}/{table}"
          # Thorio uses one Airtable credential: the configured Personal Access Token.
          # AIRTABLE_API_KEY is only the application's legacy environment-variable name
          # for the bearer token; no separate Airtable API key is supported or required.
          candidates = [
              ("AIRTABLE_PAT", os.environ.get("AIRTABLE_PAT_CANDIDATE", "").strip()),
          ]
          probe_id = f"__THORIO_CREDENTIAL_PROBE__{int(time.time())}"
          probe_fields = {"Lead": probe_id, "Applicable Routes": ["Thorio"]}
          selected = None
          capacity_blocked = False
          capacity_credential = None

          for label, token in candidates:
              if not token:
                  print(f"{label}: not configured; skipping")
                  continue
              request = urllib.request.Request(
                  url,
                  data=json.dumps({"records": [{"fields": probe_fields}]}).encode("utf-8"),
                  headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"},
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      status = response.status
                      body = response.read().decode("utf-8", errors="replace")
              except urllib.error.HTTPError as exc:
                  status = exc.code
                  body = exc.read().decode("utf-8", errors="replace")
              except Exception as exc:
                  print(f"{label}: write probe failed before HTTP response: {exc}")
                  continue
              if status not in (200, 201):
                  diagnostic = " ".join(str(body).replace(token, "[REDACTED]").split())[:1200]
                  if status == 422 and "TOO_MANY_RECORDS_IN_BASE" in body:
                      capacity_blocked = True
                      capacity_credential = (label, token)
                      print(
                          f"{label}: Airtable accepted the request but rejected the write because "
                          "the base record limit has been reached (HTTP 422 TOO_MANY_RECORDS_IN_BASE)."
                      )
                      # Capacity is a base-level constraint; another token cannot fix it.
                      break
                  elif status in (401, 403):
                      print(f"{label}: Airtable authentication/authorization failed with HTTP {status}: {diagnostic or 'no response body'}")
                  else:
                      print(f"{label}: Airtable write probe failed with HTTP {status}: {diagnostic or 'no response body'}")
                  continue
              try:
                  payload = json.loads(body)
              except json.JSONDecodeError:
                  payload = {}
              records = payload.get("records", []) if isinstance(payload, dict) else []
              record_id = records[0].get("id") if records else None
              if not record_id:
                  print(f"{label}: write probe returned success without a record ID.")
                  continue
              selected = (label, token, record_id)
              print(f"{label}: Thorio multiple-select write probe succeeded.")
              break

          if selected is None:
              if capacity_blocked:
                  with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
                      # Keep synchronization enabled: new records and table-level upserts are blocked
                      # in airtable_sync, while PATCH updates to known existing record IDs can proceed.
                      env_file.write("AIRTABLE_SYNC_BLOCK_REASON=record_capacity\n")
                      if capacity_credential:
                          capacity_label, capacity_token = capacity_credential
                          env_file.write(f"AIRTABLE_API_KEY={capacity_token}\n")
                          env_file.write(f"AIRTABLE_CREDENTIAL_SOURCE={capacity_label}\n")
                  print(
                      "AIRTABLE CAPACITY LIMIT: new records and table-level upserts remain queued, "
                      "while updates to known existing records may continue. Local SQLite state and "
                      "the research backlog are preserved; no records are deleted."
                  )
                  raise SystemExit(0)
              raise SystemExit(
                  "AIRTABLE PAT WRITE FAILURE: the configured AIRTABLE_PAT could not complete "
                  "the real Thorio route write probe. Review the PAT HTTP diagnostic above."
              )

          label, token, record_id = selected
          delete_url = f"{url}/{urllib.parse.quote(record_id, safe='')}"
          delete_request = urllib.request.Request(delete_url, headers={"Authorization": f"Bearer {token}"}, method="DELETE")
          try:
              with urllib.request.urlopen(delete_request, timeout=30) as response:
                  if response.status not in (200, 202):
                      raise SystemExit(f"AIRTABLE CREDENTIAL FAILURE: selected credential probe cleanup returned HTTP {response.status}.")
          except urllib.error.HTTPError as exc:
              raise SystemExit(f"AIRTABLE CREDENTIAL FAILURE: selected credential probe cleanup returned HTTP {exc.code}.")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"AIRTABLE_API_KEY={token}\n")
              env_file.write(f"AIRTABLE_CREDENTIAL_SOURCE={label}\n")
          print(f"AIRTABLE CREDENTIAL VERIFIED: {label} selected by a real Thorio route write and cleanup probe.")
          PY
      - name: Verify selected Airtable credential is available to production runtime
        run: |
          python - <<'PY'
          import os
          token = os.environ.get("AIRTABLE_API_KEY", "").strip()
          source = os.environ.get("AIRTABLE_CREDENTIAL_SOURCE", "").strip()
          if not token or not source:
              if os.environ.get("AIRTABLE_SYNC_BLOCK_REASON", "").strip() == "record_capacity":
                  print(
                      "AIRTABLE RUNTIME SYNC DISABLED: confirmed base-capacity blocker; "
                      "local collection remains enabled and durable."
                  )
                  raise SystemExit(0)
              raise SystemExit("AIRTABLE RUNTIME CREDENTIAL FAILURE: selected credential was not propagated to the production runtime.")
          if os.environ.get("AIRTABLE_READ_ONLY_MODE", "").strip().lower() == "true":
              print(f"AIRTABLE RUNTIME CREDENTIAL VERIFIED FOR READS ONLY: selected source={source}; writes remain blocked.")
          else:
              print(f"AIRTABLE RUNTIME CREDENTIAL VERIFIED: selected source={source}; secret value is not exposed.")
          PY
      - name: Audit account credential names without reading secret values
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from lead_engine.account_auth import SUPPORTED_ACCOUNTS, auth_status

          def api_names(endpoint, collection_key):
              try:
                  result = subprocess.run(
                      ["gh", "api", endpoint, "--paginate", "--jq", f".{collection_key}[].name"],
                      capture_output=True, text=True, timeout=20,
                  )
              except (OSError, subprocess.TimeoutExpired):
                  return None
              if result.returncode != 0:
                  return None
              return {line.strip() for line in result.stdout.splitlines() if line.strip()}

          repo_prefix = f"repos/{os.environ['GITHUB_REPOSITORY']}"
          secrets = api_names(f"{repo_prefix}/actions/secrets", "secrets")
          variables = api_names(f"{repo_prefix}/actions/variables", "variables")
          environment_names = api_names(f"{repo_prefix}/environments", "environments")
          environment_scopes = {}
          for environment_name in sorted(environment_names or ()):
              safe_name = __import__("urllib.parse", fromlist=["quote"]).quote(environment_name, safe="")
              env_secrets = api_names(f"{repo_prefix}/environments/{safe_name}/secrets", "secrets")
              env_variables = api_names(f"{repo_prefix}/environments/{safe_name}/variables", "variables")
              environment_scopes[environment_name] = (env_secrets, env_variables)

          status = auth_status()
          print("ACCOUNT CREDENTIAL NAME AUDIT (names and presence only; no values are read):")
          for account in SUPPORTED_ACCOUNTS:
              prefix = "THORIO_ACCOUNT_" + account.upper()
              expected = {prefix + "_USERNAME", prefix + "_PASSWORD", prefix + "_STORAGE_STATE_B64"}
              matching = []
              sources = [("repository_secret", secrets), ("repository_variable", variables)]
              sources.extend(
                  (f"environment_secret:{env_name}", pair[0])
                  for env_name, pair in environment_scopes.items()
              )
              sources.extend(
                  (f"environment_variable:{env_name}", pair[1])
                  for env_name, pair in environment_scopes.items()
              )
              for scope, names in sources:
                  if names is None:
                      continue
                  for name in names:
                      normalized = "".join(character.lower() for character in name if character.isalnum())
                      aliases = {
                          "product_hunt": ("producthunt",),
                          "web_job": ("webjob", "webjobs"),
                      }.get(account, (account.replace("_", ""),))
                      if any(alias in normalized for alias in aliases) and ("thorio" in normalized or normalized.startswith(account.replace("_", ""))):
                          matching.append(f"{scope}:{name}")
              item = status[account]
              print(
                  f"{account}: runtime_configured={item['configured']} "
                  f"username_present={item['username_configured']} "
                  f"password_present={item['password_configured']} "
                  f"storage_state_present={item['storage_state_configured']} "
                  f"expected_repository_secret_names_present={sorted(expected.intersection(secrets or set())) if secrets is not None else 'unavailable'} "
                  f"matching_names={sorted(matching) if any(source is not None for _, source in sources) else 'unavailable'}"
              )
          all_names = [("repository", secrets), ("repository", variables)]
          all_names.extend((f"environment:{env_name}", names) for env_name, pair in environment_scopes.items() for names in pair)
          discovery_names = sorted(
              f"{scope}:{name}" for scope, names in all_names if names is not None for name in names
              if any(marker in name.upper() for marker in (
                  "THORIO_DISCOVERY_", "THORIO_BROWSER_DISCOVERY_TARGETS",
                  "THORIO_REVENUE_BROWSER_TARGETS", "THORIO_REVENUE_BROWSER_INBOUND_TARGETS",
                  "THORIO_REVENUE_TRANSPORT_MODE", "THORIO_REVENUE_TRANSPORT_URL",
              ))
          )
          print("DISCOVERY/INBOUND CONFIG NAMES PRESENT: " + json.dumps(discovery_names))
          print(
              "CONFIG NAME INVENTORY: "
              f"repository_secrets_api={'available' if secrets is not None else 'unavailable'} "
              f"repository_variables_api={'available' if variables is not None else 'unavailable'} "
              f"environment_names_api={'available' if environment_names is not None else 'unavailable'} "
              f"environment_count={len(environment_names or ())}"
          )
          PY
      - name: Verify account authentication configuration
