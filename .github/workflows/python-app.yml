name: Thorio Lead Engine

on:
  # Production runs are deliberately independent from code-push testing.
  # Pushes and pull requests are handled by .github/workflows/ci.yml.
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [thorio-production-run]
  issue_comment:
    types: [created]
  issues:
    types: [opened]

# Production cycles are serialized, but every scheduled/manual cycle is retained.
# GitHub otherwise keeps only one pending run and cancels older pending runs.
concurrency:
  group: thorio-production
  queue: max
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  test:
    name: Production Preflight Tests
    if: github.ref == 'refs/heads/main' && (github.event_name != 'issue_comment' && github.event_name != 'issues' || (github.event_name == 'issue_comment' && github.event.issue.pull_request == null && github.event.issue.title == 'THORIO_PRODUCTION_RUN' && startsWith(github.event.comment.body, 'THORIO_PRODUCTION_RUN')) || (github.event_name == 'issues' && github.event.issue.title == 'THORIO_PRODUCTION_RUN'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          python -m pip install pytest pytest-timeout
      - name: Run pytest
        run: |
          python -m pytest -vv -ra --tb=short --timeout=900 --durations=25

  engine:
    name: Run Lead Engine
    if: github.ref == 'refs/heads/main' && (github.event_name != 'issue_comment' && github.event_name != 'issues' || (github.event_name == 'issue_comment' && github.event.issue.pull_request == null && github.event.issue.title == 'THORIO_PRODUCTION_RUN' && startsWith(github.event.comment.body, 'THORIO_PRODUCTION_RUN')) || (github.event_name == 'issues' && github.event.issue.title == 'THORIO_PRODUCTION_RUN'))
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      AIRTABLE_PAT_CANDIDATE: ${{ secrets.AIRTABLE_PAT }}
      AIRTABLE_BASE_ID: appBHsCquEQImXmLy
      AIRTABLE_LEGACY_BASE_IDS: appoEHF48vTHjCcWF,appxz89RYpxIOpdMD
      # New actionable records go to the dedicated revenue workspace; both older bases remain readable.
      AIRTABLE_LEAD_TABLE: Lead Radar
      LEAD_ENGINE_FREE_SOURCES_ENABLED: "true"
      LEAD_ENGINE_FREE_SOURCE_TIMEOUT: "5"
      THORIO_SOURCE_DETAIL_COLLECTION_DEADLINE_SECONDS: "120"
      LEAD_ENGINE_SYNC_ENABLED: "true"
      LEAD_ENGINE_BATCH_SIZE: "50"
      LEAD_ENGINE_DATA_DIR: "data"
      THORIO_FREE_ONLY: "1"
      THORIO_COMPUTE_COORDINATOR_URL: ${{ secrets.THORIO_COMPUTE_COORDINATOR_URL }}
      THORIO_COMPUTE_AUTH_TOKEN: ${{ secrets.THORIO_COMPUTE_AUTH_TOKEN }}
      THORIO_COMPUTE_HTTP_TIMEOUT: "20"
      THORIO_COMPUTE_BRIDGE_DEADLINE_SECONDS: "45"
      THORIO_BROWSER_CDP_URL: "http://127.0.0.1:9222"
      THORIO_BROWSER_CDP_PORT: "9222"
      THORIO_BROWSER_STORAGE_STATE_PATH: "data/browser-state.json"
      THORIO_BROWSER_DISCOVERY_TARGETS: ${{ vars.THORIO_BROWSER_DISCOVERY_TARGETS || secrets.THORIO_BROWSER_DISCOVERY_TARGETS }}
      THORIO_DISCOVERY_X_SIGNAL_ENABLED: ${{ vars.THORIO_DISCOVERY_X_SIGNAL_ENABLED || secrets.THORIO_DISCOVERY_X_SIGNAL_ENABLED }}
      THORIO_DISCOVERY_X_SIGNAL_URL: ${{ vars.THORIO_DISCOVERY_X_SIGNAL_URL || secrets.THORIO_DISCOVERY_X_SIGNAL_URL }}
