name: Thorio Lead Engine

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

# Never allow two runs for the same branch to operate on the
# persistent Lead Engine state at the same time.
#
# cancel-in-progress is intentionally false because a scheduled
# engine run must finish rather than being cancelled halfway
# through processing and state persistence.
concurrency:
  group: thorio-lead-engine-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  test:
    name: Test Lead Engine
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          python -m pip install pytest

      - name: Run pytest
        run: |
          python -m pytest

  engine:
    name: Run Lead Engine
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest

    env:
      AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
      AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
      AIRTABLE_LEAD_TABLE: ${{ secrets.AIRTABLE_LEAD_TABLE }}
      THORIO_LEAD_SOURCE_URL: ${{ secrets.THORIO_LEAD_SOURCE_URL }}
      THORIO_LEAD_SOURCE_TIMEOUT: ${{ secrets.THORIO_LEAD_SOURCE_TIMEOUT }}
      LEAD_ENGINE_SYNC_ENABLED: "true"
      LEAD_ENGINE_BATCH_SIZE: "50"
      LEAD_ENGINE_DATA_DIR: "data"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Find previous completed engine run
        id: previous_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous_run_id="$(
            gh run list \
              --workflow python-app.yml \
              --status completed \
              --limit 50 \
              --json databaseId,headBranch,event \
              --jq '
                map(
                  select(
                    .headBranch == "main"
                    and (
                      .event == "schedule"
                      or .event == "push"
                      or .event == "workflow_dispatch"
                    )
                  )
                )
                | .[0].databaseId // empty
              '
          )"

          echo "run_id=$previous_run_id" >> "$GITHUB_OUTPUT"

          if [ -n "$previous_run_id" ]; then
            echo "Previous completed engine run: $previous_run_id"
          else
            echo "No previous completed engine run found."
          fi

      - name: Download previous Lead Engine state
        if: steps.previous_run.outputs.run_id != ''
        uses: actions/download-artifact@v5
        with:
          name: thorio-lead-engine-state
          path: data
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.previous_run.outputs.run_id }}

      - name: Ensure Lead Engine data directory exists
        run: |
          mkdir -p data

      - name: Run configured Lead Engine sources
        run: |
          python -m lead_engine run

      - name: Save Lead Engine state
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: thorio-lead-engine-state
          path: data
          retention-days: 90
          overwrite: true
          if-no-files-found: warn
