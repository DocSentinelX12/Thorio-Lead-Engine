name: Thorio Lead Engine

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Lead Engine
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          python -m pip install pytest

      - name: Run pytest
        run: |
          python -m pytest

  engine:
    name: Run Lead Engine
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest

    env:
      AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
      AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
      AIRTABLE_LEAD_TABLE: ${{ secrets.AIRTABLE_LEAD_TABLE }}
      LEAD_ENGINE_SYNC_ENABLED: "true"
      LEAD_ENGINE_BATCH_SIZE: "50"
      LEAD_ENGINE_DATA_DIR: "data"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Verify engine configuration
        run: |
          python -m lead_engine status
          python -m lead_engine health

      - name: Run Lead Engine
        run: |
          python -m lead_engine status
