name: Phase 6 fix 3

on:
  push:
    paths:
      - .github/workflows/phase6_fix3.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          python -m pip install pytest pytest-timeout
      - name: Apply Phase 6 patch and candidate gate fix
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/phase6_fix.yml')
          text = workflow.read_text()
          marker = '          python - <<\'PY\'\n'
          body = text.split(marker, 1)[1].split('\n          PY', 1)[0]
          exec(textwrap.dedent(body), {'__name__': '__phase6_patch__'})

          p = Path('lead_engine/dedupe.py')
          s = p.read_text()
          old = '''    def find_exact_duplicate(self, lead: Dict[str, Any]) -> Optional[Dict[str, Any]]:\n        key = self.exact_need_key(lead)\n'''
          new = '''    def find_exact_duplicate(self, lead: Dict[str, Any]) -> Optional[Dict[str, Any]]:\n        # The candidate itself must already be qualified. This prevents the\n        # final gate from being called early and enforces research -> qualify\n        # -> exact-opportunity dedupe ordering.\n        if not self._qualified(lead):\n            return None\n        key = self.exact_need_key(lead)\n'''
          if old not in s:
              raise SystemExit('Candidate qualification gate target not found')
          p.write_text(s.replace(old, new, 1))

          # Remove temporary mutation workflows from the committed tree.
          for name in ('phase6_apply.yml', 'phase6_fix.yml', 'phase6_fix2.yml', 'phase6_diag.yml', 'phase6_fix3.yml'):
              path = Path('.github/workflows') / name
              if path.exists():
                  path.unlink()
          PY
      - name: Run Phase 6 regression tests
        run: python -m pytest -q lead_engine/test_phase6_opportunity_dedupe.py
      - name: Run full test suite
        run: python -m pytest -q
      - name: Commit verified Phase 6 implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lead_engine .github/workflows
          git commit -m 'Enforce strict final-only opportunity deduplication' || exit 0
          git push
