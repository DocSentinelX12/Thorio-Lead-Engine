name: Phase 6 finalize

on:
  push:
    paths:
      - .github/workflows/phase6_finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          python -m pip install pytest pytest-timeout
      - name: Apply complete Phase 6 implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          # Reuse the reviewed Phase 6 patch body.
          source = Path('.github/workflows/phase6_fix.yml').read_text()
          marker = '          python - <<\'PY\'\n'
          body = source.split(marker, 1)[1].split('\n          PY', 1)[0]
          exec(textwrap.dedent(body), {'__name__': '__phase6_patch__'})

          # Strict candidate qualification gate. The final duplicate gate is
          # invalid until BOTH the existing lead and candidate are qualified.
          p = Path('lead_engine/dedupe.py')
          s = p.read_text()
          old = '''    def find_exact_duplicate(self, lead: Dict[str, Any]) -> Optional[Dict[str, Any]]:\n        key = self.exact_need_key(lead)\n'''
          new = '''    def find_exact_duplicate(self, lead: Dict[str, Any]) -> Optional[Dict[str, Any]]:\n        # Deduplication is forbidden until this candidate has completed\n        # research and explicit qualification.\n        if not self._qualified(lead):\n            return None\n        key = self.exact_need_key(lead)\n'''
          if old not in s:
              raise SystemExit('Strict candidate qualification gate was not found')
          p.write_text(s.replace(old, new, 1))

          # Replace the legacy fingerprint-level dedupe test with final-gate rules.
          Path('lead_engine/test_dedupe.py').write_text('''from .dedupe import Dedupe\n\nclass DB:\n    def __init__(self, rows):\n        self.rows = rows\n    def all_leads(self):\n        return list(self.rows)\n\ndef lead(company, person, need, fp, qualified=True):\n    return {\n        "company": company,\n        "person": person,\n        "business_need": need,\n        "fingerprint": fp,\n        "qualified": qualified,\n        "qualification_status": "qualified" if qualified else "in_review",\n    }\n\ndef test_final_dedupe_requires_exact_company_person_need_and_qualification():\n    existing = lead("Acme", "Alex", "AI agents", "1", True)\n    dedupe = Dedupe(DB([existing]))\n    assert dedupe.find_exact_duplicate(lead("Beta", "Alex", "AI agents", "2", True)) is None\n    assert dedupe.find_exact_duplicate(lead("Acme", "Jordan", "AI agents", "3", True)) is None\n    assert dedupe.find_exact_duplicate(lead("Acme", "Alex", "mobile app", "4", True)) is None\n    assert dedupe.find_exact_duplicate(lead("Acme", "Alex", "AI agents", "5", False)) is None\n    assert dedupe.find_exact_duplicate(lead("Acme", "Alex", "AI agents", "6", True)) == existing\n\ndef test_missing_need_never_discards_a_lead():\n    existing = lead("Acme", "Alex", "", "1", True)\n    candidate = lead("Acme", "Alex", "", "2", True)\n    assert Dedupe(DB([existing])).find_exact_duplicate(candidate) is None\n''')

          # Remove every temporary mutation/diagnostic workflow. The normal CI
          # workflow remains untouched.
          for path in Path('.github/workflows').glob('phase6_*.yml'):
              path.unlink()
          PY
      - name: Run Phase 6 regression tests
        run: python -m pytest -q lead_engine/test_phase6_opportunity_dedupe.py lead_engine/test_dedupe.py
      - name: Run full test suite
        run: python -m pytest -q
      - name: Commit verified Phase 6 implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lead_engine .github/workflows
          git commit -m 'Enforce strict final-only opportunity deduplication' || exit 0
          git push
