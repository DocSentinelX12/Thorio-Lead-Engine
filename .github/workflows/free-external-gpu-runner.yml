name: Free External GPU Runner

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch-feature-workflow:
    name: Run Free External GPU Runner on GPU branch
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch GPU branch workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run "free-external-gpu-runner.yml" --repo "${GITHUB_REPOSITORY}" --ref feature/gpu-fabric-foundation
          echo "Dispatched Free External GPU Runner from feature/gpu-fabric-foundation."
