name: Thorio Codex Engineering

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  checks: read
  pull-requests: read

jobs:
  codex-engineer:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout complete repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install project dependencies
        shell: bash
        run: |
          set -e
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi

          if [ -f pyproject.toml ]; then
            pip install -e ".[dev]" 2>/dev/null || pip install -e .
          fi

      - name: Run Codex write-capability test
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          prompt: |
            This is a WRITE-CAPABILITY TEST ONLY.

            Do not inspect, modify, refactor, test, or analyze the Thorio application.

            Create exactly one new file in the repository root:

            CODEX_WRITE_VERIFIED.md

            The file must contain exactly:

            # Codex Write Verification

            This file proves that the OpenAI Codex GitHub Action can write to the
            checked-out repository workspace.

            Do not modify any other file.
            Do not delete anything.
            Do not commit or push anything yourself.

      - name: Show changed files
        shell: bash
        run: |
          git status --short
          git diff --stat

      - name: Commit verified Codex changes
        shell: bash
        run: |
          set -e

          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes were made."
            exit 1
          fi

          git config user.name "Thorio Codex Engineer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add CODEX_WRITE_VERIFIED.md
          git commit -m "Verify Codex repository write access"
          git push
