name: GPU branch surgical fix

on:
  push:
    branches:
      - feature/gpu-fabric-foundation

permissions:
  contents: write

jobs:
  fix:
    if: github.ref == 'refs/heads/feature/gpu-fabric-foundation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Apply exact compute-pool binding fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('lead_engine/compute_pool.py')
          text = path.read_text(encoding='utf-8')
          old = 'VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,0,?)'
          new = 'VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?,0,?)'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one target SQL binding expression, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Commit exact source fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_surgical_gpu_fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lead_engine/compute_pool.py .github/workflows/_surgical_gpu_fix.yml
          git diff --cached --check
          git diff --cached -- lead_engine/compute_pool.py
          git commit -m 'Fix GPU worker registration SQL bindings'
          git push origin HEAD:feature/gpu-fabric-foundation
