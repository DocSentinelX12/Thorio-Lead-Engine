name: GPU Capacity Broker End-to-End Validation

on:
  workflow_dispatch:
    inputs:
      kaggle_jit_secret_configured:
        description: "Confirm Kaggle Notebook Secret THORIO_GITHUB_RUNNER_JIT_TOKEN is set to the rotated GitHub runner-management token."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: autonomous-gpu-capacity-broker-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate-broker:
    name: Validate broker policy and provider readiness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      THORIO_KAGGLE_ENABLED: "1"
      THORIO_KAGGLE_USERNAME: ${{ secrets.THORIO_KAGGLE_USERNAME }}
      KAGGLE_USERNAME: ${{ secrets.THORIO_KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.THORIO_KAGGLE_KEY }}
      THORIO_COMPUTE_COORDINATOR_URL: ${{ secrets.THORIO_COMPUTE_COORDINATOR_URL }}
      THORIO_COMPUTE_AUTH_TOKEN: ${{ secrets.THORIO_COMPUTE_AUTH_TOKEN }}
    steps:
      - name: Check out exact triggering ref
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Install broker test dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          python -m pip install --upgrade pytest kaggle
          kaggle --version

      - name: Verify broker readiness and strict capacity gates
        run: python -m pytest -q tests/test_gpu_capacity_broker.py

  acquire-enroll-verify:
    name: Acquire, enroll, physically verify, and release a real free GPU
    needs: validate-broker
    uses: ./.github/workflows/free-external-gpu-runner.yml
    with:
      kaggle_jit_secret_configured: ${{ inputs.kaggle_jit_secret_configured }}
    secrets: inherit
