name: Full Test Suite (Manual)

on:
  workflow_dispatch:

permissions:
  contents: read

# Full-suite runs share the test queue with CI. Every queued test is preserved.
# queue: max prevents GitHub from replacing older pending verification runs.
concurrency:
  group: thorio-test-queue
  queue: max
  cancel-in-progress: false

jobs:
  test:
    name: Full pytest suite
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          python -m pip install pytest pytest-timeout

      - name: Show complete pytest collection
        run: |
          echo "=============================================="
          echo "PYTEST COLLECTION AUDIT"
          echo "=============================================="
          echo "Selector: ."
          echo "Branch: $GITHUB_REF"
          echo ""
          python -m pytest . --collect-only -q

      - name: Run every collected test
        run: |
          python -m pytest . -vv -ra --tb=short --timeout=900 --durations=25
