name: Full Test Suite (Manual)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      test_path:
        description: "Test path or pytest selector. Leave as . to run the entire discovered suite."
        required: false
        default: "."
        type: string

permissions:
  contents: read

# Full-suite runs are isolated per branch and cancel superseded runs instead of accumulating a pending queue.
concurrency:
  group: thorio-test-queue-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Full pytest suite
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out current branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          python -m pip install pytest pytest-timeout

      - name: Show complete pytest collection
        env:
          TEST_PATH: ${{ inputs.test_path }}
        run: |
          echo "=============================================="
          echo "PYTEST COLLECTION AUDIT"
          echo "=============================================="
          echo "Selector: ${TEST_PATH}"
          echo "Branch: ${GITHUB_REF}"
          echo ""
          python -m pytest "${TEST_PATH}" --collect-only -q

      - name: Run every collected test
        env:
          TEST_PATH: ${{ inputs.test_path }}
        run: |
          python -m pytest "${TEST_PATH}" -vv -ra --tb=short --timeout=900 --durations=25
